/* === STYLE === */
:root {
  /* Same padding, gaps and control size as the other widgets on this board. Water has its own accent. */
  --wt-water: #2f93e0;
  --wt-water-hi: color-mix(in srgb, var(--wt-water) 50%, #fff);
  --wt-water-deep: color-mix(in srgb, var(--wt-water) 80%, #0a3872);
  /* Deeper than the water so the count keeps its contrast once the goal is met. */
  --wt-done: color-mix(in srgb, var(--wt-water) 68%, var(--widget-text));
  --wt-glass: color-mix(in srgb, var(--widget-text) 24%, transparent);
  --wt-glass-hover: color-mix(in srgb, var(--widget-text) 40%, transparent);
  --wt-frost: color-mix(in srgb, var(--widget-text) 3%, transparent);
  --wt-base: color-mix(in srgb, var(--widget-text) 5%, transparent);
  --wt-sheen: color-mix(in srgb, #fff 65%, transparent);
  --wt-tint: color-mix(in srgb, var(--widget-text) 6%, transparent);
  --wt-pad: 20px;
  --wt-section-gap: 16px;
  --wt-inline-gap: 6px;
  --wt-control: 28px;
  --wt-tint-inset: 4px;
  /* Fit to content measures the stage at this size, which leaves the glass as the hero of the tile. */
  --wt-stage-w: 220px;
  --wt-stage-h: 244px;
  --wt-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}

*, *::before, *::after { box-sizing: border-box; }

#root {
  height: 100%;
  padding: var(--wt-pad);
  background: var(--widget-surface);
  color: var(--widget-text);
  font-family: var(--widget-font);
  font-size: var(--widget-font-size);
  line-height: var(--widget-line-height);
  display: flex;
  flex-direction: column;
  gap: var(--wt-section-gap);
  user-select: none;
  -webkit-user-select: none;
}

button {
  font: inherit;
  color: inherit;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

.title {
  margin: 0;
  font-size: var(--widget-title-size);
  font-weight: var(--widget-title-weight);
  line-height: var(--widget-title-line-height);
  text-wrap: balance;
}

/* A size container has no content size of its own, so contain-intrinsic-size is what Fit to content measures. */
.stage {
  flex: 1 1 auto;
  min-height: 0;
  container-type: size;
  contain-intrinsic-size: var(--wt-stage-w) var(--wt-stage-h);
  display: grid;
  place-items: center;
}

/* The glass keeps its proportions and scales as a whole with the frame. */
.glass {
  display: block;
  width: min(100cqw, calc(100cqh * 136 / 168));
  aspect-ratio: 136 / 168;
  border-radius: var(--widget-radius);
  touch-action: manipulation;
}
.glass svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
  transform-origin: 50% 88%;
  transition: transform 160ms var(--wt-ease-out);
}
.glass:active svg { transform: scale(0.97); transition-duration: 100ms; }
.glass:focus-visible { outline: 2px solid var(--wt-water); outline-offset: 2px; }

.frost { fill: var(--wt-frost); }
.base { fill: var(--wt-base); }
.outline, .rim {
  fill: none;
  stroke: var(--wt-glass);
  stroke-width: 1;
  stroke-linejoin: round;
  stroke-linecap: round;
  transition: stroke 150ms ease;
}
.sheen { fill: none; stroke: var(--wt-sheen); stroke-width: 1.6; stroke-linecap: round; opacity: 0.55; }
.wave-back { fill: var(--wt-water); opacity: 0.26; }
.wave-front { opacity: 0.92; }
.stop-hi { stop-color: var(--wt-water-hi); }
.stop-deep { stop-color: var(--wt-water-deep); }
.meniscus { fill: none; stroke: var(--wt-sheen); stroke-width: 0.7; stroke-linecap: round; }
.bubble {
  fill: color-mix(in srgb, #fff 20%, transparent);
  stroke: color-mix(in srgb, #fff 75%, transparent);
  stroke-width: 0.45;
}
.ripple { fill: none; stroke: var(--wt-sheen); stroke-width: 0.8; opacity: 0; }
.spark { fill: var(--wt-water); opacity: 0; }

/* The count sits centred under the glass; the empty first track balances the minus on the right. */
.footer {
  display: grid;
  grid-template-columns: var(--wt-control) minmax(0, 1fr) var(--wt-control);
  align-items: center;
  min-height: var(--wt-control);
}
.count {
  grid-column: 2;
  justify-self: center;
  margin: 0;
  display: flex;
  align-items: baseline;
  gap: var(--wt-inline-gap);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.n {
  display: inline-block;
  font-size: calc(var(--widget-title-size) * 1.6);
  font-weight: 600;
  transform-origin: 50% 80%;
  transition: color 250ms ease;
}
#root.is-done .n { color: var(--wt-done); }
.of {
  display: flex;
  align-items: baseline;
  gap: var(--wt-inline-gap);
  color: var(--widget-text-muted);
  font-size: var(--widget-title-size);
  font-weight: 500;
}
.goal {
  margin-inline: calc(var(--wt-tint-inset) * -1);
  padding: 2px var(--wt-tint-inset);
  border-radius: 6px;
  cursor: text;
  outline: none;
  transition: background-color 120ms ease, color 120ms ease;
}
.goal[contenteditable] { background: var(--wt-tint); color: var(--widget-text); user-select: text; -webkit-user-select: text; }
.goal:focus-visible { background: var(--wt-tint); color: var(--widget-text); }

.minus {
  grid-column: 3;
  width: var(--wt-control);
  height: var(--wt-control);
  display: grid;
  place-items: center;
  border-radius: var(--widget-radius);
  color: var(--widget-text-muted);
  transition: background-color 120ms ease, color 120ms ease, opacity 120ms ease, transform 120ms var(--wt-ease-out);
}
.minus svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
.minus:disabled { opacity: 0.35; cursor: default; }
.minus:not(:disabled):active { transform: scale(0.95); }
.minus:focus-visible { background: var(--wt-tint); color: var(--widget-text); }

@media (hover: hover) and (pointer: fine) {
  .glass:hover .outline, .glass:hover .rim { stroke: var(--wt-glass-hover); }
  .goal:not([contenteditable]):hover { background: var(--wt-tint); color: var(--widget-text); }
  .minus:not(:disabled):hover { background: var(--wt-tint); color: var(--widget-text); }
}

@media (prefers-reduced-motion: reduce) {
  .glass svg, .glass:active svg, .minus:not(:disabled):active { transform: none; transition: none; }
}

    // A slider slides, a list item reorders and a drag across a field selects

    // relays as a drag — the host crosses its threshold and dispatches a real

  post({ type: "ready" });
})();</script><script data-widget-source>
// === STATE ===
const WT_STORE = "water";
const WT_GOAL_MIN = 1;
const WT_GOAL_MAX = 24;
const WT_HISTORY_DAYS = 400;

function wtDayKey(d = new Date()) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function wtLoad() {
  try {
    return JSON.parse(localStorage.getItem(WT_STORE) || "{}");
  } catch {
    return {};
  }
}

// history holds one { count, goal } per finished day, keyed by local date. It is kept, not shown.
const state = Object.assign(
  { date: wtDayKey(), count: 0, goal: 8, celebrated: null, history: {} },
  wtLoad()
);
if (!state.history || typeof state.history !== "object") state.history = {};

function wtSave() {
  try {
    localStorage.setItem(WT_STORE, JSON.stringify(state));
  } catch {}
}

// Closes out a finished day into history and starts today at zero. Returns true when the day changed.
function rollover() {
  const today = wtDayKey();
  if (state.date === today) return false;
  state.history[state.date] = { count: state.count, goal: state.goal };
  const days = Object.keys(state.history).sort();
  for (const day of days.slice(0, Math.max(0, days.length - WT_HISTORY_DAYS))) {
    delete state.history[day];
  }
  state.date = today;
  state.count = 0;
  wtSave();
  return true;
}
rollover();

// === RENDER ===
// Glass geometry in viewBox units: the water line when empty, at the first glass and at the goal.
const WT = { empty: 143, low: 136, high: 22, cx: 60, x0: 14, x1: 106, step: 2, floor: 146 };
const wtReduce = matchMedia("(prefers-reduced-motion: reduce)");
const wtPlural = new Intl.PluralRules();

// Transient motion state. The level and tilt are small springs; t is the wave clock.
const wt = {
  el: null, level: null, vel: 0, tilt: 0, tiltVel: 0, chop: 0,
  t: 0, last: 0, raf: 0, visible: true,
  bubbles: [], nextBubble: 2, celebrateAt: null,
};

function wtEls() {
  if (wt.el) return wt.el;
  const q = (s) => document.querySelector(s);
  wt.el = {
    root: document.getElementById("root"),
    n: q(".n"), goal: q(".goal"), minus: q(".minus"), glass: q(".glass"),
    back: q(".wave-back"), front: q(".wave-front"), meniscus: q(".meniscus"),
    bubbles: q(".bubbles"),
    ripples: [...document.querySelectorAll(".ripple")],
    sparks: [...document.querySelectorAll(".spark")],
  };
  return wt.el;
}

function wtGlasses(n) {
  return `${n} ${wtPlural.select(n) === "one" ? "glass" : "glasses"}`;
}

function wtTarget() {
  if (state.count <= 0) return WT.empty;
  const f = Math.min(state.count / state.goal, 1);
  return WT.low - f * (WT.low - WT.high);
}

function wtAmp() {
  return 0.9 + wt.chop * 1.5;
}

function wtSurface(x, level, t, phase, amp) {
  return level
    + amp * Math.sin(x * 0.085 + t * 1.5 + phase)
    + amp * 0.45 * Math.sin(x * 0.17 - t * 1.05 + phase * 1.7)
    + wt.tilt * (x - WT.cx) / 46;
}

function wtLine(level, t, phase, amp) {
  let d = "";
  for (let x = WT.x0; x <= WT.x1; x += WT.step) {
    d += (d ? "L" : "M") + x + " " + wtSurface(x, level, t, phase, amp).toFixed(2);
  }
  return d;
}

function wtBubble(delay) {
  if (wtReduce.matches) return;
  const node = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  node.setAttribute("class", "bubble");
  const r = 0.7 + Math.random() * 1.1;
  node.setAttribute("r", r.toFixed(2));
  node.style.opacity = "0";
  wtEls().bubbles.appendChild(node);
  wt.bubbles.push({
    node, r, delay, age: 0,
    x: 36 + Math.random() * 48,
    y: 132 + Math.random() * 3,
    vy: 12 + Math.random() * 10,
    ph: Math.random() * Math.PI * 2,
  });
}

function wtStep(dt) {
  // The level rises on a lightly damped spring, so a new glass lands with a little weight.
  wt.vel += (70 * (wtTarget() - wt.level) - 12 * wt.vel) * dt;
  wt.level += wt.vel * dt;
  // The slosh: the surface tips and rocks back to level in about a second and a half.
  wt.tiltVel += (-100 * wt.tilt - 3.6 * wt.tiltVel) * dt;
  wt.tilt += wt.tiltVel * dt;
  wt.chop *= Math.exp(-dt / 0.5);

  wt.nextBubble -= dt;
  if (wt.nextBubble <= 0) {
    if (state.count > 0) wtBubble(0);
    wt.nextBubble = 2 + Math.random() * 3.5;
  }
  const amp = wtAmp();
  wt.bubbles = wt.bubbles.filter((b) => {
    if (b.delay > 0) { b.delay -= dt; return true; }
    b.age += dt;
    b.vy = Math.min(b.vy + 8 * dt, 30);
    b.y -= b.vy * dt;
    const x = b.x + Math.sin(wt.t * 3 + b.ph) * 0.9;
    const gap = b.y - b.r - wtSurface(x, wt.level, wt.t, 0, amp);
    if (gap <= 0) { b.node.remove(); return false; }
    b.node.setAttribute("cx", x.toFixed(2));
    b.node.setAttribute("cy", b.y.toFixed(2));
    b.node.style.opacity = Math.min(1, b.age / 0.3, gap / 5).toFixed(3);
    return true;
  });
}

function wtDrawCelebration(e) {
  const p0 = wt.t - wt.celebrateAt;
  e.ripples.forEach((node, i) => {
    const p = (p0 - i * 0.18) / 0.9;
    if (p <= 0 || p >= 1) { node.style.opacity = "0"; return; }
    const rx = 6 + (1 - Math.pow(1 - p, 3)) * 34;
    node.setAttribute("cy", (wt.level + 0.4).toFixed(2));
    node.setAttribute("rx", rx.toFixed(2));
    node.setAttribute("ry", (rx * 0.085).toFixed(2));
    node.style.opacity = (0.9 * Math.pow(1 - p, 1.4)).toFixed(3);
  });
  e.sparks.forEach((node, i) => {
    const p = (p0 - 0.1 - i * 0.09) / 0.7;
    if (p <= 0 || p >= 1) { node.style.opacity = "0"; return; }
    const k = Math.sin(p * Math.PI);
    const { x, y, s } = node.dataset;
    node.setAttribute("transform", `translate(${x} ${y}) rotate(${(p * 60).toFixed(1)}) scale(${(k * s).toFixed(3)})`);
    node.style.opacity = k.toFixed(3);
  });
  if (p0 > 1.4) wt.celebrateAt = null;
}

function wtDraw() {
  const e = wtEls();
  const amp = wtAmp();
  const close = `L${WT.x1} ${WT.floor}L${WT.x0} ${WT.floor}Z`;
  const front = wtLine(wt.level, wt.t, 0, amp);
  e.front.setAttribute("d", front + close);
  e.meniscus.setAttribute("d", front);
  e.back.setAttribute("d", wtLine(wt.level - 1.1, wt.t * 0.8, 2.2, amp * 1.15) + close);
  if (wt.celebrateAt !== null) wtDrawCelebration(e);
}

// Still frame for reduced motion, a hidden tab or an off-screen tile: settled water, nothing moving.
function wtSettle() {
  const e = wtEls();
  Object.assign(wt, { level: wtTarget(), vel: 0, tilt: 0, tiltVel: 0, chop: 0, celebrateAt: null });
  for (const b of wt.bubbles) b.node.remove();
  wt.bubbles = [];
  for (const node of [...e.ripples, ...e.sparks]) node.style.opacity = "0";
  wtDraw();
}

function wtFrame(now) {
  wt.raf = 0;
  const dt = wt.last ? Math.min((now - wt.last) / 1000, 0.05) : 1 / 60;
  wt.last = now;
  wt.t += dt;
  wtStep(dt);
  wtDraw();
  wtWake();
}

function wtWake() {
  if (wt.raf) return;
  if (wtReduce.matches || document.hidden || !wt.visible) {
    wt.last = 0;
    wtSettle();
    return;
  }
  wt.raf = requestAnimationFrame(wtFrame);
}

function render() {
  const e = wtEls();
  e.root.classList.toggle("is-done", state.count >= state.goal);
  e.n.textContent = String(state.count);
  if (!e.goal.isContentEditable) e.goal.textContent = String(state.goal);
  e.goal.setAttribute("aria-label", `Daily goal, ${wtGlasses(state.goal)}`);
  e.minus.disabled = state.count <= 0;
  e.glass.setAttribute("aria-label", `Add a glass of water. ${state.count} of ${state.goal} today`);
  if (wt.level === null) wt.level = wtTarget();
  wtWake();
}

// === EVENTS ===
const wtE = wtEls();

function set(patch) {
  Object.assign(state, patch);
  wtSave();
  render();
}

function wtSlosh(strength, chop) {
  wt.tiltVel += (Math.random() < 0.5 ? -1 : 1) * strength;
  wt.chop = Math.max(wt.chop, chop);
}

function wtCelebrate() {
  if (wtReduce.matches) return;
  // Starts as the water arrives at the top, then everything settles back to the idle wave.
  wt.celebrateAt = wt.t + 0.3;
  wtE.n.animate(
    [{ transform: "scale(1)" }, { transform: "scale(1.12)" }, { transform: "scale(1)" }],
    { duration: 520, delay: 300, easing: "cubic-bezier(0.23, 1, 0.32, 1)" }
  );
}

function wtAdd() {
  rollover();
  const before = state.count;
  set({ count: before + 1 });
  wtSlosh(48 + Math.random() * 14, 1);
  for (let i = 0; i < 4; i++) wtBubble(0.1 + i * 0.07 + Math.random() * 0.05);
  // Once a day, and only when a glass carries the count over the goal.
  if (before < state.goal && state.count >= state.goal && state.celebrated !== state.date) {
    set({ celebrated: state.date });
    wtCelebrate();
  }
}

function wtRemove() {
  rollover();
  if (state.count <= 0) { render(); return; }
  set({ count: state.count - 1 });
  wtSlosh(22, 0.45);
}

wtE.glass.addEventListener("click", wtAdd);
wtE.minus.addEventListener("click", wtRemove);

// The goal is edited in place: click the number, type, Enter or click away to keep, Escape to cancel.
function wtBeginGoal() {
  const g = wtE.goal;
  if (g.isContentEditable) return;
  g.contentEditable = "plaintext-only";
  if (!g.isContentEditable) g.contentEditable = "true";
  g.focus();
  getSelection().selectAllChildren(g);
}

function wtFinishGoal(cancel) {
  const g = wtE.goal;
  if (!g.isContentEditable) return;
  g.removeAttribute("contenteditable");
  const value = parseInt(g.textContent.replace(/\D/g, ""), 10);
  g.textContent = String(state.goal);
  if (cancel || !Number.isFinite(value)) return;
  const goal = Math.min(WT_GOAL_MAX, Math.max(WT_GOAL_MIN, value));
  if (goal === state.goal) return;
  set({ goal });
  wtSlosh(14, 0.35);
}

wtE.goal.addEventListener("click", wtBeginGoal);
wtE.goal.addEventListener("focusout", () => wtFinishGoal(false));
wtE.goal.addEventListener("keydown", (event) => {
  if (!wtE.goal.isContentEditable) {
    if (event.key === "Enter" || event.key === " ") { event.preventDefault(); wtBeginGoal(); }
    return;
  }
  if (event.key === "Enter" || event.key === "Escape") {
    event.preventDefault();
    wtFinishGoal(event.key === "Escape");
    wtE.goal.blur();
    return;
  }
  if (event.key.length === 1 && !/\d/.test(event.key) && !event.metaKey && !event.ctrlKey) {
    event.preventDefault();
  }
});

// Local midnight: a timer for the moment itself, plus checks for a laptop that slept through it.
function wtCheckDay() {
  if (rollover()) render();
}
(function wtMidnight() {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1);
  setTimeout(() => { wtCheckDay(); wtMidnight(); }, next - now);
})();
setInterval(wtCheckDay, 60000);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) wtCheckDay();
  wtWake();
});
wtReduce.addEventListener("change", wtWake);
if ("IntersectionObserver" in window) {
  new IntersectionObserver((entries) => {
    wt.visible = entries[entries.length - 1].isIntersecting;
    wtWake();
  }).observe(wtE.root);
}
// The shell calls render() once. Do not call it again here.

if (typeof render === "function") { render(); }
</script></body></html>
