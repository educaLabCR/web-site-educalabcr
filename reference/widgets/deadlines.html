/* === STYLE === */
:root {
  /* One source for every value the widget repeats. */
  --dl-hot: #c8372d;
  --dl-hot-hover: color-mix(in srgb, var(--dl-hot) 88%, #000);
  --dl-hot-soft: color-mix(in srgb, var(--dl-hot) 13%, var(--widget-surface));
  --dl-hot-soft-hover: color-mix(in srgb, var(--dl-hot) 20%, var(--widget-surface));
  --dl-hot-ink: color-mix(in srgb, var(--dl-hot) 82%, #000);
  --dl-ring: color-mix(in srgb, var(--widget-text) 35%, transparent);
  --dl-ring-hover: color-mix(in srgb, var(--widget-text) 55%, transparent);
  --dl-tint: color-mix(in srgb, var(--widget-text) 6%, transparent);
  --dl-pad: 20px;
  --dl-section-gap: 16px;
  --dl-row-gap: 6px;
  --dl-col-gap: 12px;
  --dl-row: 28px;
  --dl-check: 20px;
  --dl-control: 28px;
  --dl-pill: 24px;
  --dl-tint-inset: 6px;
  --dl-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --dl-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }

#root {
  height: 100%;
  padding: var(--dl-pad);
  background: var(--widget-surface);
  color: var(--widget-text);
  font-family: var(--widget-font);
  font-size: var(--widget-font-size);
  line-height: var(--widget-line-height);
  display: flex;
  flex-direction: column;
  gap: var(--dl-section-gap);
  user-select: none;
  -webkit-user-select: none;
}

button {
  font: inherit;
  color: inherit;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--dl-section-gap);
}

.title {
  margin: 0;
  font-size: var(--widget-title-size);
  font-weight: var(--widget-title-weight);
  line-height: var(--widget-title-line-height);
}

/* Vertical margins keep the header at title height. */
.add {
  width: var(--dl-control);
  height: var(--dl-control);
  margin: -6px 0;
  display: grid;
  place-items: center;
  border-radius: var(--widget-radius);
  color: var(--widget-text-muted);
  transition: background-color 120ms, color 120ms;
}
.add svg { width: 16px; height: 16px; }

/* Rows are subgrids, so the checks, names and countdowns share one set of tracks. */
.list {
  display: grid;
  grid-template-columns: var(--dl-check) minmax(0, 1fr) auto;
  column-gap: var(--dl-col-gap);
  row-gap: var(--dl-row-gap);
}

.row {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: subgrid;
  align-items: center;
  min-height: var(--dl-row);
}

.check {
  position: relative;
  width: var(--dl-check);
  height: var(--dl-check);
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1.5px solid var(--dl-ring);
  color: var(--widget-surface);
  transition: background-color 120ms, border-color 120ms, transform 140ms var(--dl-ease-out);
}
/* A 34px target that stops short of the neighbouring rows. */
.check::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; }
.check svg {
  width: 12px;
  height: 12px;
  opacity: 0;
  transform: scale(0.6);
  transition: opacity 100ms, transform 120ms var(--dl-ease-out);
}
.check[aria-pressed="true"] { background: var(--widget-accent); border-color: var(--widget-accent); }
.check[aria-pressed="true"] svg {
  opacity: 1;
  transform: scale(1);
  transition: opacity 100ms, transform 300ms var(--dl-spring);
}
.check:active { transform: scale(0.94); }

.name {
  justify-self: start;
  margin-inline: calc(var(--dl-tint-inset) * -1);
  padding: 2px var(--dl-tint-inset);
  border-radius: calc(var(--widget-radius) - 2px);
  font-weight: 500;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  text-wrap: pretty;
  cursor: text;
  outline: none;
  transition: background-color 120ms, color 120ms;
}
.name[contenteditable] { background: var(--dl-tint); user-select: text; -webkit-user-select: text; }
.name:empty::before { content: attr(data-placeholder); color: var(--widget-text-muted); font-weight: 400; }
.row.done .name { color: var(--widget-text-muted); text-decoration: line-through; }

.due {
  justify-self: end;
  height: var(--dl-pill);
  padding: 0 8px;
  display: inline-flex;
  align-items: center;
  border-radius: calc(var(--dl-pill) / 2);
  color: var(--widget-text-muted);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  transition: background-color 120ms, color 120ms;
}
.due.soon { background: var(--dl-hot-soft); color: var(--dl-hot-ink); font-weight: 600; }
.due.now { background: var(--dl-hot); color: #fff; font-weight: 600; }

.date {
  justify-self: end;
  height: var(--dl-pill);
  padding: 0 6px;
  border: 0;
  border-radius: calc(var(--dl-pill) / 2);
  background: var(--dl-tint);
  color: var(--widget-text);
  font: inherit;
  font-variant-numeric: tabular-nums;
  color-scheme: var(--widget-color-scheme);
  outline: none;
}

.add:focus-visible, .check:focus-visible, .due:focus-visible, .date:focus-visible, .name:focus-visible {
  outline: 2px solid var(--widget-accent);
  outline-offset: 2px;
}

@media (hover: hover) and (pointer: fine) {
  .add:hover { background: var(--dl-tint); color: var(--widget-text); }
  .name:hover { background: var(--dl-tint); }
  .check:hover { border-color: var(--dl-ring-hover); }
  .check[aria-pressed="true"]:hover { border-color: var(--widget-accent); }
  .due:hover { background: var(--dl-tint); color: var(--widget-text); }
  .due.soon:hover { background: var(--dl-hot-soft-hover); color: var(--dl-hot-ink); }
  .due.now:hover { background: var(--dl-hot-hover); color: #fff; }
}

@media (prefers-reduced-motion: reduce) {
  .check, .check svg, .check[aria-pressed="true"] svg { transition-duration: 0ms; }
  .check:active { transform: none; }
}

function dueLabel(n, key) {
  if (n < 0) return `${daysFmt.format(-n)} late`;
  if (n <= 1) return capital(relFmt.format(n, "day"));
  if (n < 14) return relFmt.format(n, "day");
  return shortFmt.format(parseDay(key));
}

function sorted() {
  return [...state.items].sort(
    (a, b) => Number(a.done) - Number(b.done) || a.due.localeCompare(b.due) || a.created - b.created
  );
}

function render() {
  renderedDay = dayKey(new Date());

  const header = el("div", "header");
  const add = el("button", "add");
  add.type = "button";
  add.dataset.action = "add";
  add.setAttribute("aria-label", "Add deadline");
  add.innerHTML = PLUS;
  header.append(el("h3", "title", "Deadlines"), add);
  root.replaceChildren(header);

  if (!state.items.length) return;

  const list = el("div", "list");
  for (const item of sorted()) {
    const label = item.name || "New deadline";
    const row = el("div", item.done ? "row done" : "row");
    row.dataset.id = item.id;

    const check = el("button", "check");
    check.type = "button";
    check.dataset.action = "toggle";
    check.setAttribute("aria-pressed", String(item.done));
    check.setAttribute("aria-label", `${label} done`);
    check.innerHTML = TICK;

    const name = el("div", "name", item.name);
    name.dataset.placeholder = "New deadline";
    if (item.id === editingId) {
      name.contentEditable = "plaintext-only";
    } else {
      name.tabIndex = 0;
      name.setAttribute("role", "button");
    }

    let due;
    if (item.id === datingId) {
      due = el("input", "date");
      due.type = "date";
      due.value = item.due;
      due.setAttribute("aria-label", `Due date for ${label}`);
    } else {
      const n = daysUntil(item.due);
      const full = fullFmt.format(parseDay(item.due));
      due = el("button", "due", dueLabel(n, item.due));
      due.type = "button";
      due.dataset.action = "due";
      due.title = full;
      due.setAttribute("aria-label", `Due ${full}, change date`);
      if (item.done) due.hidden = true;
      else if (n <= 0) due.classList.add("now");
      else if (n <= 3) due.classList.add("soon");
    }

    row.append(check, name, due);
    list.append(row);
  }
  root.append(list);

  const editing = root.querySelector(".name[contenteditable]");
  if (editing) {
    editing.focus();
    const range = document.createRange();
    range.selectNodeContents(editing);
    range.collapse(false);
    const selection = getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  }
  const dating = root.querySelector(".date");
  if (dating) {
    typedDate = false;
    dating.focus();
    // Opens the calendar where the frame allows it; otherwise the field's own picker button remains.
    try { dating.showPicker(); } catch {}
  }
}

// === EVENTS ===
function save() {
  localStorage.setItem("state", JSON.stringify(state));
}

function find(id) {
  return state.items.find((item) => item.id === id);
}

function remove(id) {
  state.items = state.items.filter((item) => item.id !== id);
}

function focusIn(id, selector) {
  root.querySelector(`.row[data-id="${id}"] ${selector}`)?.focus();
}

// mode: "enter", "blur" or "cancel". Enter on a new deadline goes straight on to its date.
function finishName(node, mode) {
  // Already finished: ignores the focusout that re-rendering fires.
  if (!node.isContentEditable) return;
  node.removeAttribute("contenteditable");
  const id = node.closest(".row").dataset.id;
  const item = find(id);
  const text = node.textContent.replace(/\s+/g, " ").trim();
  const wasNew = id === newId;
  editingId = null;
  newId = null;
  if (item) {
    if (mode === "cancel") { if (wasNew) remove(id); }
    else if (!text) remove(id);
    else {
      item.name = text;
      if (wasNew && mode === "enter") datingId = id;
    }
  }
  save();
  render();
}

function finishDate(input, cancel) {
  if (datingId === null) return;
  const item = find(datingId);
  const id = datingId;
  datingId = null;
  if (item && !cancel && input.value) item.due = input.value;
  save();
  render();
  focusIn(id, ".due");
}

root.addEventListener("click", (event) => {
  const action = event.target.closest("[data-action]");
  if (action) {
    const id = action.closest(".row")?.dataset.id;
    const item = id && find(id);
    if (action.dataset.action === "add") {
      const fresh = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        name: "",
        due: dayKey(addDays(7)),
        done: false,
        doneOn: null,
        created: Date.now(),
      };
      state.items.push(fresh);
      newId = editingId = fresh.id;
      datingId = null;
      render();
    } else if (action.dataset.action === "toggle" && item) {
      item.done = !item.done;
      item.doneOn = item.done ? dayKey(new Date()) : null;
      save();
      render();
      focusIn(id, ".check");
    } else if (action.dataset.action === "due" && item) {
      datingId = id;
      editingId = null;
      render();
    }
    return;
  }
  const name = event.target.closest(".name:not([contenteditable])");
  if (name) {
    editingId = name.closest(".row").dataset.id;
    datingId = null;
    render();
  }
});

root.addEventListener("keydown", (event) => {
  const editing = event.target.closest?.(".name[contenteditable]");
  if (editing) {
    if (event.key === "Enter" || event.key === "Escape") {
      event.preventDefault();
      finishName(editing, event.key === "Escape" ? "cancel" : "enter");
    }
    return;
  }
  const date = event.target.closest?.(".date");
  if (date) {
    if (event.key === "Enter" || event.key === "Escape") {
      event.preventDefault();
      finishDate(date, event.key === "Escape");
    } else {
      typedDate = true;
    }
    return;
  }
  const label = event.target.closest?.(".name:not([contenteditable])");
  if (label && (event.key === "Enter" || event.key === " ")) {
    event.preventDefault();
    editingId = label.closest(".row").dataset.id;
    datingId = null;
    render();
  }
});

// A date picked from the calendar commits at once; a typed date waits for Enter or blur,
// since each typed digit already forms a valid date.
root.addEventListener("change", (event) => {
  const date = event.target.closest?.(".date");
  if (date && !typedDate) finishDate(date, false);
});

root.addEventListener("focusout", (event) => {
  const name = event.target.closest?.(".name[contenteditable]");
  if (name) finishName(name, "blur");
  const date = event.target.closest?.(".date");
  if (date) finishDate(date, false);
});

// Countdowns move on at midnight, and yesterday's ticked items drop off.
function tick() {
  if (document.hidden || editingId || datingId) return;
  if (dayKey(new Date()) === renderedDay) return;
  pruneDone();
  save();
  render();
}
setInterval(tick, 60000);
document.addEventListener("visibilitychange", tick);
// The shell calls render() once. Do not call it again here.

if (typeof render === "function") { render(); }
</script></body></html>
