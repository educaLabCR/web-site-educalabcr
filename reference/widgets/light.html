/* === STYLE === */
:root {
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --pad: 20px;
  --tint: color-mix(in srgb, var(--widget-text) 7%, transparent);
  --rule: color-mix(in srgb, var(--widget-text) 18%, transparent);
  --quiet: color-mix(in srgb, var(--widget-text) 11%, transparent);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --track-h: 6px;
  --thumb: 16px;
  --label-size: calc(var(--widget-font-size) * 0.85);
}

#root {
  position: relative;
  box-sizing: border-box;
  height: 100%;
  padding: var(--pad);
  display: flex;
  flex-direction: column;
  gap: var(--s4);
  background: var(--widget-surface);
  color: var(--widget-text);
  font-family: var(--widget-font);
  font-size: var(--widget-font-size);
  line-height: var(--widget-line-height);
  -webkit-user-select: none;
  user-select: none;
}

/* The light runs edge to edge, so the stage bleeds through the top and side padding. */
.stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 180px;
  margin: calc(var(--pad) * -1) calc(var(--pad) * -1) 0;
  contain: size;
  contain-intrinsic-size: 600px 300px;
}
/* Only the beam and the rainbow take the pointer, and their cursor is what tells the canvas so.
   Everywhere else keeps the inherited cursor and stays a handle for moving the widget. */
.stage[data-mode="aim"] { cursor: grab; touch-action: none; }
.stage[data-mode="pick"] { cursor: crosshair; touch-action: none; }
.stage.is-dragging[data-mode="aim"] { cursor: grabbing; }

.stage canvas,
.wave canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* Words stay hidden until the widget is being used. */
.reveal {
  opacity: 0;
  transition: opacity 200ms var(--ease-out);
}
#root.is-revealed .reveal { opacity: 1; transition-duration: 150ms; }

.spectrum {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}

.wave {
  position: relative;
  height: 36px;
  contain: size;
  contain-intrinsic-size: 560px 36px;
}

.slider {
  position: relative;
  height: 20px;
  cursor: pointer;
  touch-action: none;
  outline: none;
}

.track {
  position: absolute;
  inset-inline: 0;
  top: 50%;
  height: var(--track-h);
  transform: translateY(-50%);
  border-radius: 999px;
  overflow: hidden;
  display: flex;
}
.seg {
  flex: none;
  height: 100%;
  background: var(--quiet);
}
.seg + .seg { box-shadow: inset 1px 0 0 var(--widget-surface); }

.thumb {
  position: absolute;
  top: 50%;
  left: 0;
  width: var(--thumb);
  height: var(--thumb);
  margin: calc(var(--thumb) / -2) 0 0 calc(var(--thumb) / -2);
  border-radius: 50%;
  background: var(--thumb-fill, var(--widget-text));
  box-shadow: 0 0 0 2px var(--widget-surface), 0 0 0 3px var(--rule);
  transition: box-shadow 120ms ease;
}
.slider:focus-visible .thumb {
  box-shadow: 0 0 0 2px var(--widget-surface), 0 0 0 4px var(--widget-accent);
}

/* Band names sit in the bottom padding so hiding them leaves no gap. */
.bands {
  position: absolute;
  inset-inline: 0;
  top: 100%;
  display: flex;
  container-type: inline-size;
}
/* Too narrow for every name: only the current band keeps its label. */
@container (max-width: 480px) {
  .band:not(.is-current) { visibility: hidden; }
}
.band {
  flex: none;
  min-width: 0;
  padding: 1px 0;
  border: 0;
  border-radius: 6px;
  background: none;
  font: inherit;
  font-size: var(--label-size);
  color: var(--widget-text-muted);
  text-align: center;
  cursor: pointer;
  transition: color 120ms ease, background-color 120ms ease;
}
.band.is-current { color: var(--widget-text); }
.band:focus-visible { outline: 2px solid var(--widget-accent); outline-offset: -2px; }
@media (hover: hover) and (pointer: fine) {
  .band:hover { background: var(--tint); color: var(--widget-text); }
}

/* Floats over the open sky above the prism. */
.readout {
  position: absolute;
  top: var(--pad);
  inset-inline: var(--pad);
  pointer-events: none;
  display: flex;
  flex-direction: column;
  gap: var(--s1);
}
.readout-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--s3);
}
.name { font-weight: 600; }
.value {
  color: var(--widget-text-muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.about {
  margin: 0;
  min-height: 2lh;
  color: var(--widget-text-muted);
  text-wrap: pretty;
}

  <p class="about"></p>
</div>

const formatLength = (m) => withUnit(m, [[1e3, "km"], [1, "m"], [1e-2, "cm"], [1e-3, "mm"], [1e-6, "µm"], [1e-9, "nm"], [1e-12, "pm"], [1e-15, "fm"]]);
const formatFrequency = (hz) => withUnit(hz, [[1e21, "ZHz"], [1e18, "EHz"], [1e15, "PHz"], [1e12, "THz"], [1e9, "GHz"], [1e6, "MHz"], [1e3, "kHz"], [1, "Hz"]]);

// Prism optics. Points are [x, y] in CSS px, y pointing down.
const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
const along = (p, d, t) => [p[0] + d[0] * t, p[1] + d[1] * t];
const reflect = (d, n) => along(d, n, -2 * dot(d, n));

// n faces the side the light arrives from; eta = n1 / n2. Null means total internal reflection.
function refract(d, n, eta) {
  const cosi = -dot(d, n);
  const k = 1 - eta * eta * (1 - cosi * cosi);
  if (k < 0) return null;
  const a = eta * cosi - Math.sqrt(k);
  return [eta * d[0] + a * n[0], eta * d[1] + a * n[1]];
}

function hitSegment(p, d, a, b) {
  const e = [b[0] - a[0], b[1] - a[1]];
  const den = d[0] * e[1] - d[1] * e[0];
  if (Math.abs(den) < 1e-9) return null;
  const w = [a[0] - p[0], a[1] - p[1]];
  const t = (w[0] * e[1] - w[1] * e[0]) / den;
  const u = (w[0] * d[1] - w[1] * d[0]) / den;
  return t > 1e-6 && u >= 0 && u <= 1 ? { t, p: along(p, d, t) } : null;
}

function prismGeometry(w, h) {
  const side = Math.min(w * 0.32, (h * 0.6) / 0.866);
  const tall = side * 0.866;
  const cx = w * 0.4;
  const cy = h * 0.58 + tall / 6;
  const top = [cx, cy - (2 * tall) / 3];
  const left = [cx - side / 2, cy + tall / 3];
  const right = [cx + side / 2, cy + tall / 3];
  const edges = [[left, top], [top, right], [right, left]].map(([a, b]) => {
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    let n = [(b[1] - a[1]) / len, -(b[0] - a[0]) / len];
    const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    if (dot([mid[0] - cx, mid[1] - cy], n) < 0) n = [-n[0], -n[1]];
    return { a, b, n };
  });
  return { corners: [top, right, left], edges, entry: [(left[0] + top[0]) / 2, (left[1] + top[1]) / 2] };
}

// Follows one wavelength through the glass, allowing a couple of internal reflections.
function traceRay(geo, d0, n) {
  let d = refract(d0, geo.edges[0].n, 1 / n);
  if (!d) return null;
  let p = geo.entry, from = 0;
  const path = [p];
  for (let bounce = 0; bounce < 3; bounce++) {
    let best = null;
    geo.edges.forEach((e, i) => {
      if (i === from) return;
      const hit = hitSegment(p, d, e.a, e.b);
      if (hit && (!best || hit.t < best.t)) best = { ...hit, i };
    });
    if (!best) return null;
    p = best.p; from = best.i; path.push(p);
    const n0 = geo.edges[best.i].n;
    const out = refract(d, [-n0[0], -n0[1]], n);
    if (out) return { path, exit: p, dir: out, face: best.i };
    d = reflect(d, n0);
  }
  return null;
}

const refractiveIndex = (nm) => GLASS.a + GLASS.b / Math.pow(nm / 1000, 2);

function fitCanvas(canvas) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  const pw = Math.max(1, Math.round(w * dpr)), ph = Math.max(1, Math.round(h * dpr));
  if (canvas.width !== pw || canvas.height !== ph) { canvas.width = pw; canvas.height = ph; }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

function reach(p, d, w, h) {
  const ts = [];
  if (d[0] > 1e-9) ts.push((w - p[0]) / d[0]);
  if (d[0] < -1e-9) ts.push(-p[0] / d[0]);
  if (d[1] > 1e-9) ts.push((h - p[1]) / d[1]);
  if (d[1] < -1e-9) ts.push(-p[1] / d[1]);
  return Math.max(0, Math.min(...ts));
}

// === RENDER ===
const stage = root.querySelector(".stage");
const stageCanvas = stage.querySelector("canvas");
const waveCanvas = root.querySelector(".wave canvas");
const slider = root.querySelector(".slider");
const track = root.querySelector(".track");
const thumb = root.querySelector(".thumb");
const bandsRow = root.querySelector(".bands");
const nameEl = root.querySelector(".name");
const valueEl = root.querySelector(".value");
const aboutEl = root.querySelector(".about");

// Canvas needs resolved colours, so theme variables are read through a hidden probe.
const probe = document.createElement("span");
probe.hidden = true;
root.append(probe);
function themeColour(name) {
  probe.style.color = `var(${name})`;
  const parts = getComputedStyle(probe).color.match(/[\d.]+/g) || ["0", "0", "0"];
  const nums = parts.map(Number);
  // color(srgb r g b) computes to 0-1 channels; rgb() to 0-255.
  return getComputedStyle(probe).color.startsWith("color(") ? nums.slice(0, 3).map((v) => v * 255) : nums.slice(0, 3);
}
const rgba = (c, a) => `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
const isDark = (c) => (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255 < 0.45;

let fan = null; // exit rays from the last draw, for picking a colour by pointer
const glow = document.createElement("canvas");

function drawStage() {
  const { ctx, w, h } = fitCanvas(stageCanvas);
  ctx.clearRect(0, 0, w, h);
  if (w < 40 || h < 40) return;
  const ink = themeColour("--widget-text");
  const dark = isDark(themeColour("--widget-surface"));
  const geo = prismGeometry(w, h);
  const d0 = [Math.cos(state.aim), Math.sin(state.aim)];
  const [top, right, left] = geo.corners;
  const glass = () => {
    ctx.beginPath();
    ctx.moveTo(top[0], top[1]); ctx.lineTo(right[0], right[1]); ctx.lineTo(left[0], left[1]);
    ctx.closePath();
  };

  const body = ctx.createLinearGradient(top[0], top[1], top[0], left[1]);
  body.addColorStop(0, rgba(ink, dark ? 0.1 : 0.06));
  body.addColorStop(1, rgba(ink, dark ? 0.03 : 0.02));
  glass(); ctx.fillStyle = body; ctx.fill();

  // Incoming white light, with the faint glint glass always reflects.
  const back = [-d0[0], -d0[1]];
  const source = along(geo.entry, back, reach(geo.entry, back, w, h) + 2);
  ctx.lineCap = "round";
  ctx.strokeStyle = rgba(ink, 0.09); ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(...source); ctx.lineTo(...geo.entry); ctx.stroke();
  ctx.strokeStyle = rgba(ink, 0.95); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(...source); ctx.lineTo(...geo.entry); ctx.stroke();
  const glint = reflect(d0, geo.edges[0].n);
  const glintEnd = along(geo.entry, glint, Math.min(48, reach(geo.entry, glint, w, h)));
  const g = ctx.createLinearGradient(...geo.entry, ...glintEnd);
  g.addColorStop(0, rgba(ink, 0.16)); g.addColorStop(1, rgba(ink, 0));
  ctx.strokeStyle = g; ctx.lineWidth = 1.25;
  ctx.beginPath(); ctx.moveTo(...geo.entry); ctx.lineTo(...glintEnd); ctx.stroke();

  const rays = [];
  for (let nm = 405; nm <= 690; nm += 2.5) {
    rays.push({ nm, rgb: spectrumRGB(nm), ray: traceRay(geo, d0, refractiveIndex(nm)) });
  }

  // Inside the glass the colours still overlap, so they add back towards white.
  ctx.save();
  glass(); ctx.clip();
  ctx.globalCompositeOperation = dark ? "lighter" : "source-over";
  ctx.lineWidth = 2;
  for (const { rgb, ray } of rays) {
    if (!ray) continue;
    ctx.strokeStyle = rgba(rgb, dark ? 0.05 : 0.035);
    ctx.beginPath(); ctx.moveTo(...ray.path[0]);
    for (const p of ray.path.slice(1)) ctx.lineTo(...p);
    ctx.stroke();
  }
  ctx.restore();

  // Out of the glass each colour leaves at its own angle: one smooth conic sweep, faded with distance.
  // Steep aims can send light out through the base; the fan follows whichever face most colours leave by.
  const faces = [0, 0, 0];
  for (const r of rays) if (r.ray) faces[r.ray.face]++;
  const face = faces.indexOf(Math.max(...faces));
  const exits = rays.filter((r) => r.ray && r.ray.face === face);
  fan = { exits, origin: exits.length ? exits[exits.length >> 1].ray.exit : null, geo, source };
  if (exits.length > 1) {
    const dpr = window.devicePixelRatio || 1;
    if (glow.width !== stageCanvas.width || glow.height !== stageCanvas.height) {
      glow.width = stageCanvas.width; glow.height = stageCanvas.height;
    }
    const g2 = glow.getContext("2d");
    g2.setTransform(dpr, 0, 0, dpr, 0, 0);
    g2.globalCompositeOperation = "source-over";
    g2.clearRect(0, 0, w, h);
    const o = fan.origin;
    const spread = exits.map((r) => ({ rgb: r.rgb, a: Math.atan2(r.ray.dir[1], r.ray.dir[0]) })).sort((x, y) => x.a - y.a);
    const lo = spread[0].a, hi = spread[spread.length - 1].a, start = lo - 0.05;
    const sweep = g2.createConicGradient(start, o[0], o[1]);
    const at = (a) => (a - start) / (Math.PI * 2);
    sweep.addColorStop(at(lo - 0.012), rgba(spread[0].rgb, 0));
    for (const s of spread) sweep.addColorStop(at(s.a), rgba(s.rgb, 1));
    sweep.addColorStop(at(hi + 0.012), rgba(spread[spread.length - 1].rgb, 0));
    const far = Math.hypot(w, h) * 2;
    g2.beginPath();
    g2.moveTo(...o);
    g2.lineTo(...along(o, [Math.cos(lo - 0.02), Math.sin(lo - 0.02)], far));
    g2.lineTo(...along(o, [Math.cos(hi + 0.02), Math.sin(hi + 0.02)], far));
    g2.closePath();
    g2.fillStyle = sweep;
    g2.fill();
    const run = Math.min(reach(o, [Math.cos(lo), Math.sin(lo)], w, h), reach(o, [Math.cos(hi), Math.sin(hi)], w, h));
    const fade = g2.createRadialGradient(...o, 0, ...o, run * 1.05);
    fade.addColorStop(0, "rgba(0,0,0,1)");
    fade.addColorStop(0.4, "rgba(0,0,0,0.9)");
    fade.addColorStop(0.95, "rgba(0,0,0,0)");
    g2.globalCompositeOperation = "destination-in";
    g2.fillStyle = fade;
    g2.fillRect(0, 0, w, h);
    ctx.drawImage(glow, 0, 0, w, h);
    fan.run = run;
  }

  glass();
  ctx.lineJoin = "round";
  ctx.strokeStyle = rgba(ink, dark ? 0.42 : 0.32); ctx.lineWidth = 1;
  ctx.stroke();

  // While in use, a fine needle marks the chosen colour inside the fan.
  if (root.classList.contains("is-revealed") && bandIndexAt(state.t) === VISIBLE) {
    const nm = lambdaAt(state.t) * 1e9;
    const ray = traceRay(geo, d0, refractiveIndex(nm));
    if (ray) {
      const run = Math.min(reach(ray.exit, ray.dir, w, h), fan.run || Infinity);
      const end = along(ray.exit, ray.dir, run * 0.75);
      ctx.strokeStyle = rgba(ink, 0.75); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(...ray.exit); ctx.lineTo(...end); ctx.stroke();
      ctx.fillStyle = rgba(ink, 0.95);
      ctx.beginPath(); ctx.arc(...end, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.font = `${getComputedStyle(root).fontSize} ${getComputedStyle(root).fontFamily}`;
      ctx.textBaseline = "middle";
      const label = `${Math.round(nm)} nm`;
      const tw = ctx.measureText(label).width;
      const lx = Math.min(w - tw - 12, end[0] + 10);
      ctx.fillStyle = rgba(ink, 0.8);
      ctx.fillText(label, lx, Math.min(h - 10, Math.max(10, end[1] - 12)));
    }
  }
}

function render() {
  if (!track.childElementCount) buildSpectrum();
  const lambda = lambdaAt(state.t);
  const index = bandIndexAt(state.t);
  const nm = lambda * 1e9;
  const name = index === VISIBLE ? `${colourName(nm)} light` : BANDS[index].name;
  nameEl.textContent = name;
  valueEl.textContent = `${formatLength(lambda)} · ${formatFrequency(SPEED_OF_LIGHT / lambda)}`;
  aboutEl.textContent = BANDS[index].about;
  thumb.style.left = `${state.t * 100}%`;
  if (index === VISIBLE) thumb.style.setProperty("--thumb-fill", `rgb(${spectrumRGB(nm).join(" ")})`);
  else thumb.style.removeProperty("--thumb-fill");
  bandsRow.querySelectorAll(".band").forEach((b, i) => b.classList.toggle("is-current", i === index));
  slider.setAttribute("aria-valuenow", String(Math.round(state.t * 1000)));
  slider.setAttribute("aria-valuetext", `${name}, ${formatLength(lambda)}`);
  drawStage();
  drawWave(performance.now());
}

// === EVENTS ===
function drawWave(now) {
  const { ctx, w, h } = fitCanvas(waveCanvas);
  ctx.clearRect(0, 0, w, h);
  if (w < 10) return;
  const lambda = lambdaAt(state.t);
  const visible = bandIndexAt(state.t) === VISIBLE;
  const colour = visible ? spectrumRGB(lambda * 1e9) : themeColour("--widget-text-muted");
  // Long waves draw wide, short ones tight; every wave travels at the same speed, like light.
  const period = 120 * Math.pow(5 / 120, state.t);
  const shift = ((now / 1000) * 36) % period;
  const amp = h * 0.32;
  const edge = ctx.createLinearGradient(0, 0, w, 0);
  edge.addColorStop(0, rgba(colour, 0));
  edge.addColorStop(0.08, rgba(colour, 1));
  edge.addColorStop(0.92, rgba(colour, 1));
  edge.addColorStop(1, rgba(colour, 0));
  ctx.strokeStyle = edge; ctx.lineWidth = 1.5; ctx.lineJoin = "round";
  ctx.beginPath();
  const step = Math.max(0.25, Math.min(1, period / 10));
  for (let x = 0; x <= w; x += step) {
    const y = h / 2 + amp * Math.sin((2 * Math.PI * (x - shift)) / period);
    x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
}

function buildSpectrum() {
  const css = (nm) => `rgb(${spectrumRGB(nm).join(" ")})`;
  BANDS.forEach((band, i) => {
    const seg = document.createElement("div");
    seg.className = "seg";
    seg.style.width = `${band.width * 100}%`;
    if (i === VISIBLE) {
      const stops = [];
      for (let k = 0; k <= 12; k++) stops.push(css(700 - k * 25));
      seg.style.background = `linear-gradient(to right, ${stops.join(", ")})`;
    }
    // Infrared and ultraviolet shade towards the colours they border.
    if (i === VISIBLE - 1) seg.style.background = `linear-gradient(to right, var(--quiet) 40%, ${css(700)})`;
    if (i === VISIBLE + 1) seg.style.background = `linear-gradient(to right, ${css(400)}, var(--quiet) 60%)`;
    track.append(seg);
    const label = document.createElement("button");
    label.type = "button";
    label.className = "band";
    label.dataset.band = String(i);
    label.style.width = `${band.width * 100}%`;
    label.textContent = band.label;
    bandsRow.append(label);
  });
}

// Within this range every colour enters the left face and leaves by the right one.
const AIM_MIN = -0.95, AIM_MAX = -0.15;
const commit = (patch) => { Object.assign(state, patch); save(); render(); };
const localPoint = (ev, el) => { const r = el.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };

// Which colour of the fan sits under a point, if any.
function pickAt(p) {
  if (!fan || !fan.origin || p[0] <= fan.origin[0] + 8) return null;
  const angle = Math.atan2(p[1] - fan.origin[1], p[0] - fan.origin[0]);
  let best = null;
  for (const r of fan.exits) {
    const diff = Math.abs(Math.atan2(r.ray.dir[1], r.ray.dir[0]) - angle);
    if (!best || diff < best.diff) best = { nm: r.nm, diff };
  }
  return best && best.diff < 0.12 ? best.nm : null;
}

// Within reach of the incoming beam, which is what you grab to aim it.
function nearBeam(p) {
  if (!fan) return false;
  const a = fan.source, b = fan.geo.entry;
  const d = [b[0] - a[0], b[1] - a[1]];
  const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * d[0] + (p[1] - a[1]) * d[1]) / dot(d, d)));
  return Math.hypot(p[0] - a[0] - d[0] * t, p[1] - a[1] - d[1] * t) < 28;
}
const modeAt = (p) => (pickAt(p) ? "pick" : nearBeam(p) ? "aim" : "");

function aimAt(p) {
  const entry = fan ? fan.geo.entry : null;
  if (!entry || p[0] >= entry[0] - 4) return;
  const aim = Math.atan2(entry[1] - p[1], entry[0] - p[0]);
  commit({ aim: Math.min(AIM_MAX, Math.max(AIM_MIN, aim)) });
}

let gesture = null;
function endGesture() {
  gesture = null;
  stage.classList.remove("is-dragging");
  if (!root.matches(":hover")) reveal(false);
}

stage.addEventListener("pointerdown", (event) => {
  if (gesture || event.button > 0) return;
  const p = localPoint(event, stage);
  const nm = pickAt(p);
  if (!nm && !nearBeam(p)) return;
  gesture = { id: event.pointerId, mode: nm ? "pick" : "aim" };
  stage.dataset.mode = gesture.mode;
  stage.setPointerCapture(event.pointerId);
  stage.classList.add("is-dragging");
  if (nm) commit({ t: tForLambda(nm * 1e-9) });
  else aimAt(p);
});
// The mode is set before any press, since the canvas reads the cursor at the moment of pressing.
// A touch has no hover, but pointerover still arrives first at the same spot.
for (const type of ["pointerover", "pointermove"]) {
  stage.addEventListener(type, (event) => { if (!gesture) stage.dataset.mode = modeAt(localPoint(event, stage)); });
}
stage.addEventListener("pointermove", (event) => {
  const p = localPoint(event, stage);
  if (!gesture) return;
  if (event.pointerId !== gesture.id) return;
  if (gesture.mode === "aim") return aimAt(p);
  const nm = pickAt(p);
  if (nm) commit({ t: tForLambda(nm * 1e-9) });
});
for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) stage.addEventListener(type, endGesture);

let sliding = null;
const slideTo = (event) => {
  const r = slider.getBoundingClientRect();
  commit({ t: Math.min(1, Math.max(0, (event.clientX - r.left) / r.width)) });
};
slider.addEventListener("pointerdown", (event) => {
  if (sliding !== null || event.button > 0) return;
  sliding = event.pointerId;
  slider.setPointerCapture(event.pointerId);
  slideTo(event);
});
slider.addEventListener("pointermove", (event) => { if (event.pointerId === sliding) slideTo(event); });
for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) slider.addEventListener(type, () => { sliding = null; if (!root.matches(":hover")) reveal(false); });
slider.addEventListener("keydown", (event) => {
  const step = event.shiftKey ? 0.05 : 0.005;
  const keys = { ArrowLeft: -step, ArrowDown: -step, ArrowRight: step, ArrowUp: step };
  if (event.key in keys) commit({ t: Math.min(1, Math.max(0, state.t + keys[event.key])) });
  else if (event.key === "Home") commit({ t: 0 });
  else if (event.key === "End") commit({ t: 1 });
  else return;
  event.preventDefault();
});

bandsRow.addEventListener("click", (event) => {
  const button = event.target.closest(".band");
  if (!button) return;
  const band = BANDS[Number(button.dataset.band)];
  commit({ t: band.start + band.width / 2 });
});

window.addEventListener("blur", () => { endGesture(); sliding = null; reveal(false); });

// Hover, focus or touch shows the words; they leave soon after.
let hideTimer = 0;
function reveal(on, after = 500) {
  clearTimeout(hideTimer);
  if (on) {
    if (!root.classList.contains("is-revealed")) { root.classList.add("is-revealed"); drawStage(); }
    return;
  }
  hideTimer = setTimeout(() => {
    // A mouse click focuses too; only keyboard focus keeps the words up.
    if (gesture || sliding !== null || root.querySelector(":focus-visible")) return;
    root.classList.remove("is-revealed");
    drawStage();
  }, after);
}
root.addEventListener("pointerenter", (event) => { if (event.pointerType === "mouse") reveal(true); });
root.addEventListener("pointerleave", (event) => { if (event.pointerType === "mouse") reveal(false); });
root.addEventListener("pointerdown", (event) => { reveal(true); if (event.pointerType !== "mouse") reveal(false, 3000); }, true);
root.addEventListener("focusin", () => reveal(true));
root.addEventListener("focusout", () => reveal(false));

const observer = new ResizeObserver(() => { drawStage(); drawWave(performance.now()); });
observer.observe(stage);
observer.observe(waveCanvas);

// The wave travels until hidden or motion is reduced.
const calm = matchMedia("(prefers-reduced-motion: reduce)");
let running = false;
function tick(now) {
  if (!running) return;
  drawWave(now);
  requestAnimationFrame(tick);
}
function syncMotion() {
  const should = !document.hidden && !calm.matches;
  if (should && !running) { running = true; requestAnimationFrame(tick); }
  if (!should) running = false;
}
document.addEventListener("visibilitychange", syncMotion);
calm.addEventListener("change", syncMotion);
syncMotion();

if (typeof render === "function") { render(); }
</script></body></html>
