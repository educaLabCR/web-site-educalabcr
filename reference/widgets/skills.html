/* === STYLE === */
:root {
  /* Shared with the other widgets: tint, padding, gaps and control size. Each widget has its own accent. */
  --sp-accent: #2563eb;
  --sp-fill: color-mix(in srgb, var(--sp-accent) 14%, transparent);
  --sp-grid: color-mix(in srgb, var(--widget-text) 9%, transparent);
  --sp-grid-strong: color-mix(in srgb, var(--widget-text) 16%, transparent);
  --sp-halo: color-mix(in srgb, var(--sp-accent) 30%, var(--widget-surface));
  --sp-tint: color-mix(in srgb, var(--widget-text) 6%, transparent);
  --sp-pad: 20px;
  --sp-section-gap: 16px;
  --sp-control: 28px;
  --sp-tint-inset: 6px;
  --sp-vertex: 4px;
  --sp-vertex-active: 6px;
  --sp-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }

#root {
  height: 100%;
  padding: var(--sp-pad);
  background: var(--widget-surface);
  color: var(--widget-text);
  font-family: var(--widget-font);
  font-size: var(--widget-font-size);
  line-height: var(--widget-line-height);
  display: flex;
  flex-direction: column;
  gap: var(--sp-section-gap);
  user-select: none;
  -webkit-user-select: none;
}

button {
  font: inherit;
  color: inherit;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-section-gap);
}

.title {
  margin: 0;
  font-size: var(--widget-title-size);
  font-weight: var(--widget-title-weight);
  line-height: var(--widget-title-line-height);
}

.add {
  width: var(--sp-control);
  height: var(--sp-control);
  margin: -6px 0;
  display: grid;
  place-items: center;
  border-radius: var(--widget-radius);
  color: var(--widget-text-muted);
  transition: background-color 120ms, color 120ms, opacity 120ms;
}
.add svg { width: 16px; height: 16px; }
.add:disabled { opacity: 0.4; cursor: default; }

.stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 280px;
  touch-action: none;
}
.stage.has-hover { cursor: grab; }
.stage.is-dragging { cursor: grabbing; }

.chart {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.ring { fill: none; stroke: var(--sp-grid); stroke-width: 1; }
.ring.outer { stroke: var(--sp-grid-strong); }
.spoke { stroke: var(--sp-grid); stroke-width: 1; transition: stroke 120ms; }
.spoke.is-active { stroke: color-mix(in srgb, var(--sp-accent) 45%, transparent); }
.shape { fill: var(--sp-fill); stroke: var(--sp-accent); stroke-width: 2; stroke-linejoin: round; }

.vertex {
  r: var(--sp-vertex);
  fill: var(--sp-accent);
  stroke: var(--widget-surface);
  stroke-width: 2;
  outline: none;
  transition: r 280ms var(--sp-spring), stroke-width 120ms, stroke 120ms;
}
.vertex.is-active { r: var(--sp-vertex-active); }
.vertex:focus-visible { stroke: var(--sp-halo); stroke-width: 4; }

/* Labels are anchored continuously by angle in JS, so they glide as skills are added or removed. */
.labels { position: absolute; inset: 0; pointer-events: none; }
.label {
  position: absolute;
  left: 0;
  top: 0;
  max-width: 45%;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.label[data-align="start"] { align-items: flex-start; text-align: left; }
.label[data-align="end"] { align-items: flex-end; text-align: right; }

/* Negative margins keep the text on the label edge while the tint box reaches past it. */
.name {
  pointer-events: auto;
  margin: -2px calc(var(--sp-tint-inset) * -1);
  padding: 2px var(--sp-tint-inset);
  border-radius: calc(var(--widget-radius) - 2px);
  font-weight: 600;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  cursor: text;
  outline: none;
  transition: background-color 120ms;
}
.name[contenteditable] { background: var(--sp-tint); user-select: text; -webkit-user-select: text; }
.name:empty::before { content: attr(data-placeholder); color: var(--widget-text-muted); }
.name:focus-visible { background: var(--sp-tint); }

.value {
  color: var(--widget-text-muted);
  font-size: calc(var(--widget-font-size) - 2px);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  transition: color 120ms;
}
.label.is-active .value { color: var(--widget-text); }

@media (hover: hover) {
  .add:not(:disabled):hover { background: var(--sp-tint); color: var(--widget-text); }
  .name:hover { background: var(--sp-tint); }
}

@media (prefers-reduced-motion: reduce) {
  .vertex { transition-duration: 0ms; }
}

const SVG_NS = "http://www.w3.org/2000/svg";
let stage = null;
let chart = null;
let rings = [];
let shape = null;

// Labels are measured before the frame has its final size, when they wrap to almost nothing.
// Watching them as well as the stage re-fits the chart once real sizes arrive.
const resizeObserver = new ResizeObserver(() => {
  measureStage();
  measureLabels();
  radius = targetRadius();
  draw();
});

function el(tag, className, text) {
  const node = document.createElement(tag);
  node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function svgEl(parent, tag, className) {
  const node = document.createElementNS(SVG_NS, tag);
  if (className) node.setAttribute("class", className);
  parent.append(node);
  return node;
}

function render() {
  syncDisplay();

  const header = el("div", "header");
  const add = el("button", "add");
  add.type = "button";
  add.dataset.action = "add";
  add.disabled = state.axes.length >= MAX_AXES;
  add.setAttribute("aria-label", "Add skill");
  add.innerHTML =
    '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>';
  header.append(el("h3", "title", "Skills"), add);

  resizeObserver.disconnect();
  stage = el("div", "stage");
  chart = document.createElementNS(SVG_NS, "svg");
  chart.setAttribute("class", "chart");
  rings = RINGS.map((_, i) => svgEl(chart, "path", i === RINGS.length - 1 ? "ring outer" : "ring"));
  const spokes = svgEl(chart, "g");
  shape = svgEl(chart, "path", "shape");
  const vertices = svgEl(chart, "g");
  const labels = el("div", "labels");
  stage.append(chart, labels);

  for (const entry of display) {
    const spoke = svgEl(spokes, "line", "spoke");
    const vertex = svgEl(vertices, "circle", "vertex");
    vertex.dataset.id = entry.id;
    const label = el("div", "label");
    label.dataset.id = entry.id;
    const name = el("div", "name", entry.name);
    name.dataset.placeholder = "New skill";
    const value = el("div", "value", `${Math.round(entry.v)}%`);
    label.append(name, value);
    labels.append(label);
    if (!entry.leaving) {
      vertex.setAttribute("tabindex", "0");
      vertex.setAttribute("role", "slider");
      vertex.setAttribute("aria-label", entry.name || "New skill");
      vertex.setAttribute("aria-valuemin", "0");
      vertex.setAttribute("aria-valuemax", "100");
      if (entry.id === editingId) {
        name.contentEditable = "plaintext-only";
      } else {
        name.tabIndex = 0;
        name.setAttribute("role", "button");
      }
    }
    entry.el = { spoke, vertex, label, value };
  }

  root.replaceChildren(header, stage);
  resizeObserver.observe(stage);
  for (const entry of display) resizeObserver.observe(entry.el.label);
  measureStage();
  measureLabels();
  if (!radius) radius = targetRadius();
  applyActive();
  draw();

  const editing = stage.querySelector(".name[contenteditable]");
  if (editing) {
    editing.focus();
    const range = document.createRange();
    range.selectNodeContents(editing);
    range.collapse(false);
    const selection = getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  }
  schedule();
}

function measureStage() {
  stageSize = { w: stage.clientWidth, h: stage.clientHeight };
  chart.setAttribute("viewBox", `0 0 ${stageSize.w} ${stageSize.h}`);
}

function measureLabels() {
  for (const entry of display) {
    labelSizes.set(entry.id, { w: entry.el.label.offsetWidth, h: entry.el.label.offsetHeight });
  }
}

function draw() {
  const cx = stageSize.w / 2;
  const cy = stageSize.h / 2;
  const angles = anglesOf();
  rings.forEach((ring, i) => ring.setAttribute("d", pathOf(pointsAt(angles, () => RINGS[i]))));
  const outer = pointsAt(angles, () => 1);
  const values = pointsAt(angles, (entry) => entry.v / 100);
  shape.setAttribute("d", pathOf(values));
  const reach = radius + LABEL_GAP;
  display.forEach((entry, i) => {
    const { spoke, vertex, label, value } = entry.el;
    const cos = Math.cos(angles[i]);
    const sin = Math.sin(angles[i]);
    spoke.setAttribute("x1", cx);
    spoke.setAttribute("y1", cy);
    spoke.setAttribute("x2", outer[i][0]);
    spoke.setAttribute("y2", outer[i][1]);
    spoke.style.opacity = entry.w;
    vertex.setAttribute("cx", values[i][0]);
    vertex.setAttribute("cy", values[i][1]);
    vertex.style.opacity = entry.w;
    // Anchor the label's box by angle: start-aligned on the right, end-aligned on the left, centred top and bottom.
    label.style.transform = `translate(${cx + cos * reach}px, ${cy + sin * reach}px) translate(${(cos - 1) * 50}%, ${(sin - 1) * 50}%)`;
    label.style.opacity = entry.w;
    const align = cos > 0.25 ? "start" : cos < -0.25 ? "end" : "center";
    if (label.dataset.align !== align) label.dataset.align = align;
    const shown = `${Math.round(entry.v)}%`;
    if (value.textContent !== shown) value.textContent = shown;
    const axis = axisOf(entry.id);
    if (axis) vertex.setAttribute("aria-valuenow", String(axis.value));
  });
}

function schedule() {
  if (frame) return;
  lastTime = performance.now();
  frame = requestAnimationFrame(tick);
}

function tick(now) {
  frame = 0;
  const dt = Math.min(64, Math.max(0, now - lastTime));
  lastTime = now;
  const k = REDUCED_MOTION ? 1 : 1 - Math.exp(-dt / EASE_MS);
  const kDrag = REDUCED_MOTION ? 1 : 1 - Math.exp(-dt / DRAG_EASE_MS);
  let moving = false;
  const ease = (from, to, epsilon, rate = k) => {
    const next = from + (to - from) * rate;
    if (Math.abs(to - next) < epsilon) return to;
    moving = true;
    return next;
  };
  for (const entry of display) {
    entry.w = ease(entry.w, entry.leaving ? 0 : 1, 0.002);
    const axis = axisOf(entry.id);
    if (axis) entry.v = ease(entry.v, axis.value, 0.05, drag && drag.id === entry.id ? kDrag : k);
  }
  const gone = display.filter((entry) => entry.leaving && entry.w === 0);
  for (const entry of gone) {
    entry.el.spoke.remove();
    entry.el.vertex.remove();
    entry.el.label.remove();
  }
  if (gone.length) display = display.filter((entry) => !gone.includes(entry));
  radius = ease(radius, targetRadius(), 0.1);
  draw();
  if (moving) frame = requestAnimationFrame(tick);
}

// === EVENTS ===
function applyActive() {
  const active = drag ? drag.id : hoverId;
  for (const entry of display) {
    const on = entry.id === active;
    entry.el.vertex.classList.toggle("is-active", on);
    entry.el.spoke.classList.toggle("is-active", on);
    entry.el.label.classList.toggle("is-active", on);
  }
  stage.classList.toggle("has-hover", Boolean(hoverId) && !drag);
  stage.classList.toggle("is-dragging", Boolean(drag));
}

function setHover(id) {
  if (hoverId === id) return;
  hoverId = id;
  applyActive();
}

function offset(event) {
  const rect = stage.getBoundingClientRect();
  return [event.clientX - rect.left - rect.width / 2, event.clientY - rect.top - rect.height / 2];
}

// Anywhere inside the outer ring belongs to the nearest spoke, so every slice is a large target.
function hitAxis(event) {
  const [x, y] = offset(event);
  if (Math.hypot(x, y) > radius + HIT_SLOP) return null;
  const n = state.axes.length;
  const turn = (Math.atan2(y, x) + Math.PI / 2) / (2 * Math.PI);
  return state.axes[((Math.round(turn * n) % n) + n) % n];
}

// The pointer's distance along the locked spoke, so dragging sideways never switches skill.
function valueAlong(axis, event) {
  const [x, y] = offset(event);
  const angle = -Math.PI / 2 + (2 * Math.PI * state.axes.indexOf(axis)) / state.axes.length;
  return clampValue(((x * Math.cos(angle) + y * Math.sin(angle)) / radius) * 100);
}

function startEdit(id) {
  editingId = id;
  render();
}

function finishEdit(name, cancel) {
  const id = name.closest(".label")?.dataset.id;
  const axis = axisOf(id);
  // Re-rendering removes the focused name; this guard ignores the focusout that follows.
  if (!axis || id !== editingId) return;
  editingId = null;
  const text = name.textContent.replace(/\s+/g, " ").trim();
  const remove = (cancel ? id === freshId : !text) && state.axes.length > MIN_AXES;
  if (remove) state.axes = state.axes.filter((item) => item !== axis);
  else if (!cancel && text) axis.name = text;
  freshId = null;
  save();
  render();
}

function endDrag(event) {
  if (!drag) return;
  hoverId = event && event.pointerType === "mouse" ? drag.id : null;
  drag = null;
  save();
  measureLabels();
  applyActive();
  schedule();
}

root.addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  const editing = root.querySelector(".name[contenteditable]");
  if (editing && !editing.contains(event.target)) editing.blur();
  // The blur may have re-rendered, so look up what is under the pointer again.
  const target = document.elementFromPoint(event.clientX, event.clientY);
  if (!target || !stage.contains(target) || target.closest(".name")) return;
  const axis = hitAxis(event);
  if (!axis) return;
  event.preventDefault();
  drag = { id: axis.id, pointerId: event.pointerId };
  axis.value = valueAlong(axis, event);
  applyActive();
  schedule();
});

window.addEventListener("pointermove", (event) => {
  if (drag) {
    if (event.pointerId !== drag.pointerId) return;
    if (event.buttons === 0) return endDrag(event);
    const axis = axisOf(drag.id);
    if (!axis) return endDrag(event);
    const value = valueAlong(axis, event);
    if (value !== axis.value) {
      axis.value = value;
      schedule();
    }
    return;
  }
  if (event.pointerType === "touch") return;
  const over = stage.contains(event.target) && !event.target.closest(".name");
  setHover(over ? (hitAxis(event)?.id ?? null) : null);
});

window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);
window.addEventListener("blur", () => endDrag());
root.addEventListener("pointerleave", () => {
  if (!drag) setHover(null);
});

root.addEventListener("click", (event) => {
  if (event.target.closest('[data-action="add"]')) {
    if (state.axes.length >= MAX_AXES) return;
    const id = "a" + Date.now().toString(36);
    state.axes.push({ id, name: "", value: 50 });
    freshId = id;
    startEdit(id);
    return;
  }
  const name = event.target.closest(".name:not([contenteditable])");
  const id = name?.closest(".label").dataset.id;
  if (id && axisOf(id)) startEdit(id);
});

root.addEventListener("keydown", (event) => {
  const vertex = event.target.closest?.(".vertex");
  if (vertex) {
    const axis = axisOf(vertex.dataset.id);
    if (!axis) return;
    const step = event.shiftKey ? 10 : 1;
    const next = {
      ArrowUp: axis.value + step,
      ArrowRight: axis.value + step,
      ArrowDown: axis.value - step,
      ArrowLeft: axis.value - step,
      Home: 0,
      End: 100,
    }[event.key];
    if (next === undefined) return;
    event.preventDefault();
    axis.value = clampValue(next);
    save();
    schedule();
    return;
  }
  const name = event.target.closest?.(".name");
  if (!name) return;
  if (name.isContentEditable) {
    if (event.key === "Enter" || event.key === "Escape") {
      event.preventDefault();
      finishEdit(name, event.key === "Escape");
    }
  } else if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    startEdit(name.closest(".label").dataset.id);
  }
});

// Typing changes the label's size, which can change how much room the chart has.
root.addEventListener("input", (event) => {
  if (!event.target.closest?.(".name")) return;
  measureLabels();
  schedule();
});

root.addEventListener("focusin", (event) => {
  const vertex = event.target.closest?.(".vertex");
  if (vertex && !drag) setHover(vertex.dataset.id);
});

root.addEventListener("focusout", (event) => {
  if (event.target.closest?.(".vertex")) setHover(null);
  const name = event.target.closest?.(".name[contenteditable]");
  if (name) finishEdit(name, false);
});

if (typeof render === "function") { render(); }
</script></body></html>
