/* === STYLE === */
:root {
  /* Shared with the other widgets: tint, padding, gaps, control size and motion. Each widget has its own accent. */
  --cal-accent: #7c3aed;
  /* Fixed, not the surface: the surface follows the user's fill and can sit too close to the accent. */
  --cal-on-accent: #fff;
  --cal-accent-hover: color-mix(in srgb, var(--cal-accent) 88%, #000);
  --cal-tint: color-mix(in srgb, var(--widget-text) 6%, transparent);
  --cal-outside: color-mix(in srgb, var(--widget-text) 30%, transparent);
  --cal-pad: 20px;
  --cal-section-gap: 16px;
  --cal-control: 28px;
  --cal-tint-inset: 6px;
  --cal-cell: 36px;
  --cal-weekday: 20px;
  --cal-row-gap: 4px;
  --cal-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --cal-ease-in: cubic-bezier(0.4, 0, 1, 1);
}

*, *::before, *::after { box-sizing: border-box; }

#root {
  height: 100%;
  padding: var(--cal-pad);
  background: var(--widget-surface);
  color: var(--widget-text);
  font-family: var(--widget-font);
  font-size: var(--widget-font-size);
  line-height: var(--widget-line-height);
  display: flex;
  flex-direction: column;
  gap: var(--cal-section-gap);
  user-select: none;
  -webkit-user-select: none;
}

button {
  font: inherit;
  color: inherit;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  outline: none;
}
button svg { width: 16px; height: 16px; flex: none; }

/* Header and days share seven equal tracks, so the arrows sit exactly above Fri/Sat-column days. */
.header, .weekdays, .days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
}
.header { align-items: center; }

.heading {
  grid-column: 1 / span 5;
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin: -2px calc(var(--cal-tint-inset) * -1);
  padding: 2px var(--cal-tint-inset);
  border-radius: var(--widget-radius);
  font-size: var(--widget-title-size);
  font-weight: var(--widget-title-weight);
  line-height: var(--widget-title-line-height);
  white-space: nowrap;
  transition: background-color 120ms;
}
.header.has-today .heading { grid-column: 1 / span 4; }
.heading svg { color: var(--widget-text-muted); transition: transform 280ms var(--cal-spring); }
.heading[aria-expanded="true"] svg { transform: rotate(90deg); }

.today, .nav {
  justify-self: center;
  height: var(--cal-control);
  margin: -6px 0;
  border-radius: var(--widget-radius);
  color: var(--widget-text-muted);
  transition: background-color 120ms, color 120ms;
}
.today {
  grid-column: 5;
  padding: 0 var(--cal-tint-inset);
  font-size: calc(var(--widget-font-size) - 2px);
  font-weight: 500;
  white-space: nowrap;
}
.nav { width: var(--cal-control); display: grid; place-items: center; }
.nav[data-action="prev"] { grid-column: 6; }
.nav[data-action="next"] { grid-column: 7; }

/* One fixed height for both views, so changing month or opening the picker never resizes the widget. */
.body { height: calc(var(--cal-weekday) + var(--cal-row-gap) + var(--cal-cell) * 6); }
.month-view { display: flex; flex-direction: column; gap: var(--cal-row-gap); }

.weekdays {
  line-height: var(--cal-weekday);
  color: var(--widget-text-muted);
  font-size: calc(var(--widget-font-size) - 2px);
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  text-align: center;
  white-space: nowrap;
}

.days { grid-auto-rows: var(--cal-cell); }

/* Proportional figures, not tabular: a tabular "1" sits in a full-width slot, so 1, 11 or 14 read off-centre in the circle. */
.day {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
}
.day.outside { color: var(--cal-outside); }
.day.is-today { color: var(--cal-accent); font-weight: 600; }
.day.is-selected { color: var(--cal-on-accent); }

.num, .month {
  position: relative;
  isolation: isolate;
  height: var(--cal-control);
  display: grid;
  place-items: center;
  border-radius: calc(var(--cal-control) / 2);
  transition: background-color 120ms, color 120ms, transform 280ms var(--cal-spring);
}
/* A line box as tall as the text, so uneven leading cannot push the number off the circle's centre. */
.num { width: var(--cal-control); line-height: 1; }
.num::before, .month::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background: var(--cal-accent);
  opacity: 0;
  transform: scale(0.4);
  transition: transform 140ms var(--cal-ease-in), opacity 140ms var(--cal-ease-in), background-color 120ms;
}
.day.is-selected .num::before, .month.is-selected::before {
  opacity: 1;
  transform: scale(1);
  transition: transform 360ms var(--cal-spring), opacity 90ms, background-color 120ms;
}
.day:active .num, .month:active { transform: scale(0.88); transition-duration: 120ms; }

.months {
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(4, minmax(0, 1fr));
  place-items: center;
}
.month { padding: 0 12px; }
.month.is-current { color: var(--cal-accent); font-weight: 600; }
.month.is-selected { color: var(--cal-on-accent); }

.heading:focus-visible, .today:focus-visible, .nav:focus-visible { background: var(--cal-tint); }
.day:focus-visible .num, .month:focus-visible { outline: 2px solid var(--cal-accent); outline-offset: 2px; }

@media (hover: hover) {
  .heading:hover, .today:hover, .nav:hover { background: var(--cal-tint); color: inherit; }
  .heading:hover { color: var(--widget-text); }
  .today:hover, .nav:hover { color: var(--widget-text); }
  .day:hover .num, .month:hover { background: var(--cal-tint); }
  .day.is-selected:hover .num::before, .month.is-selected:hover::before { background: var(--cal-accent-hover); }
}

@media (prefers-reduced-motion: reduce) {
  .num, .month, .num::before, .month::before, .heading svg { transition-duration: 0ms; }
}

  const body = el("div", "body");
  body.append(picking ? monthsView(today) : daysView(today));
  root.replaceChildren(header, body);
  animateEnter(body.firstElementChild);

  if (focusKey && !picking) {
    root.querySelector(`.day[data-key="${focusKey}"]`)?.focus();
  } else if (focusedAction) {
    (root.querySelector(`[data-action="${focusedAction}"]`) || heading).focus();
  }
  focusKey = null;
}

function daysView(today) {
  const todayKey = keyOf(today);
  const start = new Date(view);
  start.setDate(1 - ((view.getDay() - FIRST_DAY + 7) % 7));
  // Always six weeks, so every month is the same height.
  const dates = Array.from({ length: 42 }, (_, i) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
  const inMonth = (date) => date.getMonth() === view.getMonth();
  const keysInMonth = new Set(dates.filter(inMonth).map(keyOf));
  const tabbable = [focusKey, state.selected, todayKey].find((key) => keysInMonth.has(key)) || keyOf(view);

  const weekdays = el("div", "weekdays");
  weekdays.setAttribute("aria-hidden", "true");
  for (const date of dates.slice(0, 7)) weekdays.append(el("div", "", formatWeekday.format(date)));

  const days = el("div", "days");
  days.setAttribute("aria-label", formatMonthYear.format(view));
  for (const date of dates) {
    const key = keyOf(date);
    const day = button("day", null, formatFull.format(date));
    day.dataset.key = key;
    day.classList.toggle("outside", !inMonth(date));
    day.classList.toggle("is-today", key === todayKey);
    day.classList.toggle("is-selected", key === state.selected);
    day.setAttribute("aria-pressed", String(key === state.selected));
    day.tabIndex = key === tabbable ? 0 : -1;
    day.append(el("span", "num", String(date.getDate())));
    days.append(day);
  }

  const wrap = el("div", "month-view");
  wrap.append(weekdays, days);
  return wrap;
}

function monthsView(today) {
  const months = el("div", "months");
  for (let month = 0; month < 12; month += 1) {
    const date = new Date(pickerYear, month, 1);
    const item = button("month", null, formatMonthYear.format(date));
    item.textContent = formatMonth.format(date);
    item.dataset.month = String(month);
    item.classList.toggle("is-current", pickerYear === today.getFullYear() && month === today.getMonth());
    item.classList.toggle("is-selected", pickerYear === view.getFullYear() && month === view.getMonth());
    months.append(item);
  }
  return months;
}

// Months slide in the direction of travel; the picker settles in from a touch of scale.
function animateEnter(node) {
  const kind = enter;
  enter = null;
  if (!kind || REDUCED_MOTION) return;
  const from = { next: "translateX(12px)", prev: "translateX(-12px)", open: "scale(0.97)", close: "scale(1.03)" }[kind];
  node.animate([{ opacity: 0, transform: from }, { opacity: 1, transform: "none" }], {
    duration: 240,
    easing: "cubic-bezier(0.2, 0, 0, 1)",
  });
}

// === EVENTS ===
function showMonth(month, kind) {
  enter = kind || (month > view ? "next" : month < view ? "prev" : null);
  view = month;
  picking = false;
  render();
}

// Selecting toggles classes in place so the fill springs in rather than re-rendering.
function select(key) {
  state.selected = state.selected === key ? null : key;
  save();
  for (const day of root.querySelectorAll(".day")) {
    const on = day.dataset.key === state.selected;
    day.classList.toggle("is-selected", on);
    day.setAttribute("aria-pressed", String(on));
  }
}

root.addEventListener("click", (event) => {
  const action = event.target.closest("[data-action]")?.dataset.action;
  if (action === "pick") {
    picking = !picking;
    pickerYear = view.getFullYear();
    enter = picking ? "open" : "close";
    render();
    return;
  }
  if (action === "today") {
    const current = startOfMonth(new Date());
    if (event.detail === 0) focusKey = keyOf(new Date());
    showMonth(current, picking ? "close" : null);
    return;
  }
  if (action === "prev" || action === "next") {
    const step = action === "next" ? 1 : -1;
    if (picking) {
      pickerYear += step;
      enter = action;
      render();
    } else {
      showMonth(new Date(view.getFullYear(), view.getMonth() + step, 1));
    }
    return;
  }

  const month = event.target.closest(".month");
  if (month) {
    showMonth(new Date(pickerYear, Number(month.dataset.month), 1), "close");
    return;
  }

  const day = event.target.closest(".day");
  if (!day) return;
  if (day.classList.contains("outside")) {
    // A day from a neighbouring month selects it and brings that month into view.
    state.selected = day.dataset.key;
    save();
    if (event.detail === 0) focusKey = day.dataset.key;
    showMonth(startOfMonth(parseKey(day.dataset.key)));
    return;
  }
  select(day.dataset.key);
});

root.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && picking) {
    event.preventDefault();
    picking = false;
    enter = "close";
    render();
    root.querySelector('[data-action="pick"]').focus();
    return;
  }

  const day = event.target.closest?.(".day");
  if (!day) return;
  const date = parseKey(day.dataset.key);
  const moves = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 };
  if (event.key in moves) {
    date.setDate(date.getDate() + moves[event.key]);
  } else if (event.key === "PageUp" || event.key === "PageDown") {
    const target = date.getDate();
    date.setDate(1);
    date.setMonth(date.getMonth() + (event.key === "PageDown" ? 1 : -1));
    const length = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
    date.setDate(Math.min(target, length));
  } else {
    return;
  }
  event.preventDefault();

  const key = keyOf(date);
  const sameMonth = root.querySelector(`.day[data-key="${key}"]:not(.outside)`);
  if (sameMonth) {
    day.tabIndex = -1;
    sameMonth.tabIndex = 0;
    sameMonth.focus();
    return;
  }
  focusKey = key;
  showMonth(startOfMonth(date));
});

// Move the today mark at midnight without disturbing the picker.
setInterval(() => {
  if (!picking && keyOf(new Date()) !== renderedToday) render();
}, 60000);

if (typeof render === "function") { render(); }
</script></body></html>
