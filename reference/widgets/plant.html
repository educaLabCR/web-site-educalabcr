const CAN_POUR = { x: 156, y: 163, angle: -48 };
// Leaves are drawn whole in the shade colour, then the upper half in the light one.
const LEAF = ["M0 0C6 -6.5 15 -8.6 25 0C15 7 6 5.6 0 0Z", "M0 0C6 -6.5 15 -8.6 25 0Q12 1.4 0 0Z"];
const COTY = ["M0 0C2.5 -5.5 10 -7 13.2 -2C14 2.6 6 4.6 0 0Z", "M0 0C2.5 -5.5 10 -7 13.2 -2Q7 0.2 0 0Z"];
let S = null;

function el(tag, attrs, parent) {
  const node = document.createElementNS(NS, tag);
  for (const key in attrs) node.setAttribute(key, attrs[key]);
  if (parent) parent.appendChild(node);
  return node;
}

function leaf(parent, shape = LEAF) {
  const g = el("g", { opacity: 0 }, parent);
  return { g, base: el("path", { d: shape[0] }, g), face: el("path", { d: shape[1] }, g) };
}

function build() {
  const svg = el("svg", { class: "scene", viewBox: "0 10 240 290", preserveAspectRatio: "xMidYMid meet" });
  const clip = el("clipPath", { id: "above-soil" }, el("defs", {}, svg));
  el("rect", { x: -14, y: -14, width: 28, height: 14.8 }, clip);

  el("ellipse", { class: "shadow", cx: PCX + 5, cy: 248.8, rx: 40, ry: 5 }, svg);
  const canShadow = el("ellipse", { class: "shadow", cx: CAN_REST.x + 2, cy: 248.2, rx: 16, ry: 2.8 }, svg);

  const plant = el("g", { class: "hit plant", role: "button", tabindex: 0 }, svg);
  const hitbox = el("rect", { class: "hitbox", x: PCX - 48, width: 96, rx: 14 }, plant);
  const ring = el("rect", { class: "ring", x: PCX - 48, width: 96, rx: 14 }, plant);

  el("path", { d: "M61 193L68 244A24 5 0 0 0 116 244L123 193Z", fill: C.pot }, plant);
  el("path", { d: "M114 193L110 247.3A24 5 0 0 0 116 244L123 193Z", fill: C.potShade }, plant);
  el("path", { d: "M55 184A37 6.5 0 0 0 129 184L129 193A37 6.5 0 0 1 55 193Z", fill: C.rim }, plant);
  el("path", { d: "M121 188A37 6.5 0 0 0 129 184L129 193A37 6.5 0 0 1 121 197Z", fill: C.rimShade }, plant);
  el("ellipse", { cx: PCX, cy: 184, rx: 37, ry: 6.5, fill: C.rimTop }, plant);
  el("ellipse", { cx: PCX, cy: 184.6, rx: 33.5, ry: 5.2, fill: C.inner }, plant);
  const soil = el("ellipse", { cx: PCX, cy: 185.6, rx: 32, ry: 4.1 }, plant);
  const ripples = Array.from({ length: 6 }, () =>
    el("ellipse", { class: "ripple", fill: "none", stroke: C.water, "stroke-width": 0.8, opacity: 0 }, plant)
  );

  const seedClip = el("g", { "clip-path": "url(#above-soil)" }, plant);
  const seed = el("g", {}, seedClip);
  el("ellipse", { rx: 4.8, ry: 3.5, fill: C.seed }, seed);
  el("ellipse", { cx: -1.5, cy: -1.3, rx: 1.8, ry: 0.9, fill: C.seedLight }, seed);
  const crack = el("path", {
    d: "M-1 -3.3L0.3 -1.7L-0.3 -0.5", fill: "none", stroke: C.seedLine, "stroke-width": 0.7, "stroke-linecap": "round",
  }, seed);
  const hook = el("path", {
    d: "M0.3 -3.1C0.4 -6.5 2.6 -7.8 4.4 -6.6", fill: "none", "stroke-width": 1.4, "stroke-linecap": "round",
    pathLength: 1, "stroke-dasharray": "1 1",
  }, seed);

  const stem = el("path", { fill: "none", "stroke-linecap": "round" }, plant);
  const cotyledons = [leaf(plant, COTY), leaf(plant, COTY)];
  const leaves = LEAVES.map(() => leaf(plant));
  const tips = [leaf(plant), leaf(plant)];

  const flower = el("g", { opacity: 0 }, plant);
  const sepals = [leaf(flower), leaf(flower)];
  const bud = el("ellipse", { fill: traits.flower.petal }, flower);
  const head = el("g", { transform: "translate(0 -8.5) scale(1.45 0.9)" }, flower);
  const cos = (deg) => Math.cos((deg * Math.PI) / 180);
  // Petals at the back of the tilted flower are drawn first, in the deeper tone.
  const petals = Array.from({ length: traits.petals }, (_, i) => traits.twist + (i * 360) / traits.petals)
    .sort((a, b) => cos(b) - cos(a))
    .map((angle) => ({
      angle,
      node: el("ellipse", {
        cy: -6.2, rx: 4.3, ry: 6.4, fill: cos(angle) > 0.2 ? traits.flower.back : traits.flower.petal,
      }, head),
    }));
  const heart = el("circle", { fill: traits.flower.heart }, head);

  const label = el("text", { class: "label", "text-anchor": "middle" }, plant);
  const labelDay = el("tspan", { class: "label-day", x: PCX - 3, y: 217 }, label);
  const labelWord = el("tspan", { x: PCX - 3, y: 230 }, label);

  const drops = Array.from({ length: 16 }, () =>
    el("ellipse", { class: "drop", rx: 1.25, ry: 2, fill: C.water, opacity: 0 }, svg)
  );

  const can = el("g", { class: "hit can", role: "button", tabindex: 0 }, svg);
  const inner = el("g", { class: "can-inner" }, can);
  el("rect", { class: "hitbox", x: -35, y: -37, width: 56, height: 44, rx: 12 }, inner);
  el("rect", { class: "ring", x: -35, y: -37, width: 56, height: 44, rx: 12 }, inner);
  el("path", {
    d: "M9.5 -21C21 -25 23 -7 11.8 -6", fill: "none", stroke: C.can, "stroke-width": 3.2, "stroke-linecap": "round",
  }, inner);
  el("path", { d: "M-11.2 -5L-29 -27L-26.2 -29.2L-10.6 -13Z", fill: C.can }, inner);
  el("ellipse", { rx: 3.6, ry: 2.1, fill: C.canInner, transform: "translate(-28.4 -28.8) rotate(-41)" }, inner);
  el("path", { d: "M-12 0L-10.5 -23Q0 -25.5 10.5 -23L12 0Q0 2.5 -12 0Z", fill: C.can }, inner);
  el("path", { d: "M5.5 -24.2L10.5 -23L12 0Q9.3 1.4 6.5 1.8Z", fill: C.canShade }, inner);
  el("ellipse", { cy: -23.4, rx: 9.6, ry: 2.2, fill: C.canInner }, inner);

  root.replaceChildren(svg);
  S = {
    svg, plant, hitbox, ring, soil, ripples, seedClip, seed, crack, hook, stem, cotyledons, leaves, tips,
    flower, sepals, bud, head, petals, heart, labelDay, labelWord, drops, can, canShadow, frameTop: null,
  };
}

// Words, labels and the droop follow the calendar. While water is still falling
// the droop waits, so the plant perks up when the water lands, not on the click.
function sync(applyDroop = motion.pour === null) {
  const st = status();
  S.labelDay.textContent = `Day ${st.day}`;
  S.labelWord.textContent = st.word;
  S.plant.setAttribute("aria-label", `${st.stage}, day ${st.day}, ${st.word}`);
  S.can.setAttribute("aria-label", st.watered ? "Watered today" : "Water the plant");
  S.can.setAttribute("aria-disabled", String(st.watered || motion.pour !== null));
  motion.today = st.today;
  if (applyDroop) motion.droopTarget = st.droop;
}

function render() {
  if (!S) build();
  sync();
  paint(performance.now());
  kick();
}

// === EVENTS ===
const GROW_MS = REDUCE ? 450 : 1900;
// Pouring, in ms from the click: lift, water lands, drips, set back down.
const T = REDUCE
  ? { lift: 1, commit: 0, drip: [-1, -1], back: 1, end: 450 }
  : { lift: 650, commit: 1000, drip: [620, 1650], back: 1750, end: 2350 };
const pt = (p) => `${p[0].toFixed(2)} ${p[1].toFixed(2)}`;
let raf = 0;
let lastFrame = 0;
let lastPaint = 0;
let lastDrop = 0;

function canPose(now) {
  if (motion.pour === null || REDUCE) return { x: CAN_REST.x, y: CAN_REST.y, angle: 0, lift: 0 };
  const t = now - motion.pour;
  const lift = clamp01(t < T.back ? t / T.lift : 1 - (t - T.back) / (T.end - T.back));
  const tilt = t < T.back ? clamp01((t - 200) / 450) : lift;
  const swell = t > T.lift && t < T.back ? Math.sin(((t - T.lift) / (T.back - T.lift)) * Math.PI) * -5 : 0;
  return {
    x: lerp(CAN_REST.x, CAN_POUR.x, easeInOut(lift)),
    y: lerp(CAN_REST.y, CAN_POUR.y, easeOut(lift)),
    angle: CAN_POUR.angle * easeInOut(tilt) + swell,
    lift,
  };
}

function spawnDrop(now) {
  const pose = canPose(now);
  const r = (pose.angle * Math.PI) / 180;
  const [cos, sin] = [Math.cos(r), Math.sin(r)];
  const speed = 24 + Math.random() * 8;
  motion.drops.push({
    x: pose.x - 28.4 * cos + 28.8 * sin + (Math.random() - 0.5) * 2,
    y: pose.y - 28.4 * sin - 28.8 * cos + (Math.random() - 0.5) * 1.5,
    vx: (-0.66 * cos + 0.75 * sin) * speed,
    vy: (-0.66 * sin - 0.75 * cos) * speed + 6,
    floor: 184 + Math.random() * 3,
  });
}

function wetShown(now) {
  if (motion.pour === null) return wetness();
  return lerp(motion.wetFrom, 1, easeOut((now - motion.pour - (REDUCE ? 0 : 650)) / (REDUCE ? 400 : 900)));
}

function step(dt, now) {
  motion.t += dt;
  motion.lean += (motion.leanTarget - motion.lean) * Math.min(1, dt * 2.4);
  motion.wigV += (-70 * motion.wig - 5 * motion.wigV) * dt;
  motion.wig += motion.wigV * dt;
  if (REDUCE) motion.droop = motion.droopTarget;
  else {
    motion.droopV += (28 * (motion.droopTarget - motion.droop) - 7.5 * motion.droopV) * dt;
    motion.droop += motion.droopV * dt;
  }
  const growT = (now - motion.growStart) / GROW_MS;
  motion.grow = growT >= 1 ? motion.growTo : lerp(motion.growFrom, motion.growTo, easeOut(growT));

  if (motion.pour !== null) {
    const t = now - motion.pour;
    if (!motion.committed && t >= T.commit) {
      motion.committed = true;
      motion.growFrom = motion.grow;
      motion.growTo = state.growth;
      motion.growStart = now;
      motion.labelUntil = now + 2800;
      sync(true);
    }
    if (t >= T.drip[0] && t <= T.drip[1] && now - lastDrop > 75) {
      spawnDrop(now);
      lastDrop = now;
    }
    if (t >= T.end) {
      motion.pour = null;
      S.can.classList.remove("busy");
      sync();
    }
  }

  for (const d of motion.drops) {
    d.vy += 380 * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
  }
  motion.drops = motion.drops.filter((d) => {
    if (d.y < d.floor) return true;
    motion.ripples.push({ x: d.x, y: d.floor, born: now });
    return false;
  });
  motion.ripples = motion.ripples.filter((r) => now - r.born < 420).slice(-6);
}

function paint(now) {
  const g = motion.grow;
  const H = stemHeight(REDUCE ? motion.growTo : g);
  const k = H / 100;
  const d = motion.droop;
  const tired = clamp01(d);
  const dir = traits.lean >= 0 ? 1 : -1;
  const sway = REDUCE ? 0 : (Math.sin(motion.t * 0.85) * 0.65 + Math.sin(motion.t * 0.37 + 1.7) * 0.35) * 2.6;
  const bx = PCX + traits.base;
  const by = SOIL_Y;
  const bend = traits.lean * k + (sway + motion.wig + motion.lean) * Math.pow(k, 0.8);
  // The stem is one curve. Drooping arches it over to one side and lets the tip nod.
  const P = [
    [bx, by],
    [bx, by - H * 0.38],
    [bx + bend * 0.55 + d * H * 0.22 * dir, by - H * (0.78 + d * 0.12)],
    [bx + bend + d * H * 0.3 * dir, by - H + d * H * 0.22],
  ];
  const on = H > 0.3;
  const leafColor = mix(C.leaf, C.tired, tired * 0.45);
  const shadeColor = mix(C.leafShade, C.tired, tired * 0.35);
  const stemColor = mix(C.stem, C.tired, tired * 0.4);

  S.stem.setAttribute("opacity", on ? 1 : 0);
  if (on) {
    S.stem.setAttribute("d", `M${pt(P[0])}C${pt(P[1])} ${pt(P[2])} ${pt(P[3])}`);
    S.stem.setAttribute("stroke-width", (1.5 + k * 1.7).toFixed(2));
    S.stem.setAttribute("stroke", stemColor);
  }

  const place = (node, i, h, side, spread, size, p) => {
    node.g.setAttribute("opacity", on && p > 0 ? clamp01(REDUCE ? p : p * 3).toFixed(3) : 0);
    if (!on || p <= 0) return;
    const t = Math.min(1, h / H);
    const [x, y] = bez(P, t);
    const s = REDUCE ? 1 : p;
    const j = traits.jitter[i];
    const flutter = REDUCE ? 0 : Math.sin(motion.t * 1.6 + j[2]) * 2 + motion.wigV * 0.09;
    const angle = bezAngle(P, t) + side * ((spread + j[0]) * (0.25 + 0.75 * s) + d * 42) + flutter;
    const len = size * j[1] * (0.2 + 0.8 * s);
    const wid = side * size * (0.35 + 0.65 * s);
    node.g.setAttribute(
      "transform",
      `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${angle.toFixed(2)}) scale(${len.toFixed(3)} ${wid.toFixed(3)})`
    );
    node.base.setAttribute("fill", shadeColor);
    node.face.setAttribute("fill", leafColor);
  };

  const coty = appear(g, 2, 0.35);
  S.cotyledons.forEach((node, i) => place(node, 6 + i, 20, i ? 1 : -1, 62, 1, coty));
  LEAVES.forEach((spec, i) =>
    place(S.leaves[i], i, spec.h, spec.side * traits.side, 55, spec.size, appear(g, spec.at, spec.delay || 0))
  );
  const bloom = appear(g, 14, 0.25);
  const tip = clamp01((H - 22) / 10) * (1 - bloom);
  S.tips.forEach((node, i) => place(node, i, H, i ? 1 : -1, 22, 0.4, tip));

  S.flower.setAttribute("opacity", on && bloom > 0 ? 1 : 0);
  if (on && bloom > 0) {
    const budP = easeOut(bloom / 0.45);
    const open = easeOut((bloom - 0.45) / 0.55);
    const nod = bezAngle(P, 1) + 90 + dir * tired * 38 + (REDUCE ? 0 : Math.sin(motion.t * 1.1 + 0.6) * 2);
    S.flower.setAttribute("transform", `translate(${pt(P[3])}) rotate(${nod.toFixed(2)})`);
    S.sepals.forEach((node, i) => {
      const side = i ? 1 : -1;
      node.g.setAttribute("opacity", 1);
      node.g.setAttribute("transform", `rotate(${-90 + side * 42}) scale(${(0.4 * budP).toFixed(3)} ${(side * 0.44 * budP).toFixed(3)})`);
      node.base.setAttribute("fill", shadeColor);
      node.face.setAttribute("fill", leafColor);
    });
    S.bud.setAttribute("cy", (-6 * budP).toFixed(2));
    S.bud.setAttribute("rx", (4 * budP).toFixed(2));
    S.bud.setAttribute("ry", (6.2 * budP).toFixed(2));
    S.bud.setAttribute("opacity", (1 - open).toFixed(3));
    S.head.setAttribute("opacity", clamp01(open * 2).toFixed(3));
    const petalScale = (0.45 + 0.55 * open).toFixed(3);
    S.petals.forEach(({ angle, node }) => node.setAttribute("transform", `rotate(${angle.toFixed(1)}) scale(${petalScale})`));
    S.heart.setAttribute("r", (3.3 * (0.5 + 0.5 * open)).toFixed(2));
  }

  const seedShown = clamp01((1.75 - g) / 0.5);
  S.seedClip.setAttribute("opacity", seedShown.toFixed(3));
  if (seedShown > 0) {
    const crack = easeOut(Math.min(g, 1));
    S.seedClip.setAttribute("transform", `translate(${bx.toFixed(2)} ${by})`);
    S.seed.setAttribute("transform", `translate(0 -0.6) rotate(${((sway + motion.lean) * 1.4 + motion.wig * 1.6).toFixed(2)})`);
    S.crack.setAttribute("opacity", crack.toFixed(3));
    S.hook.setAttribute("stroke-dashoffset", (1 - crack).toFixed(3));
    S.hook.setAttribute("stroke", stemColor);
  }

  S.soil.setAttribute("fill", mix(C.soilDry, C.soilWet, wetShown(now)));

  const top = Math.round(Math.min(166, by - H - (bloom > 0 ? 26 : 12) - 6));
  if (top !== S.frameTop) {
    S.frameTop = top;
    for (const rect of [S.hitbox, S.ring]) {
      rect.setAttribute("y", top);
      rect.setAttribute("height", 256 - top);
    }
  }

  const pose = canPose(now);
  S.can.setAttribute("transform", `translate(${pose.x.toFixed(2)} ${pose.y.toFixed(2)}) rotate(${pose.angle.toFixed(2)})`);
  S.canShadow.setAttribute("opacity", (1 - pose.lift * 0.85).toFixed(3));
  S.drops.forEach((node, i) => {
    const drop = motion.drops[i];
    node.setAttribute("opacity", drop ? 0.9 : 0);
    if (!drop) return;
    const angle = (Math.atan2(drop.vy, drop.vx) * 180) / Math.PI - 90;
    node.setAttribute("transform", `translate(${drop.x.toFixed(2)} ${drop.y.toFixed(2)}) rotate(${angle.toFixed(1)})`);
  });
  S.ripples.forEach((node, i) => {
    const ripple = motion.ripples[i];
    node.setAttribute("opacity", 0);
    if (!ripple) return;
    const t = clamp01((now - ripple.born) / 420);
    const rx = 0.8 + t * 3;
    node.setAttribute("cx", ripple.x.toFixed(2));
    node.setAttribute("cy", ripple.y.toFixed(2));
    node.setAttribute("rx", rx.toFixed(2));
    node.setAttribute("ry", (rx * 0.35).toFixed(2));
    node.setAttribute("opacity", (0.7 * (1 - t)).toFixed(3));
  });
  S.svg.classList.toggle("show", now < motion.labelUntil);
}

function busy(now) {
  return (
    motion.pour !== null ||
    now - motion.growStart < GROW_MS ||
    motion.drops.length > 0 ||
    motion.ripples.length > 0 ||
    Math.abs(motion.wig) + Math.abs(motion.wigV) > 0.02 ||
    Math.abs(motion.droop - motion.droopTarget) + Math.abs(motion.droopV) > 0.002 ||
    now < motion.labelUntil
  );
}

// The plant always breathes a little, at about 30fps when nothing else is happening.
// With reduced motion it stays still and the loop only runs while something changes.
function tick(now) {
  raf = 0;
  const dt = lastFrame ? Math.min(0.05, (now - lastFrame) / 1000) : 1 / 60;
  lastFrame = now;
  step(dt, now);
  const active = busy(now);
  if (active || REDUCE || now - lastPaint > 32) {
    paint(now);
    lastPaint = now;
  }
  if (!document.hidden && (active || !REDUCE)) raf = requestAnimationFrame(tick);
}

function kick() {
  if (raf || document.hidden) return;
  lastFrame = 0;
  raf = requestAnimationFrame(tick);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) return kick();
  cancelAnimationFrame(raf);
  raf = 0;
});

// Catches midnight and a slowly drying pot while the canvas stays open.
setInterval(() => {
  if (!S || motion.pour !== null) return;
  const st = status();
  if (st.today !== motion.today || st.droop !== motion.droopTarget) sync();
  if (REDUCE) paint(performance.now());
  kick();
}, 30000);

function sceneX(event) {
  const m = S.svg.getScreenCTM();
  return m ? new DOMPoint(event.clientX, event.clientY).matrixTransform(m.inverse()).x : null;
}

function nudge(fromX) {
  motion.labelUntil = performance.now() + 2200;
  if (!REDUCE) {
    const stemX = PCX + traits.base + traits.lean * (stemHeight(motion.grow) / 100);
    const dir = fromX == null ? (motion.nudge = -motion.nudge) : fromX < stemX ? 1 : -1;
    motion.wigV += dir * 55;
  }
  kick();
}

function water() {
  if (motion.pour !== null || status().watered) return;
  motion.wetFrom = wetness();
  state.growth += 1;
  state.last = dayKey();
  state.lastAt = Date.now();
  save();
  motion.pour = performance.now();
  motion.committed = false;
  S.can.classList.add("busy");
  S.can.setAttribute("aria-disabled", "true");
  kick();
}

root.addEventListener("click", (event) => {
  if (!S) return;
  if (event.target.closest(".can")) water();
  else if (event.target.closest(".plant")) nudge(sceneX(event));
});

root.addEventListener("keydown", (event) => {
  if (event.key !== "Enter" && event.key !== " ") return;
  const target = event.target.closest?.(".hit");
  if (!target) return;
  event.preventDefault();
  if (target.classList.contains("can")) water();
  else nudge(null);
});

// The plant leans a touch toward the pointer, the way it would toward light.
root.addEventListener("pointermove", (event) => {
  if (!S || REDUCE || event.pointerType !== "mouse") return;
  const x = sceneX(event);
  if (x == null) return;
  motion.leanTarget = Math.max(-1, Math.min(1, (x - PCX - traits.base) / 90)) * 3.2;
});
root.addEventListener("pointerleave", () => {
  motion.leanTarget = 0;
});

if (typeof render === "function") { render(); }
</script></body></html>
