:root {
  /* Same padding, gaps, tint and control size as the other widgets on this board. */
  --bs-pad: 20px;
  --bs-section-gap: 16px;
  --bs-group-gap: 24px;

  overflow: hidden;

  background: var(--widget-surface);
  color: var(--widget-text);
  font-family: var(--widget-font);
  font-size: var(--widget-font-size);
  line-height: var(--widget-line-height);
  display: flex;
  flex-direction: column;
  gap: var(--bs-section-gap);
  user-select: none;
  -webkit-user-select: none;

button {

  color: inherit;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  outline: none;
  -webkit-tap-highlight-color: transparent;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--bs-section-gap);

.title {
  margin: 0;
  font-size: var(--widget-title-size);

  height: 16px;

.book[data-band="2"] .spine::before { top: 7px; height: 4px; }

  z-index: 1;
  min-height: 0;

  white-space: nowrap;

  top: 0;

.ed-author { color: var(--widget-text-muted); }
.ed-author:focus { color: var(--widget-text); }

  align-items: baseline;

// === STATE ===
const BS_KEY = "bookshelf";
const BS_MAX_SHELF = 6;
const BS_STACK_SHOWN = 6;
// One soft palette: matched lightness and chroma, so any two spines sit well together.
const BS_COLORS = [
  "oklch(0.78 0.06 25)",
  "oklch(0.8 0.065 60)",
  "oklch(0.83 0.065 95)",
  "oklch(0.79 0.055 145)",
  "oklch(0.79 0.045 195)",
  "oklch(0.76 0.05 245)",
  "oklch(0.76 0.05 295)",
  "oklch(0.8 0.03 75)",
];
const BS_WIDTHS = [30, 32, 34, 36, 38, 40, 42];

function bsId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function bsPick(list) {
  return list[Math.floor(Math.random() * list.length)];
}

function bsBook(fields) {
  return Object.assign(
    { id: bsId(), title: "", author: "", read: 0, total: 0, doneAt: null, color: 0, w: 36, h: 150, band: 0 },
    fields
  );
}

function bsSeed() {
  return [
    bsBook({ title: "The Left Hand of Darkness", author: "Ursula K. Le Guin", read: 212, total: 304, color: 5, w: 36, h: 158, band: 1 }),
    bsBook({ title: "Piranesi", author: "Susanna Clarke", read: 88, total: 272, color: 1, w: 30, h: 138 }),
    bsBook({ title: "The Overstory", author: "Richard Powers", read: 140, total: 502, color: 3, w: 42, h: 166, band: 2 }),
    bsBook({ title: "Tomorrow, and Tomorrow, and Tomorrow", author: "Gabrielle Zevin", read: 300, total: 416, color: 6, w: 38, h: 150 }),
    bsBook({ title: "Braiding Sweetgrass", author: "Robin Wall Kimmerer", read: 408, total: 408, color: 0, w: 36, h: 152, band: 1, doneAt: 1 }),
    bsBook({ title: "Klara and the Sun", author: "Kazuo Ishiguro", read: 303, total: 303, color: 4, w: 32, h: 144, doneAt: 2 }),
  ];
}

const state = (() => {
  try {
    const saved = JSON.parse(localStorage.getItem(BS_KEY) || "null");
    if (saved && Array.isArray(saved.books)) {
      return { books: saved.books.filter((b) => b && b.id).map((b) => bsBook(b)) };
    }
  } catch (e) {}
  return { books: bsSeed() };
})();

function bsSave() {
  try {
    localStorage.setItem(BS_KEY, JSON.stringify({ books: state.books }));
  } catch (e) {}
}

function bsFind(id) {
  return state.books.find((b) => b.id === id);
}

function bsDone(b) {
  return b.total > 0 && b.read >= b.total;
}

function bsPct(b) {
  return b.total > 0 ? Math.min(1, b.read / b.total) : 0;
}

function bsShelf() {
  return state.books.filter((b) => !bsDone(b));
}

// Oldest at the bottom of the stack, newest on top.
function bsStack() {
  return state.books.filter(bsDone).sort((a, b) => (a.doneAt || 0) - (b.doneAt || 0));
}

function bsNewBook() {
  // Size, colour and band are chosen once, so the shelf keeps its look between visits.
  const used = new Set(bsShelf().map((b) => b.color));
  const free = BS_COLORS.map((_, i) => i).filter((i) => !used.has(i));
  return bsBook({
    color: free.length ? bsPick(free) : 0,
    w: bsPick(BS_WIDTHS),
    h: 132 + 2 * Math.floor(Math.random() * 19),
    band: bsPick([0, 0, 1, 2]),
  });
}

// === RENDER ===
// Kept in step with the style: --bs-pad, --bs-lift and --bs-spine-gap.
const BS_PAD = 20;
const BS_LIFT = 6;
const BS_SPINE_GAP = 3;
const BS_EDGE = 4;
const BS_TIP_GAP = 8;
const BS_EDITOR_GAP = 10;
const BS_LEAN_TAN = Math.tan((3 * Math.PI) / 180);
const BS_EASE_OUT = "cubic-bezier(0.23, 1, 0.32, 1)";
const BS_EASE_IN_OUT = "cubic-bezier(0.77, 0, 0.175, 1)";
const bsReduce = matchMedia("(prefers-reduced-motion: reduce)");
const bsPercent = new Intl.NumberFormat(undefined, { style: "percent", maximumFractionDigits: 0 });
const bsCount = new Intl.NumberFormat();
// Transient interaction state; nothing here is saved.
const bsUi = { openId: null, snapshot: null, isNew: false, tipId: null, enterId: null, down: false, scale: 1 };

const bsEl = (() => {
  const q = (s) => document.querySelector(s);
  const fields = {};
  for (const node of document.querySelectorAll(".editor .field")) fields[node.dataset.key] = node;
  return {
    root: document.getElementById("root"),
    add: q(".add"),
    stage: q(".stage"),
    scene: q(".scene"),
    books: q(".books"),
    empty: q(".empty"),
    stack: q(".stack"),
    count: q(".stack-count"),
    slabs: q(".slabs"),
    tip: q(".tip"),
    tipTitle: q(".tip-title"),
    tipAuthor: q(".tip-author"),
    tipPct: q(".tip-pct"),
    editor: q(".editor"),
    edPct: q(".ed-pct"),
    fields,
  };
})();

function bsHash(s) {
  let h = 7;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}

function bsName(b) {
  const title = b.title || "Untitled";
  return b.author ? `${title} by ${b.author}` : title;
}

// Floored, so a book one page from the end never reads 100%.
function bsPercentText(b) {
  return bsPercent.format(Math.floor(bsPct(b) * 100) / 100);
}

function bsNode(id) {
  return id ? bsEl.scene.querySelector(`[data-id="${id}"]`) : null;
}

function bsBookNode(b) {
  const node = document.createElement("button");
  node.type = "button";
  node.className = "book";
  node.dataset.id = b.id;
  node.dataset.band = String(b.band);
  node.style.setProperty("--c", BS_COLORS[b.color % BS_COLORS.length]);
  node.style.setProperty("--w", `${b.w}px`);
  node.style.setProperty("--h", `${b.h}px`);
  node.innerHTML = '<span class="spine"><span class="fill"></span><span class="spine-title"></span></span>';
  return node;
}

function bsPaintBook(node, b) {
  node.style.setProperty("--p", bsPct(b).toFixed(4));
  node.querySelector(".spine-title").textContent = b.title;
  node.setAttribute("aria-label", `${bsName(b)}, ${bsPercentText(b)} read`);
}

function bsSlabNode(b) {
  const node = document.createElement("button");
  node.type = "button";
  node.className = "slab";
  node.dataset.id = b.id;
  // Offset and tilt come from the id, so the stack keeps the same untidy look on every visit.
  const h = bsHash(b.id);
  node.style.setProperty("--c", BS_COLORS[b.color % BS_COLORS.length]);
  node.style.setProperty("--len", `${Math.round(b.h * 0.5)}px`);
  node.style.setProperty("--thick", `${Math.round(b.w * 0.36)}px`);
  node.style.setProperty("--dx", `${(h % 7) - 3}px`);
  node.style.setProperty("--tilt", `${(((h >>> 4) % 5) - 2) * 0.5}deg`);
  node.innerHTML = '<span class="slab-body"></span>';
  return node;
}

function bsPaintSlab(node, b) {
  node.setAttribute("aria-label", `${bsName(b)}, finished`);
}

// Keyed update: surviving nodes stay where they are, so their transitions (a lean, a fill) play out.
function bsSync(list, items, make, paint) {
  const keep = new Set(items.map((b) => b.id));
  for (const node of [...list.children]) if (!keep.has(node.dataset.id)) node.remove();
  const byId = new Map([...list.children].map((node) => [node.dataset.id, node]));
  items.forEach((b, i) => {
    const node = byId.get(b.id) || make(b);
    paint(node, b);
    if (list.children[i] !== node) list.insertBefore(node, list.children[i] || null);

}

function bsCenters() {
  const map = new Map();
  for (const node of bsEl.scene.querySelectorAll("[data-id]")) {
    const r = node.getBoundingClientRect();
    map.set(node.dataset.id, [r.left + r.width / 2, r.top + r.height / 2]);
  }
  return map;
}

// Books that moved glide from where they were; a finished book travels across to the stack.
function bsGlide(before) {
  const enter = bsUi.enterId;
  bsUi.enterId = null;
  for (const node of bsEl.scene.querySelectorAll("[data-id]")) {
    const was = before.get(node.dataset.id);
    if (!was) {
      if (node.dataset.id !== enter) continue;
      node.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: "ease-out" });
      if (!bsReduce.matches) {
        node.animate([{ transform: "translateY(-8px)" }, { transform: "translateY(0)" }], { duration: 220, easing: BS_EASE_OUT, composite: "add" });
      }
      continue;
    }
    if (bsReduce.matches) continue;
    const r = node.getBoundingClientRect();
    const dx = (was[0] - (r.left + r.width / 2)) / bsUi.scale;
    const dy = (was[1] - (r.top + r.height / 2)) / bsUi.scale;
    if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) continue;
    node.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "translate(0, 0)" }], { duration: 280, easing: BS_EASE_IN_OUT, composite: "add" });

}

// On a narrow tile the whole shelf scales down as one picture rather than wrapping.
function bsFit() {
  const { stage, scene } = bsEl;
  scene.style.width = "";
  scene.style.transform = "";
  stage.style.height = "";
  const avail = stage.clientWidth;
  const natural = scene.offsetWidth;
  bsUi.scale = 1;
  if (avail > 0 && natural > avail + 0.5) {
    bsUi.scale = avail / natural;
    scene.style.width = `${natural}px`;
    scene.style.transform = `scale(${bsUi.scale})`;
    stage.style.height = `${scene.offsetHeight * bsUi.scale}px`;
  }

function bsRect(node) {
  const r = node.getBoundingClientRect();
  const o = bsEl.root.getBoundingClientRect();
  return { left: r.left - o.left, top: r.top - o.top, right: r.right - o.left, width: r.width, height: r.height };
}

function bsShowTip(id) {
  const b = bsFind(id);
  const node = bsNode(id);
  if (!b || !node || bsUi.openId) return;
  bsUi.tipId = id;
  bsEl.tipTitle.textContent = b.title || "Untitled";
  bsEl.tipAuthor.textContent = b.author;
  bsEl.tipPct.textContent = bsDone(b) ? "Finished" : bsPercentText(b);
  const r = bsRect(node);
  const top = r.top - (node.classList.contains("book") ? BS_LIFT : 0);
  const W = bsEl.root.clientWidth;
  const tw = bsEl.tip.offsetWidth;
  const th = bsEl.tip.offsetHeight;
  let x = r.left + r.width / 2 - tw / 2;
  let y = Math.max(BS_EDGE, top - BS_TIP_GAP - th);
  if (y + th > top + BS_TIP_GAP) {
    // No room above a tall spine: sit beside it, level with its top.
    x = r.right + BS_TIP_GAP + tw <= W - BS_PAD ? r.right + BS_TIP_GAP : r.left - BS_TIP_GAP - tw;
    y = Math.max(BS_EDGE, top);
  }
  bsEl.tip.style.left = `${Math.max(BS_PAD, Math.min(x, W - BS_PAD - tw))}px`;
  bsEl.tip.style.top = `${y}px`;
  bsEl.tip.classList.add("is-shown");
}

function bsHideTip() {
  bsUi.tipId = null;
  bsEl.tip.classList.remove("is-shown");
}

// The editor opens beside the book it edits, and grows out of it.
function bsPlace() {
  const node = bsNode(bsUi.openId);
  if (!node) return;
  const ed = bsEl.editor;
  const r = bsRect(node);
  const top = r.top - (node.classList.contains("book") ? BS_LIFT : 0);
  const W = bsEl.root.clientWidth;
  const H = bsEl.root.clientHeight;
  const ew = ed.offsetWidth;
  const eh = ed.offsetHeight;
  let x = r.right + BS_EDITOR_GAP;
  let side = "left";
  if (x + ew > W - BS_PAD) {
    x = r.left - BS_EDITOR_GAP - ew;
    side = "right";
    if (x < BS_PAD) {
      x = Math.max(BS_PAD, Math.min(r.left + r.width / 2 - ew / 2, W - BS_PAD - ew));
      side = "center";
    }
  }
  const y = Math.max(BS_PAD, Math.min(top, H - BS_PAD - eh));
  ed.style.left = `${x}px`;
  ed.style.top = `${y}px`;
  ed.style.transformOrigin = `${side} ${Math.round(Math.min(eh, Math.max(0, r.top + r.height / 2 - y)))}px`;

function render() {
  const before = bsCenters();
  const shelf = bsShelf();
  const stack = bsStack();

  bsSync(bsEl.books, shelf, bsBookNode, bsPaintBook);
  shelf.forEach((b, i) => {
    const node = bsEl.books.children[i];
    const leans = shelf.length > 1 && i === shelf.length - 1;
    // Its top rests on the neighbour, so its foot sits a little way out from it.
    const foot = leans ? Math.round(Math.min(b.h, shelf[i - 1].h) * BS_LEAN_TAN - BS_SPINE_GAP) : 0;
    node.classList.toggle("leans", leans);
    node.classList.toggle("is-open", b.id === bsUi.openId);
    node.style.marginLeft = foot > 0 ? `${foot}px` : "";

  bsSync(bsEl.slabs, shown, bsSlabNode, bsPaintSlab);
  shown.forEach((b, i) => bsEl.slabs.children[i].classList.toggle("is-open", b.id === bsUi.openId));
  bsEl.stack.classList.toggle("is-empty", !stack.length);
  bsEl.count.textContent = bsCount.format(stack.length);

  bsEl.add.disabled = shelf.length >= BS_MAX_SHELF;
  bsFit();
  bsGlide(before);

// === EVENTS ===
function bsValue(key) {
  const text = bsEl.fields[key].textContent.replace(/\s+/g, " ").trim();
  if (key === "title" || key === "author") return text;
  const n = parseInt(text.replace(/\D/g, ""), 10);
  return Number.isFinite(n) ? Math.min(n, 99999) : 0;
}

function bsOpen(id, key, isNew) {
  const b = bsFind(id);
  const node = bsNode(id);
  if (!b || !node) return;
  bsHideTip();
  Object.assign(bsUi, { openId: id, isNew: Boolean(isNew), snapshot: Object.assign({}, b) });
  const f = bsEl.fields;
  f.title.textContent = b.title;
  f.author.textContent = b.author;
  f.read.textContent = b.read ? String(b.read) : "";
  f.total.textContent = b.total ? String(b.total) : "";
  bsEl.edPct.textContent = bsPercentText(b);
  node.classList.add("is-open");
  bsPlace();
  bsEl.editor.classList.add("is-open");
  // Pages read opens selected, since moving the bookmark is the usual edit.
  const field = f[key];
  field.focus({ preventScroll: true });
  getSelection().selectAllChildren(field);
  if (key !== "read") getSelection().collapseToEnd();
}

function bsClose(cancel) {
  const id = bsUi.openId;
  if (!id) return;
  const was = bsUi.snapshot;
  const isNew = bsUi.isNew;
  Object.assign(bsUi, { openId: null, snapshot: null, isNew: false });
  bsEl.editor.classList.remove("is-open");
  if (bsEl.editor.contains(document.activeElement)) document.activeElement.blur();
  const i = state.books.findIndex((b) => b.id === id);
  const b = state.books[i];
  if (b && cancel) {
    if (isNew) state.books.splice(i, 1);
    else Object.assign(b, was);
  } else if (b) {
    for (const key of ["title", "author", "read", "total"]) b[key] = bsValue(key);
    if (!b.title) {
      // Clearing the title takes the book away, like clearing a name elsewhere on this board.
      state.books.splice(i, 1);
    } else {
      if (b.total > 0) b.read = Math.min(b.read, b.total);
      b.doneAt = bsDone(b) ? (bsDone(was) ? was.doneAt : Date.now()) : null;
    }
  }
  bsSave();
  render();
}

function bsAdd() {
  bsClose(false);
  if (bsShelf().length >= BS_MAX_SHELF) return;
  const b = bsNewBook();
  state.books.push(b);
  bsUi.enterId = b.id;
  render();
  bsOpen(b.id, "title", true);
}

for (const field of Object.values(bsEl.fields)) {
  try {
    field.contentEditable = "plaintext-only";
  } catch (e) {}
  if (field.contentEditable !== "plaintext-only") field.contentEditable = "true";
}

bsEl.root.addEventListener("click", (event) => {
  if (event.target.closest(".add, .ghost")) {
    bsAdd();
    return;
  }
  const item = event.target.closest(".book[data-id], .slab[data-id]");
  if (!item) return;
  const id = item.dataset.id;
  const again = bsUi.openId === id;
  bsClose(false);
  // A second click on the open book just closes it.
  if (!again && bsFind(id)) bsOpen(id, "read");

// A press anywhere but the editor or a book closes the editor, keeping what was typed.
document.addEventListener("pointerdown", (event) => {
  bsUi.down = true;
  if (!bsUi.openId || bsEl.editor.contains(event.target)) return;
  if (event.target.closest && event.target.closest(".book[data-id], .slab[data-id]")) return;
  bsClose(false);

document.addEventListener("pointerup", bsRelease, true);
document.addEventListener("pointercancel", bsRelease, true);
window.addEventListener("blur", () => {
  bsRelease();
  bsHideTip();

// Focus leaving for somewhere else entirely: Tab out, or a click on the canvas outside the tile.
bsEl.editor.addEventListener("focusout", (event) => {
  if (bsUi.down || bsEl.editor.contains(event.relatedTarget)) return;
  bsClose(false);

  if (event.key !== "Escape" && !(event.key === "Enter" && inField)) return;
  event.preventDefault();
  const id = bsUi.openId;
  bsClose(event.key === "Escape");
  const back = bsNode(id);
  if (back) back.focus({ preventScroll: true });

// Tabbing into a field selects its value, as a text box would; a click keeps its own caret.
bsEl.editor.addEventListener("focusin", (event) => {
  const field = event.target.closest(".field");
  if (field && !bsUi.down) getSelection().selectAllChildren(field);
});

bsEl.editor.addEventListener("beforeinput", (event) => {
  if (event.inputType === "insertParagraph" || event.inputType === "insertLineBreak") {
    event.preventDefault();
    return;
  }
  if (event.target.closest(".ed-num") && event.data && /\D/.test(event.data)) event.preventDefault();
});

// Typing updates the spine in place, so its fill rises and falls with the page count.
bsEl.editor.addEventListener("input", (event) => {
  const field = event.target.closest(".field");
  const b = bsUi.openId && bsFind(bsUi.openId);
  if (!field || !b) return;
  b[field.dataset.key] = bsValue(field.dataset.key);
  const node = bsNode(b.id);
  if (node && node.classList.contains("book")) bsPaintBook(node, b);
  bsEl.edPct.textContent = bsPercentText(b);
});

bsEl.scene.addEventListener("pointerover", (event) => {
  if (event.pointerType === "touch") return;
  const node = event.target.closest("[data-id]");
  if (node && bsUi.tipId !== node.dataset.id) bsShowTip(node.dataset.id);
});
bsEl.scene.addEventListener("pointerout", (event) => {
  const node = event.target.closest("[data-id]");
  if (node && !node.contains(event.relatedTarget)) bsHideTip();
});
bsEl.scene.addEventListener("focusin", (event) => {
  const node = event.target.closest("[data-id]");
  if (node && node.matches(":focus-visible")) bsShowTip(node.dataset.id);
});
bsEl.scene.addEventListener("focusout", (event) => {
  const node = event.target.closest("[data-id]");
  if (node && node.dataset.id === bsUi.tipId && !node.matches(":hover")) bsHideTip();
});

if ("ResizeObserver" in window) {
  const bsResize = new ResizeObserver(() => {
    bsFit();
    if (bsUi.openId) bsPlace();
  });
  for (const node of [bsEl.stage, bsEl.books, bsEl.stack]) bsResize.observe(node);
}
// The shell calls render() once. Do not call it again here.

if (typeof render === "function") { render(); }
</script></body></html>
