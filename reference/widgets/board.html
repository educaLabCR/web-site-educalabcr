/* === STYLE === */
:root {
  --k-pad: 20px;
  --k-section: 16px;
  --k-col-gap: 8px;
  --k-col-pad: 6px;
  --k-col-radius: 12px;
  --k-card-gap: 6px;
  --k-card-radius: 6px;
  --k-card-block: 8px;
  --k-card-inline: 10px;
  --k-head: 24px;
  --k-icon: 16px;
  --k-list-min: 120px;
  --k-column: color-mix(in srgb, var(--widget-text) 5%, var(--widget-surface));
  --k-tint: color-mix(in srgb, var(--widget-text) 3%, var(--widget-surface));
  --k-press: color-mix(in srgb, var(--widget-text) 8%, transparent);
  --k-lift: color-mix(in srgb, var(--widget-text) 14%, transparent);
  --k-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  /* A released card lands with a touch of spring: it was put there by hand. */
  --k-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
}

*, *::before, *::after { box-sizing: border-box; }

#root {
  height: 100%;
  padding: var(--k-pad);
  background: var(--widget-surface);
  color: var(--widget-text);
  font-family: var(--widget-font);
  font-size: var(--widget-font-size);
  line-height: var(--widget-line-height);
  display: flex;
  flex-direction: column;
  gap: var(--k-section);
  user-select: none;
  -webkit-user-select: none;
}
#root.grabbing, #root.grabbing * { cursor: grabbing; }

.title {
  margin: 0;
  font-size: var(--widget-title-size);
  font-weight: var(--widget-title-weight);
  line-height: var(--widget-title-line-height);
  text-wrap: balance;
}

/* Inline-size containment stops a long card from widening the fitted frame; this is the board's natural width. */
.board {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--k-col-gap);
  container-type: inline-size;
  contain-intrinsic-inline-size: 480px;
}

.column {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--k-card-gap);
  padding: var(--k-col-pad);
  border-radius: var(--k-col-radius);
  background: var(--k-column);
}

/* The name starts on the same edge as the card text beneath it. */
.head {
  display: flex;
  align-items: center;
  gap: var(--k-card-gap);
  height: var(--k-head);
  padding-left: var(--k-card-inline);
}
.name { font-weight: 600; }
.count {
  color: var(--widget-text-muted);
  font-variant-numeric: tabular-nums;
}

.add {
  flex: none;
  margin-left: auto;
  width: var(--k-head);
  height: var(--k-head);
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: var(--k-card-radius);
  background: transparent;
  color: var(--widget-text-muted);
  font: inherit;
  cursor: pointer;
  transition: background-color 120ms ease, color 120ms ease, scale 120ms var(--k-ease-out);
}
.add svg { width: var(--k-icon); height: var(--k-icon); }
.add:active { scale: 0.95; }
.add:focus-visible { outline: 2px solid var(--widget-accent); outline-offset: 0; }

/* 2px of padding, given back by the margin, keeps card shadows and focus rings clear of the scroll clip. */
.list {
  position: relative;
  flex: 1 1 auto;
  min-height: var(--k-list-min);
  margin: -2px;
  padding: 2px;
  overflow-y: auto;
  scrollbar-width: none;
  display: flex;
  flex-direction: column;
  gap: var(--k-card-gap);
}

.card {
  flex: none;
  padding: var(--k-card-block) var(--k-card-inline);
  border-radius: var(--k-card-radius);
  background: var(--widget-surface);
  box-shadow: 0 1px 2px var(--k-lift);
  overflow-wrap: anywhere;
  text-wrap: pretty;
  cursor: grab;
  touch-action: none;
  outline: none;
  transition:
    translate 220ms var(--k-ease-out),
    scale 200ms var(--k-ease-out),
    opacity 200ms var(--k-ease-out),
    background-color 120ms ease,
    box-shadow 150ms ease;
}
.card:focus-visible { outline: 2px solid var(--widget-accent); outline-offset: 0; }
.card.enter { opacity: 0; scale: 0.95; }
.card.editing {
  background: var(--k-tint);
  cursor: text;
  user-select: text;
  -webkit-user-select: text;
}

.label {
  display: block;
  min-height: 1lh;
  outline: none;
  transition: color 150ms ease;
}
.label:empty::before { content: "New card"; color: var(--widget-text-muted); }
.column.done .label {
  color: var(--widget-text-muted);
  text-decoration: line-through;
  text-decoration-thickness: 1px;
}

/* Lifted out of the flow; its place is held by the slot. Movement is written to translate inline. */
.card.dragging {
  position: fixed;
  z-index: 10;
  margin: 0;
  pointer-events: none;
  box-shadow: 0 10px 24px var(--k-lift), 0 2px 4px var(--k-lift);
  transition: scale 200ms var(--k-ease-out), rotate 200ms var(--k-ease-out), box-shadow 200ms ease;
}
.card.lifted { scale: 1.03; rotate: -2deg; }
.card.settling { box-shadow: 0 1px 2px var(--k-lift); }

.slot {
  flex: none;
  border-radius: var(--k-card-radius);
  background: var(--k-press);
}

@media (hover: hover) and (pointer: fine) {
  .card:hover { background: var(--k-tint); }
  .add:hover { background: var(--k-press); color: var(--widget-text); }
}

@media (prefers-reduced-motion: reduce) {
  .card { transition-property: opacity, background-color, box-shadow; }
  .card.lifted { scale: none; rotate: none; }
  .card.enter { scale: none; }
}

  const next = [];
  for (const list of root.querySelectorAll(".list")) {
    const col = list.parentElement.dataset.col;
    for (const node of list.querySelectorAll(":scope > .card")) {
      const card = byId.get(node.dataset.id);
      if (card) {
        card.col = col;
        next.push(card);
      }
    }
  }
  state.cards = next;
  save();
  sync();
}

// Siblings glide from where they were to where the change put them. Each is measured without its
// own in-flight offset, so an interrupted glide carries on from where it visibly is.
function flip(mutate) {
  const nodes = [...root.querySelectorAll(".list > .card:not(.dragging)")];
  const was = nodes.map((node) => node.getBoundingClientRect());
  mutate();
  if (calm.matches) return;
  for (const node of nodes) {
    node.style.transition = "none";
    node.style.removeProperty("translate");
  }
  const moving = [];
  nodes.forEach((node, i) => {
    if (!node.isConnected) return;
    const now = node.getBoundingClientRect();
    const dx = was[i].left - now.left;
    const dy = was[i].top - now.top;
    if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) moving.push([node, dx, dy]);
  });
  for (const [node, dx, dy] of moving) node.style.translate = `${dx}px ${dy}px`;
  root.offsetWidth;
  for (const node of nodes) node.style.removeProperty("transition");
  for (const [node] of moving) node.style.removeProperty("translate");
}

// Column by pointer x (nearest wins, so the gutters still count); position by the carried card's
// centre against each card's layout midpoint, which ignores glides in flight and never oscillates.
function targetOf(x, y) {
  let list = null;
  let best = Infinity;
  for (const node of root.querySelectorAll(".list")) {
    const r = node.parentElement.getBoundingClientRect();
    const d = x < r.left ? r.left - x : x > r.right ? x - r.right : 0;
    if (d < best) {
      best = d;
      list = node;
    }
  }
  const top = list.getBoundingClientRect().top - list.scrollTop;
  let before = null;
  for (const node of list.children) {
    if (!node.classList.contains("card") || node.classList.contains("dragging")) continue;
    if (y < top + node.offsetTop + node.offsetHeight / 2) {
      before = node;
      break;
    }
  }
  return { list, before };
}

function nextCard(node) {
  let next = node.nextElementSibling;
  while (next && next.classList.contains("dragging")) next = next.nextElementSibling;
  return next;
}

function lift(d) {
  d.moved = true;
  const { node } = d;
  node.style.transition = "none";
  node.style.removeProperty("translate");
  const rect = node.getBoundingClientRect();
  d.rect = rect;
  d.slot = el("div", "slot");
  d.slot.style.height = `${rect.height}px`;
  node.before(d.slot);
  node.style.left = `${rect.left}px`;
  node.style.top = `${rect.top}px`;
  node.style.width = `${rect.width}px`;
  node.classList.add("dragging");
  node.offsetWidth;
  node.style.removeProperty("transition");
  node.classList.add("lifted");
  root.classList.add("grabbing");
  sync();
}

function follow(d, x, y) {
  const { list, before } = targetOf(x, y);
  if (d.slot.parentElement === list && nextCard(d.slot) === before) return;
  flip(() => list.insertBefore(d.slot, before));
  sync();
}

// The card glides into its slot and only then rejoins the list.
function settle(d) {
  const { node, slot } = d;
  const target = slot.getBoundingClientRect();
  const finish = () => {
    if (!node.classList.contains("settling")) return;
    node.style.transition = "none";
    for (const prop of ["translate", "left", "top", "width"]) node.style.removeProperty(prop);
    node.classList.remove("dragging", "lifted", "settling");
    slot.replaceWith(node);
    node.offsetWidth;
    node.style.removeProperty("transition");
    commitOrder();
  };
  node.classList.add("settling");
  node.classList.remove("lifted");
  if (calm.matches) return finish();
  node.style.transition =
    "translate 260ms var(--k-spring), scale 200ms var(--k-ease-out), rotate 200ms var(--k-ease-out), box-shadow 200ms ease";
  node.style.translate = `${target.left - d.rect.left}px ${target.top - d.rect.top}px`;
  setTimeout(finish, 270);
}

function endDrag(event, commit) {
  if (!drag || (event && event.pointerId !== drag.pointerId)) return;
  const d = drag;
  drag = null;
  root.classList.remove("grabbing");
  if (d.moved) settle(d);
  else if (commit && d.node.isConnected) startEdit(d.node);
}

function startEdit(node) {
  editingId = node.dataset.id;
  node.classList.add("editing");
  const label = node.querySelector(".label");
  label.contentEditable = "plaintext-only";
  label.focus();
  const selection = getSelection();
  selection.selectAllChildren(label);
  selection.collapseToEnd();
}

// Escape keeps the saved text (and discards a card that was never named); clearing the text removes the card.
function finishEdit(node, cancel) {
  const card = cardOf(node);
  if (!card || card.id !== editingId) return;
  editingId = null;
  const label = node.querySelector(".label");
  label.removeAttribute("contenteditable");
  node.classList.remove("editing");
  const text = label.textContent.replace(/\s+/g, " ").trim();
  const fresh = card.id === freshId;
  freshId = null;
  if (cancel ? fresh : !text) {
    flip(() => node.remove());
    commitOrder();
    return;
  }
  if (!cancel) card.text = text;
  label.textContent = card.text;
  save();
  sync();
}

function addCard(column) {
  const card = { id: newId(), col: column.dataset.col, text: "" };
  state.cards.push(card);
  freshId = card.id;
  const node = cardNode(card);
  node.classList.add("enter");
  column.querySelector(".list").append(node);
  node.getBoundingClientRect();
  node.classList.remove("enter");
  node.scrollIntoView({ block: "nearest" });
  sync();
  startEdit(node);
}

root.addEventListener("pointerdown", (event) => {
  if (event.button !== 0 || drag) return;
  const node = event.target.closest(".card");
  if (!node || node.classList.contains("editing") || node.classList.contains("dragging")) return;
  root.querySelector(".card.editing .label")?.blur();
  if (!node.isConnected) return;
  drag = { pointerId: event.pointerId, node, startX: event.clientX, startY: event.clientY, moved: false };
  root.setPointerCapture(event.pointerId);
  event.preventDefault();
});

root.addEventListener("pointermove", (event) => {
  if (!drag || event.pointerId !== drag.pointerId) return;
  if (!drag.moved) {
    if (Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < 4) return;
    lift(drag);
  }
  const dx = event.clientX - drag.startX;
  const dy = event.clientY - drag.startY;
  drag.node.style.translate = `${dx}px ${dy}px`;
  follow(drag, event.clientX, drag.rect.top + dy + drag.rect.height / 2);
});

root.addEventListener("pointerup", (event) => endDrag(event, true));
root.addEventListener("pointercancel", (event) => endDrag(event, false));
root.addEventListener("lostpointercapture", (event) => endDrag(event, false));
window.addEventListener("blur", () => endDrag(null, false));

root.addEventListener("click", (event) => {
  const add = event.target.closest('[data-action="add"]');
  if (add) addCard(add.closest(".column"));
});

root.addEventListener("keydown", (event) => {
  const node = event.target.closest?.(".card");
  if (!node) return;
  if (node.classList.contains("editing")) {
    if (event.key === "Enter" || event.key === "Escape") {
      event.preventDefault();
      finishEdit(node, event.key === "Escape");
      if (node.isConnected) node.focus();
    }
    return;
  }
  if (drag) return;
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    startEdit(node);
    return;
  }
  const list = node.parentElement;
  const lists = [...root.querySelectorAll(".list")];
  let mutate = null;
  if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
    const target = lists[lists.indexOf(list) + (event.key === "ArrowLeft" ? -1 : 1)];
    if (target) {
      const at = [...list.children].indexOf(node);
      mutate = () => target.insertBefore(node, target.children[at] || null);
    }
  } else if (event.key === "ArrowUp" && node.previousElementSibling) {
    mutate = () => node.previousElementSibling.before(node);
  } else if (event.key === "ArrowDown" && node.nextElementSibling) {
    mutate = () => node.nextElementSibling.after(node);
  }
  if (!mutate) return;
  event.preventDefault();
  flip(mutate);
  commitOrder();
  node.focus();
  node.scrollIntoView({ block: "nearest" });
});

root.addEventListener("focusout", (event) => {
  const label = event.target.closest?.(".label[contenteditable]");
  if (label) finishEdit(label.closest(".card"), false);
});

if (typeof render === "function") { render(); }
</script></body></html>
