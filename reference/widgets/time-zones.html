/* === STYLE === */
:root {
  /* Drawn for a black fill: every foreground is light, with softer text as translucent white. */
  --tz-ink: #f7f7f8;
  --tz-ink-2: rgba(255, 255, 255, 0.72);
  --tz-ink-3: rgba(255, 255, 255, 0.6);
  --tz-rule: rgba(255, 255, 255, 0.12);
  --tz-line: rgba(255, 255, 255, 0.24);
  --tz-tint: rgba(255, 255, 255, 0.08);
  --tz-night: rgba(255, 255, 255, 0.18);
  --tz-day: rgba(255, 255, 255, 0.4);
  --tz-gold: #f3d79b;
  --tz-live: #5be49b;
  --tz-error: #ff8a80;
  --tz-pad: 20px;
  --tz-section-gap: 16px;
  --tz-row-pad: 14px;
  --tz-control: 26px;
  --tz-strip: 6px;
  --tz-strip-radius: 3px;
  --tz-cell-gap: 2px;
  --tz-tint-inset: 6px;
}

*, *::before, *::after { box-sizing: border-box; }

#root {
  height: 100%;
  padding: var(--tz-pad);
  background: var(--widget-surface);
  color: var(--tz-ink);
  font-family: var(--widget-font);
  font-size: var(--widget-font-size);
  line-height: var(--widget-line-height);
  display: flex;
  flex-direction: column;
  gap: var(--tz-section-gap);
  user-select: none;
  -webkit-user-select: none;
}

button {
  font: inherit;
  color: inherit;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--tz-section-gap);
}

.title {
  margin: 0;
  font-size: var(--widget-title-size);
  font-weight: 600;
  line-height: var(--widget-title-line-height);
}

.actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: -4px 0;
}

/* Live while following the clock; Reset once a time has been picked. */
.status {
  height: var(--tz-control);
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid rgba(243, 215, 155, 0.45);
  border-radius: calc(var(--tz-control) / 2);
  color: var(--tz-gold);
  font-size: 12px;
  font-weight: 500;
  transition: border-color 150ms, color 150ms, background-color 150ms;
}
.status .dot { display: none; width: 6px; height: 6px; border-radius: 50%; background: var(--tz-live); }
.status.live { padding-inline: 0; border-color: transparent; color: var(--tz-ink-2); cursor: default; }
.status.live .dot { display: block; }

.add {
  width: var(--tz-control);
  height: var(--tz-control);
  display: grid;
  place-items: center;
  border: 1px solid var(--tz-line);
  border-radius: 50%;
  color: var(--tz-ink-2);
  transition: border-color 150ms, color 150ms, background-color 150ms;
}
.add svg { width: 12px; height: 12px; }

.zone {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  column-gap: 16px;
  row-gap: 2px;
  align-items: baseline;
  padding: var(--tz-row-pad) 0;
  border-top: 1px solid var(--tz-rule);
}
.zone:first-child { padding-top: 0; border-top: 0; }

.name {
  justify-self: start;
  margin-inline: calc(var(--tz-tint-inset) * -1);
  padding: 1px var(--tz-tint-inset);
  border-radius: 6px;
  font-size: 15px;
  font-weight: 500;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  cursor: text;
  outline: none;
  transition: background-color 150ms;
}
.name[contenteditable] { background: var(--tz-tint); user-select: text; -webkit-user-select: text; }
.name:empty::before { content: attr(data-placeholder); color: var(--tz-ink-3); font-weight: 400; }
.name.invalid { text-decoration: underline wavy var(--tz-error); text-underline-offset: 4px; }

.time {
  justify-self: end;
  font-size: 26px;
  font-weight: 300;
  line-height: 1.1;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}

.utc, .when {
  font-size: 12px;
  color: var(--tz-ink-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.when { justify-self: end; display: flex; gap: 6px; }
.shift { color: var(--tz-gold); font-weight: 500; }

/* The strip is one graphic: its 24 hours share the width, so it scales as a whole. */
.strip {
  grid-column: 1 / -1;
  position: relative;
  margin-top: 12px;
  display: grid;
  grid-template-columns: repeat(24, minmax(0, 1fr));
  gap: var(--tz-cell-gap);
  height: var(--tz-strip);
  cursor: ew-resize;
  touch-action: none;
  outline: none;
}
/* A taller invisible band so the thin strip is easy to grab. */
.strip::before { content: ""; position: absolute; inset: -10px 0; }
.cell { border-radius: 1px; background: var(--tz-day); }
.cell:first-child { border-radius: var(--tz-strip-radius) 1px 1px var(--tz-strip-radius); }
.cell:nth-child(24) { border-radius: 1px var(--tz-strip-radius) var(--tz-strip-radius) 1px; }
.cell.night { background: var(--tz-night); }
.cell.work { background: var(--tz-gold); }

.cursor {
  position: absolute;
  top: -6px;
  bottom: -6px;
  left: var(--x, 0%);
  width: 2px;
  margin-left: -1px;
  border-radius: 1px;
  background: var(--tz-ink);
  pointer-events: none;
}
/* A knob ringed in the fill colour so it reads cleanly over the strip. */
.cursor::before {
  content: "";
  position: absolute;
  top: -4px;
  left: -3px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--tz-ink);
  box-shadow: 0 0 0 2px var(--widget-surface);
}

.axis {
  position: relative;
  height: 14px;
  margin-top: -4px;
  font-size: 11px;
  line-height: 14px;
  color: var(--tz-ink-3);
  font-variant-numeric: tabular-nums;
}
.axis span { position: absolute; top: 0; transform: translateX(-50%); }
.axis span:first-child { transform: none; }
.axis span:last-child { transform: translateX(-100%); }

.add:focus-visible, .status:focus-visible, .name:focus-visible, .strip:focus-visible {
  outline: 1.5px solid var(--tz-gold);
  outline-offset: 3px;
}

@media (hover: hover) and (pointer: fine) {
  .add:hover { border-color: var(--tz-ink-2); color: var(--tz-ink); background: var(--tz-tint); }
  .status:not(.live):hover { border-color: var(--tz-gold); background: rgba(243, 215, 155, 0.08); }
  .name:hover { background: var(--tz-tint); }
}

  if (!f) {
    f = new Intl.DateTimeFormat("en-US", {
      timeZone: tz, hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric",
    });
    wallFmts.set(tz, f);
  }
  const p = {};
  for (const { type, value } of f.formatToParts(ms)) p[type] = Number(value);
  p.hour %= 24;
  return p;
}

function offsetMin(tz, ms) {
  const p = wall(tz, ms);
  return Math.round((Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute) - ms) / 60000);
}

function dayIndex(tz, ms) {
  const p = wall(tz, ms);
  return Date.UTC(p.year, p.month - 1, p.day) / DAY;
}

function firstTz() {
  return (state.zones.find((z) => z.tz) || {}).tz || LOCAL_TZ;
}

// Midnight today in the first zone; the strips cover the 24 hours from there.
function computeBase() {
  const now = Math.floor(Date.now() / 60000) * 60000;
  const p = wall(firstTz(), now);
  base = now - (p.hour * 60 + p.minute) * 60000;
}

// === RENDER ===
const timeFmts = new Map();
const dateFmts = new Map();
const PLUS = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 1.5v9M1.5 6h9"/></svg>';

function el(tag, className, text) {
  const node = document.createElement(tag);
  node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function cached(map, tz, options) {
  let f = map.get(tz);
  if (!f) {
    f = new Intl.DateTimeFormat(undefined, { timeZone: tz, ...options });
    map.set(tz, f);
  }
  return f;
}

function timeIn(tz, ms) {
  return cached(timeFmts, tz, { hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(ms);
}

function dateIn(tz, ms) {
  return cached(dateFmts, tz, { weekday: "short", day: "numeric", month: "short" }).format(ms);
}

function utcLabel(mins) {
  if (!mins) return "UTC";
  const sign = mins > 0 ? "+" : "−";
  const h = Math.floor(Math.abs(mins) / 60);
  const m = Math.abs(mins) % 60;
  return `UTC${sign}${h}${m ? `:${String(m).padStart(2, "0")}` : ""}`;
}

function render() {
  computeBase();

  const header = el("div", "header");
  const actions = el("div", "actions");
  const status = el("button", "status");
  status.type = "button";
  status.dataset.action = "now";
  status.append(el("span", "dot"), el("span", "label"));
  const add = el("button", "add");
  add.type = "button";
  add.dataset.action = "add";
  add.setAttribute("aria-label", "Add city");
  add.innerHTML = PLUS;
  actions.append(status, add);
  header.append(el("h3", "title", "Time zones"), actions);

  const list = el("div", "zones");
  for (const z of state.zones) {
    const zone = el("div", "zone");
    zone.dataset.id = z.id;
    const name = el("div", "name", z.label);
    name.dataset.placeholder = "City";
    if (z.id === editingId) {
      name.contentEditable = "plaintext-only";
    } else {
      name.tabIndex = 0;
      name.setAttribute("role", "button");
    }
    zone.append(name);

    if (z.tz) {
      const when = el("div", "when");
      when.append(el("span", "shift"), el("span", "date"));
      zone.append(el("span", "time"), el("span", "utc"), when);
      const strip = el("div", "strip");
      strip.tabIndex = 0;
      strip.setAttribute("role", "slider");
      strip.setAttribute("aria-label", `${z.label} time`);
      for (let i = 0; i < 24; i++) {
        const h = wall(z.tz, base + i * HOUR + HOUR / 2).hour;
        const cell = el("div", h >= 9 && h < 17 ? "cell work" : h >= 7 && h < 22 ? "cell" : "cell night");
        cell.title = timeIn(z.tz, base + i * HOUR);
        strip.append(cell);
      }
      strip.append(el("div", "cursor"));
      zone.append(strip);
    }
    list.append(zone);
  }

  // Hour marks in the first city's time, which sets the strips' day.
  const axis = el("div", "axis");
  axis.setAttribute("aria-hidden", "true");
  for (const h of [0, 6, 12, 18, 24]) {
    const mark = el("span", "", String(h).padStart(2, "0"));
    mark.style.left = `${(h / 24) * 100}%`;
    axis.append(mark);
  }

  root.replaceChildren(header, list, axis);
  paint();

  const editing = root.querySelector(".name[contenteditable]");
  if (editing) {
    editing.focus();
    const range = document.createRange();
    range.selectNodeContents(editing);
    range.collapse(false);
    const selection = getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  }
}

// Updates times and cursors in place, so a scrub never rebuilds the strip under the pointer.
function paint() {
  const first = firstTz();
  const at = picked ?? Date.now();
  const frac = Math.min(1, Math.max(0, (at - base) / DAY));

  const status = root.querySelector(".status");
  const live = picked == null;
  status.classList.toggle("live", live);
  status.disabled = live;
  status.querySelector(".label").textContent = live ? "Live" : "Reset";
  status.setAttribute("aria-label", live ? "Showing the current time" : "Back to the current time");

  for (const zone of root.querySelectorAll(".zone")) {
    const z = state.zones.find((item) => item.id === zone.dataset.id);
    if (!z || !z.tz) continue;
    const time = timeIn(z.tz, at);
    const diff = dayIndex(z.tz, at) - dayIndex(first, at);
    zone.querySelector(".time").textContent = time;
    zone.querySelector(".utc").textContent = utcLabel(offsetMin(z.tz, at));
    zone.querySelector(".date").textContent = dateIn(z.tz, at);
    zone.querySelector(".shift").textContent = diff ? `${diff > 0 ? "+" : "−"}${Math.abs(diff)}d` : "";
    const strip = zone.querySelector(".strip");
    strip.style.setProperty("--x", `${frac * 100}%`);
    strip.setAttribute("aria-valuetext", `${time}, ${dateIn(z.tz, at)}`);
  }
}

// === EVENTS ===
function save() {
  localStorage.setItem("state", JSON.stringify(state));
}

function zoneById(id) {
  return state.zones.find((z) => z.id === id);
}

function removeZone(id) {
  state.zones = state.zones.filter((z) => z.id !== id);
}

// mode: "enter", "blur" or "cancel". An unknown city stays open on Enter and reverts on blur.
function finishEdit(node, mode) {
  if (!node.isContentEditable) return;
  const id = node.closest(".zone").dataset.id;
  const text = node.textContent.replace(/\s+/g, " ").trim();
  const tz = text ? findZone(text) : null;
  if (mode === "enter" && text && !tz) {
    node.classList.add("invalid");
    node.title = "No time zone found for this name";
    return;
  }
  node.removeAttribute("contenteditable");
  const z = zoneById(id);
  const wasNew = id === newId;
  editingId = null;
  newId = null;
  if (z) {
    if (mode === "cancel" || (text && !tz)) { if (wasNew) removeZone(id); }
    else if (!text) removeZone(id);
    else { z.label = text; z.tz = tz; }
  }
  save();
  render();
}

function beginEdit(id) {
  editingId = id;
  render();
}

root.addEventListener("click", (event) => {
  const action = event.target.closest("[data-action]");
  if (action?.dataset.action === "now") {
    picked = null;
    paint();
  } else if (action?.dataset.action === "add") {
    const z = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), label: "", tz: null };
    state.zones.push(z);
    newId = z.id;
    beginEdit(z.id);
  } else {
    const name = event.target.closest(".name:not([contenteditable])");
    if (name) beginEdit(name.closest(".zone").dataset.id);
  }
});

root.addEventListener("keydown", (event) => {
  const editing = event.target.closest?.(".name[contenteditable]");
  if (editing) {
    if (event.key === "Enter" || event.key === "Escape") {
      event.preventDefault();
      finishEdit(editing, event.key === "Escape" ? "cancel" : "enter");
    } else {
      editing.classList.remove("invalid");
    }
    return;
  }
  const name = event.target.closest?.(".name");
  if (name && (event.key === "Enter" || event.key === " ")) {
    event.preventDefault();
    beginEdit(name.closest(".zone").dataset.id);
    return;
  }
  // Arrows step 15 minutes, an hour with Shift; Escape or Home returns to now.
  if (event.target.closest?.(".strip")) {
    if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
      event.preventDefault();
      const from = picked ?? Math.round(Date.now() / STEP) * STEP;
      const step = (event.shiftKey ? 4 : 1) * STEP * (event.key === "ArrowLeft" ? -1 : 1);
      picked = Math.min(base + DAY - STEP, Math.max(base, from + step));
      paint();
    } else if (event.key === "Escape" || event.key === "Home") {
      event.preventDefault();
      picked = null;
      paint();
    }
  }
});

root.addEventListener("focusout", (event) => {
  const name = event.target.closest?.(".name[contenteditable]");
  if (name) finishEdit(name, "blur");
});

function pickAt(strip, clientX) {
  const r = strip.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  picked = base + Math.min(95, Math.round(frac * 96)) * STEP;
  paint();
}

root.addEventListener("pointerdown", (event) => {
  if (scrub || event.button !== 0) return;
  const strip = event.target.closest(".strip");
  if (!strip) return;
  scrub = { pointerId: event.pointerId, strip };
  strip.setPointerCapture(event.pointerId);
  pickAt(strip, event.clientX);
});
root.addEventListener("pointermove", (event) => {
  if (scrub && event.pointerId === scrub.pointerId) pickAt(scrub.strip, event.clientX);
});
function endScrub(event) {
  if (scrub && event.pointerId === scrub.pointerId) scrub = null;
}
root.addEventListener("pointerup", endScrub);
root.addEventListener("pointercancel", endScrub);
root.addEventListener("lostpointercapture", endScrub);
window.addEventListener("blur", () => { scrub = null; });

// Keeps times live; a new day redraws the strips and drops a picked time.
function tick() {
  if (document.hidden || editingId || scrub) return;
  const before = base;
  computeBase();
  if (base !== before) {
    picked = null;
    render();
  } else {
    paint();
  }
}
setInterval(tick, 30000);
document.addEventListener("visibilitychange", tick);
// The shell calls render() once. Do not call it again here.

if (typeof render === "function") { render(); }
</script></body></html>
