/* === STYLE === */
:root {
  --t-pad: 20px;
  --t-section: 16px;
  --t-inline: 8px;
  --t-row-gap: 10px;
  --t-col-gap: 12px;
  --t-day-gap: 4px;
  --t-chart: 96px;
  --t-bar: 18px;
  --t-bar-radius: 4px;
  --t-track: 8px;
  --t-value: 4.5em;
  --t-head: 24px;
  --t-icon: 16px;
  --t-radius: 6px;
  --t-tint-inset: 6px;
  --t-tint: color-mix(in srgb, var(--widget-text) 6%, transparent);
  --t-rest: color-mix(in srgb, var(--widget-text) 7%, var(--widget-surface));
  --t-rest-strong: color-mix(in srgb, var(--widget-text) 13%, var(--widget-surface));
  --t-ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}

*, *::before, *::after { box-sizing: border-box; }

#root {
  height: 100%;
  padding: var(--t-pad);
  background: var(--widget-surface);
  color: var(--widget-text);
  font-family: var(--widget-font);
  font-size: var(--widget-font-size);
  line-height: var(--widget-line-height);
  display: flex;
  flex-direction: column;
  gap: var(--t-section);
  user-select: none;
  -webkit-user-select: none;
}

.head {
  display: flex;
  align-items: center;
  gap: var(--t-inline);
  min-height: var(--t-head);
}
.title {
  margin: 0;
  font-size: var(--widget-title-size);
  font-weight: var(--widget-title-weight);
  line-height: var(--widget-title-line-height);
  text-wrap: balance;
}
.day { color: var(--widget-text-muted); font-variant-numeric: tabular-nums; }

.add {
  flex: none;
  margin-left: auto;
  width: var(--t-head);
  height: var(--t-head);
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: var(--t-radius);
  background: transparent;
  color: var(--widget-text-muted);
  font: inherit;
  cursor: pointer;
  transition: background-color 120ms ease, color 120ms ease, scale 120ms var(--t-ease-out);
}
.add svg { width: var(--t-icon); height: var(--t-icon); }
.add:active { scale: 0.95; }

.chart {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: var(--t-day-gap);
}
.col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--t-inline);
  padding: 0;
  border: 0;
  border-radius: var(--t-radius);
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
/* Bars stack bottom-up; a hairline of surface separates one category from the next. */
.bar {
  width: var(--t-bar);
  height: var(--t-chart);
  border-radius: var(--t-bar-radius);
  background: var(--t-rest);
  overflow: hidden;
  display: flex;
  flex-direction: column-reverse;
  transition: background-color 120ms ease;
}
.seg { flex: none; }
.seg + .seg { box-shadow: inset 0 -1px 0 var(--widget-surface); }
.letter {
  line-height: 1;
  color: var(--widget-text-muted);
  transition: color 120ms ease;
}
.col[aria-pressed="true"] .bar { background: var(--t-rest-strong); }
.col[aria-pressed="true"] .letter { color: var(--widget-text); font-weight: 600; }

.rows {
  display: grid;
  grid-template-columns: fit-content(40%) minmax(0, 1fr) var(--t-value);
  column-gap: var(--t-col-gap);
  row-gap: var(--t-row-gap);
  align-items: center;
}
.rows:empty { display: none; }
.row {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: subgrid;
  align-items: center;
  transition: opacity 200ms var(--t-ease-out), translate 200ms var(--t-ease-out);
}
.row.enter { opacity: 0; translate: 0 -6px; }

.name {
  min-width: 0;
  margin-inline: calc(var(--t-tint-inset) * -1);
  padding: 2px var(--t-tint-inset);
  border-radius: var(--t-radius);
  font-weight: 500;
  overflow-wrap: anywhere;
  cursor: text;
  outline: none;
  transition: background-color 120ms ease;
}
.name[contenteditable] { background: var(--t-tint); user-select: text; -webkit-user-select: text; }
.name:empty::before { content: "Category"; color: var(--widget-text-muted); }

/* The track is thin to look at; its ::after reaches a comfortable press target. */
.track {
  position: relative;
  height: var(--t-track);
  border-radius: 999px;
  background: var(--t-rest);
  cursor: pointer;
  touch-action: none;
  outline: none;
  transition: background-color 120ms ease, scale 150ms var(--t-ease-out);
}
.track::after { content: ""; position: absolute; inset: -10px 0; }
.track.active { background: var(--t-rest-strong); scale: 1 1.25; }
.fill {
  position: absolute;
  inset: 0 auto 0 0;
  border-radius: inherit;
}
.value {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.value.zero { color: var(--widget-text-muted); }

.add:focus-visible, .col:focus-visible, .track:focus-visible, .name:focus-visible {
  outline: 2px solid var(--widget-accent);
  outline-offset: 2px;
}

@media (hover: hover) and (pointer: fine) {
  .add:hover { background: var(--t-tint); color: var(--widget-text); }
  .col:hover .bar { background: var(--t-rest-strong); }
  .col:hover .letter { color: var(--widget-text); }
  .name:hover { background: var(--t-tint); }
  .track:hover { background: var(--t-rest-strong); scale: 1 1.25; }
}

@media (prefers-reduced-motion: reduce) {
  .track, .row { transition-property: background-color, opacity; }
  .track.active, .track:hover { scale: none; }
  .row.enter { translate: none; }
}

}

function dayLabel(key) {
  if (key === today) return "Today";
  if (key === lastDays()[5]) return "Yesterday";
  return shortDay.format(dateOf(key));
}

function rowNode(cat) {
  const row = el("div", "row");
  row.dataset.id = cat.id;
  const name = el("span", "name", cat.name);
  name.dataset.id = cat.id;
  name.tabIndex = 0;
  const track = el("div", "track");
  track.dataset.id = cat.id;
  track.tabIndex = 0;
  track.setAttribute("role", "slider");
  track.setAttribute("aria-valuemin", "0");
  track.setAttribute("aria-valuemax", String(MAX));
  track.setAttribute("aria-label", `${cat.name || "Category"} hours`);
  const fill = el("span", "fill");
  fill.style.background = cat.color;
  track.append(fill);
  row.append(name, track, el("span", "value"));
  return row;
}

function render() {
  today = dayKey(new Date());
  const days = lastDays();
  if (!days.includes(selected)) selected = today;
  const add = el("button", "add");
  add.type = "button";
  add.dataset.action = "add";
  add.setAttribute("aria-label", "Add a category");
  add.innerHTML = PLUS;
  const head = el("div", "head");
  head.append(el("h3", "title", "Time log"), el("span", "day"), add);
  const chart = el("div", "chart");
  for (const key of days) {
    const col = el("button", "col");
    col.type = "button";
    col.dataset.day = key;
    col.append(el("span", "bar"), el("span", "letter", narrowDay.format(dateOf(key))));
    chart.append(col);
  }
  const rows = el("div", "rows");
  for (const cat of state.cats) rows.append(rowNode(cat));
  root.replaceChildren(head, chart, rows);
  paint();
}

// Writes values in place, so a drag never rebuilds what is under the pointer.
// The chart scale is 8h until a day runs longer, then grows in 2h steps.
function paint() {
  const cols = [...root.querySelectorAll(".col")];
  const most = Math.max(0, ...cols.map((col) => totalOf(col.dataset.day)));
  const scale = Math.max(8 * 60, Math.ceil(most / 120) * 120);
  for (const col of cols) {
    const key = col.dataset.day;
    const segs = [];
    for (const cat of state.cats) {
      const m = minutesOf(key, cat.id);
      if (!m) continue;
      const seg = el("span", "seg");
      seg.style.height = `${(m / scale) * 100}%`;
      seg.style.background = cat.color;
      segs.push(seg);
    }
    col.querySelector(".bar").replaceChildren(...segs);
    col.setAttribute("aria-pressed", String(key === selected));
    col.setAttribute("aria-label", `${shortDay.format(dateOf(key))}, ${fmt(totalOf(key))}`);
  }
  root.querySelector(".day").textContent = dayLabel(selected);
  for (const row of root.querySelectorAll(".row")) {
    const m = minutesOf(selected, row.dataset.id);
    row.querySelector(".fill").style.width = `${(m / MAX) * 100}%`;
    const value = row.querySelector(".value");
    value.textContent = fmt(m);
    value.classList.toggle("zero", !m);
    const track = row.querySelector(".track");
    track.setAttribute("aria-valuenow", String(m));
    track.setAttribute("aria-valuetext", fmt(m));
  }
}

// === EVENTS ===
function valueAt(track, x) {
  const r = track.getBoundingClientRect();
  return ((x - r.left) / r.width) * MAX;
}

// Pressing the track is the action: the value jumps to the press and follows the drag.
root.addEventListener("pointerdown", (event) => {
  if (event.button !== 0 || drag) return;
  const track = event.target.closest(".track");
  if (!track) return;
  drag = { pointerId: event.pointerId, track };
  track.classList.add("active");
  track.setPointerCapture(event.pointerId);
  event.preventDefault();
  setMinutes(selected, track.dataset.id, valueAt(track, event.clientX));
  paint();
});

root.addEventListener("pointermove", (event) => {
  if (!drag || event.pointerId !== drag.pointerId) return;
  setMinutes(selected, drag.track.dataset.id, valueAt(drag.track, event.clientX));
  paint();
});

function endDrag(event) {
  if (!drag || (event && event.pointerId !== drag.pointerId)) return;
  drag.track.classList.remove("active");
  drag = null;
  save();
}
root.addEventListener("pointerup", endDrag);
root.addEventListener("pointercancel", endDrag);
root.addEventListener("lostpointercapture", endDrag);
window.addEventListener("blur", () => endDrag(null));

function addCat() {
  const used = new Set(state.cats.map((c) => c.color));
  const color = COLORS.find((c) => !used.has(c)) || COLORS[state.cats.length % COLORS.length];
  const cat = { id: newId(), name: "", color };
  state.cats.push(cat);
  freshId = cat.id;
  const row = rowNode(cat);
  row.classList.add("enter");
  root.querySelector(".rows").append(row);
  paint();
  row.getBoundingClientRect();
  row.classList.remove("enter");
  beginEdit(row.querySelector(".name"));
}

function beginEdit(node) {
  editingId = node.dataset.id;
  node.contentEditable = "plaintext-only";
  node.focus();
  getSelection().selectAllChildren(node);
  getSelection().collapseToEnd();
}

// Escape keeps the saved name (and discards a category never named); clearing the name removes
// the category and its logged time.
function finishEdit(node, cancel) {
  if (!node.isContentEditable || node.dataset.id !== editingId) return;
  editingId = null;
  node.removeAttribute("contenteditable");
  const cat = state.cats.find((c) => c.id === node.dataset.id);
  if (!cat) return;
  const text = node.textContent.replace(/\s+/g, " ").trim();
  const fresh = cat.id === freshId;
  freshId = null;
  if (cancel ? fresh : !text) {
    state.cats = state.cats.filter((c) => c !== cat);
    for (const key of Object.keys(state.log)) {
      delete state.log[key][cat.id];
      if (!Object.keys(state.log[key]).length) delete state.log[key];
    }
    node.closest(".row").remove();
    paint();
    save();
    return;
  }
  if (!cancel) cat.name = text;
  node.textContent = cat.name;
  node.closest(".row").querySelector(".track").setAttribute("aria-label", `${cat.name} hours`);
  save();
}

root.addEventListener("click", (event) => {
  if (event.target.closest('[data-action="add"]')) return addCat();
  const col = event.target.closest(".col");
  if (col) {
    selected = col.dataset.day;
    paint();
    return;
  }
  const name = event.target.closest(".name:not([contenteditable])");
  if (name) beginEdit(name);
});

root.addEventListener("keydown", (event) => {
  const name = event.target.closest?.(".name");
  if (name) {
    if (!name.isContentEditable) {
      if (event.key === "Enter") {
        event.preventDefault();
        beginEdit(name);
      }
    } else if (event.key === "Enter" || event.key === "Escape") {
      event.preventDefault();
      finishEdit(name, event.key === "Escape");
      if (name.isConnected) name.focus();
    }
    return;
  }
  const track = event.target.closest?.(".track");
  if (!track) return;
  const now = minutesOf(selected, track.dataset.id);
  const step = event.shiftKey ? 60 : STEP;
  const next = { ArrowRight: now + step, ArrowUp: now + step, ArrowLeft: now - step, ArrowDown: now - step, Home: 0, End: MAX }[event.key];
  if (next === undefined) return;
  event.preventDefault();
  setMinutes(selected, track.dataset.id, next);
  paint();
  save();
});

root.addEventListener("focusout", (event) => {
  const name = event.target.closest?.(".name[contenteditable]");
  if (name) finishEdit(name, false);
});

// Past midnight the week rolls forward; a view left on today follows to the new today.
setInterval(() => {
  if (drag || editingId || dayKey(new Date()) === today) return;
  const onToday = selected === today;
  render();
  if (onToday) {
    selected = today;
    paint();
  }
}, 60000);

if (typeof render === "function") { render(); }
</script></body></html>
