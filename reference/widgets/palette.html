/* === STYLE === */
:root {
  --pc-inset: 12px;
  --pc-gap: 8px;
  --pc-control: 28px;
  --pc-dock-control: 32px;
  --pc-dock-pad: 4px;
  --pc-dock-offset: 14px;
  --pc-glyph: 16px;
  /* The row under the pointer takes this share of the height against 1 for each neighbour. */
  --pc-expand: 1.7;
  --pc-out: cubic-bezier(0.23, 1, 0.32, 1);
  --pc-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --pc-swap: 280ms;
  --pc-grow: 360ms;
  --pc-tint: color-mix(in srgb, var(--widget-text) 7%, transparent);
  /* Fit to content lands on a 4:3 picture. */
  --pc-fit-width: 400px;
  --pc-fit-height: 300px;
}

*, *::before, *::after { box-sizing: border-box; }

/* No padding and no title: the colours are the whole picture, edge to edge. */
#root {
  position: relative;
  height: 100%;
  overflow: hidden;
  border-radius: var(--widget-radius);
  color: var(--widget-text);
  font-family: var(--widget-font);
  font-size: var(--widget-font-size);
  line-height: var(--widget-line-height);
  user-select: none;
  -webkit-user-select: none;
}

button {
  font: inherit;
  color: inherit;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  outline: none;
}
svg {
  width: 16px;
  height: 16px;
  display: block;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.strip {
  display: flex;
  flex-direction: column;
  height: 100%;
  container-type: size;
  contain-intrinsic-size: var(--pc-fit-width) var(--pc-fit-height);
}

.col {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  color: var(--ink);
  transition:
    flex-grow var(--pc-grow) var(--pc-out),
    color var(--pc-swap) var(--pc-out) var(--d, 0ms);
}
.fill {
  position: absolute;
  inset: 0;
  transition: opacity var(--pc-swap) var(--pc-out) var(--d, 0ms);
}
.fill.entering { opacity: 0; }

.pick {
  pointer-events: auto;
  height: var(--pc-control);
  display: inline-flex;
  align-items: center;
  gap: var(--pc-gap);
  margin-inline: -6px;
  padding: 0 6px;
  border-radius: 6px;
  transition: background-color 120ms ease;
}
.pick:focus-visible { box-shadow: inset 0 0 0 1.5px var(--ink); }
.glyphs {
  display: grid;
  place-items: center;
  transition: transform 160ms var(--pc-out);
}
.glyphs > * {
  grid-area: 1 / 1;
  transition: opacity 200ms var(--pc-out), transform 200ms var(--pc-out), filter 200ms var(--pc-out);
}
.glyphs svg { width: var(--pc-glyph); height: var(--pc-glyph); }
.glyph-copy { opacity: 0; transform: scale(0.9); }
.glyph-done {
  display: flex;
  align-items: center;
  gap: 4px;
  font-weight: 500;
  white-space: nowrap;
  opacity: 0;
  transform: scale(0.9);
  filter: blur(3px);
}
.pick:active .glyphs { transform: scale(0.95); }
.col.is-copied .glyph-done {
  opacity: 1;
  transform: none;
  filter: none;
  transition: opacity 200ms var(--pc-out), transform 360ms var(--pc-spring), filter 200ms var(--pc-out);
}
.col.is-blocked .glyph-done svg { display: none; }
.pick:focus-visible .glyph-copy { opacity: 0.8; transform: none; }
.col.is-copied .glyph-copy { opacity: 0; }

.meta {
  position: absolute;
  inset: 0 var(--pc-inset);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--pc-gap);
  pointer-events: none;
}
.label {
  display: grid;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.val {
  grid-area: 1 / 1;
  transition: opacity 220ms var(--pc-out), transform 220ms var(--pc-out), filter 220ms var(--pc-out);
  transition-delay: var(--d, 0ms);

.val.in { opacity: 0; transform: translateY(8px); filter: blur(3px); }
.val.out { opacity: 0; transform: translateY(-8px); filter: blur(3px); }

.lock {
  pointer-events: auto;
  width: var(--pc-control);
  height: var(--pc-control);
  display: grid;
  place-items: center;
  border-radius: 50%;
  opacity: 0;
  transition: opacity 150ms ease, background-color 120ms ease, transform 160ms var(--pc-out);
}
.lock > svg {
  grid-area: 1 / 1;
  transition: opacity 180ms var(--pc-out), transform 180ms var(--pc-out), filter 180ms var(--pc-out);
}
.lock .closed { opacity: 0; transform: scale(0.8); filter: blur(2px); }
.lock[aria-pressed="true"] { opacity: 1; }
.lock[aria-pressed="true"] .closed { opacity: 1; transform: none; filter: none; }
.lock[aria-pressed="true"] .open { opacity: 0; transform: scale(0.8); filter: blur(2px); }
.lock:active { transform: scale(0.95); }
.lock:focus-visible { opacity: 1; box-shadow: inset 0 0 0 1.5px var(--ink); }

/* A small floating dock: the one piece of chrome, and only while the pointer is here. */
.dock {
  position: absolute;
  left: 50%;
  bottom: var(--pc-dock-offset);
  display: flex;
  align-items: center;
  gap: 2px;
  padding: var(--pc-dock-pad);
  border-radius: calc(var(--pc-dock-control) / 2 + var(--pc-dock-pad));
  background: var(--widget-surface);
  color: var(--widget-text);
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.08), 0 8px 24px rgb(0 0 0 / 0.16);
  transform: translateX(-50%);
  transition: opacity 200ms var(--pc-out), transform 200ms var(--pc-out);
}
.dock button {
  height: var(--pc-dock-control);
  border-radius: calc(var(--pc-dock-control) / 2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background-color 120ms ease, opacity 120ms ease, transform 160ms var(--pc-out);
}
.dock .step { width: var(--pc-dock-control); color: var(--widget-text-muted); }
/* Icon-only so the dock stays narrow enough to clear the bottom row's hex. */
.dock .generate {
  width: var(--pc-dock-control);
  background: var(--widget-text);
  color: var(--widget-surface);
}
.dock button:not(:disabled):active { transform: scale(0.95); }
.dock button:disabled { opacity: 0.3; cursor: default; }
.dock button:focus-visible { box-shadow: inset 0 0 0 1.5px var(--widget-text); }
.dock .generate:focus-visible { box-shadow: 0 0 0 2px var(--widget-surface), 0 0 0 3.5px var(--widget-text); }

@media (hover: hover) and (pointer: fine) {
  .col:hover { flex-grow: var(--pc-expand); }
  .pick { cursor: copy; }
  .pick:hover { background: color-mix(in srgb, var(--ink) 16%, transparent); }
  .col:hover:not(.is-copied) .glyph-copy { opacity: 0.8; transform: none; }
  .col:hover .lock { opacity: 1; }
  .lock:hover { background: color-mix(in srgb, var(--ink) 16%, transparent); }
  .dock .step:not(:disabled):hover { background: var(--pc-tint); }
  .dock .generate:hover { background: color-mix(in srgb, var(--widget-text) 86%, var(--widget-surface)); }
  .dock .step:not(:disabled):hover { color: var(--widget-text); }
  #root:not(:hover) .dock:not(:focus-within) {
    opacity: 0;
    transform: translate(-50%, 8px);
    pointer-events: none;
  }
}

/* Touch has no hover, so the lock and dock stay put. */
@media (hover: none) {
  .lock { opacity: 0.6; }
}

@media (prefers-reduced-motion: reduce) {
  .col { transition: color var(--pc-swap) var(--pc-out); }

  .lock .open, .lock .closed, .lock[aria-pressed="true"] .open { transform: none; filter: none; }
  .pick:active .glyphs, .lock:active, .dock button:not(:disabled):active { transform: none; }
  #root:not(:hover) .dock:not(:focus-within) { transform: translateX(-50%); }
}

const clamp01 = (v) => Math.min(1, Math.max(0, v));
function shuffled(list) {
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

// Colours live in OKLCH so lightness and chroma step evenly to the eye.
function toLinear({ l, c, h }) {
  const a = c * Math.cos((h * Math.PI) / 180);
  const b = c * Math.sin((h * Math.PI) / 180);
  const L = (l + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const M = (l - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const S = (l - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [
    4.0767416621 * L - 3.3077115913 * M + 0.2309699292 * S,
    -1.2684380046 * L + 2.6097574011 * M - 0.3413193965 * S,
    -0.0041960863 * L - 0.7034186147 * M + 1.707614701 * S,
  ];
}
const inGamut = (rgb) => rgb.every((v) => v >= -1e-4 && v <= 1 + 1e-4);
// Pull chroma in until the colour exists on screen, keeping its lightness and hue.
function fit({ l, c, h }) {
  let chroma = c;
  while (chroma > 0 && !inGamut(toLinear({ l, c: chroma, h }))) chroma -= 0.004;
  return { l, c: Math.max(0, chroma), h };
}
const encode = (v) => {
  v = clamp01(v);
  return v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055;
};
function hex(col) {
  return "#" + toLinear(col).map((v) => Math.round(encode(v) * 255).toString(16).padStart(2, "0")).join("").toUpperCase();
}
function luminance(col) {
  const [r, g, b] = toLinear(col).map(clamp01);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function contrast(a, b) {
  const [hi, lo] = [luminance(a), luminance(b)].sort((x, y) => y - x);
  return (hi + 0.05) / (lo + 0.05);
}
// Text on a colour is a deep or pale shade of that same hue, never grey.
function ink(col) {
  const dark = fit({ l: 0.2, c: Math.min(col.c * 0.6, 0.06), h: col.h });
  const light = fit({ l: 0.985, c: Math.min(col.c * 0.25, 0.02), h: col.h });
  return contrast(col, dark) >= contrast(col, light) ? dark : light;
}
const SCHEMES = {
  analogous: () => { const s = rand(12, 30); return [-2, -1, 0, 1, 2].map((k) => k * s); },
  mono: () => [-6, -3, 0, 3, 6],
  complement: () => [-12, 0, 12, 180, 192],
  split: () => [0, 150, 12, 210, 162],
  triad: () => [0, 120, 240, 12, 132],
};

// A lightness ramp swept through a hue scheme; locked colours stay and anchor the hue.
function generate(prev, locked) {
  const name = pick(["analogous", "analogous", "mono", "complement", "split", "triad"]);
  const offsets = SCHEMES[name]();
  const anchor = locked.findIndex(Boolean);
  const base = anchor >= 0 ? prev[anchor].h - offsets[anchor] : rand(0, 360);
  const muted = Math.random() < 0.2;
  const peak = muted ? rand(0.035, 0.07) : name === "mono" ? rand(0.06, 0.15) : rand(0.09, 0.19);
  const top = rand(0.9, 0.97);
  const bottom = rand(0.24, 0.4);
  const curve = rand(0.75, 1.35);
  let ls = Array.from({ length: COUNT }, (_, i) => top + (bottom - top) * Math.pow(i / (COUNT - 1), curve));
  if (Math.random() < 0.5) ls.reverse();
  if (Math.random() < 0.3) ls = shuffled(ls);
  return ls.map((l, i) => {
    if (locked[i]) return prev[i];
    const vivid = 0.25 + 0.75 * Math.sin(Math.PI * clamp01((l - 0.2) / 0.8));
    let col = fit({ l: l + rand(-0.02, 0.02), c: peak * vivid * rand(0.85, 1.1), h: wrap(base + offsets[i] + rand(-6, 6)) });
    // Mid-tones can miss 4.5:1 with both inks, so step lightness away from the middle until one clears it.
    for (let n = 0; n < 16 && contrast(col, ink(col)) < 4.5; n++) {
      col = fit({ ...col, l: col.l + (col.l < 0.59 ? -0.01 : 0.01) });
    }
    return col;
  });
}

const state = (() => {
  const valid = (list) => Array.isArray(list) && list.length === COUNT &&
    list.every((col) => col && [col.l, col.c, col.h].every(Number.isFinite));
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY)); } catch {}
  const s = { colors: null, locked: Array(COUNT).fill(false), back: [], forward: [] };
  if (saved && valid(saved.colors)) {
    s.colors = saved.colors;
    if (Array.isArray(saved.locked)) s.locked = s.locked.map((_, i) => !!saved.locked[i]);
    if (Array.isArray(saved.back)) s.back = saved.back.filter(valid).slice(-HISTORY);
    if (Array.isArray(saved.forward)) s.forward = saved.forward.filter(valid).slice(-HISTORY);
  } else {
    s.colors = generate(Array(COUNT).fill(null), s.locked);
  }
  return s;
})();

// === RENDER ===
const SVG_NS = "http://www.w3.org/2000/svg";
const ICONS = {
  copy: '<rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5V4A1.5 1.5 0 0 0 9 2.5H4A1.5 1.5 0 0 0 2.5 4v5A1.5 1.5 0 0 0 4 10.5h1.5"/>',
  check: '<path d="M3.5 8.5l3 3 6-7"/>',
  open: '<rect x="3.5" y="7.5" width="9" height="6" rx="1.5"/><path d="M5.5 7.5V5a2.5 2.5 0 0 1 4.9-.7"/>',
  closed: '<rect x="3.5" y="7.5" width="9" height="6" rx="1.5" fill="currentColor"/><path d="M5.5 7.5V5a2.5 2.5 0 0 1 5 0v2.5"/>',
  back: '<path d="M5.5 3.5l-3 3 3 3"/><path d="M2.5 6.5h7a3.5 3.5 0 0 1 0 7h-2"/>',
  forward: '<path d="M10.5 3.5l3 3-3 3"/><path d="M13.5 6.5h-7a3.5 3.5 0 0 0 0 7h2"/>',
  shuffle: '<path d="M2.5 4.5h2c1.5 0 2.5.8 3.3 2l1.4 3c.8 1.2 1.8 2 3.3 2h1"/><path d="M2.5 11.5h2c1 0 1.8-.4 2.5-1.1"/><path d="M9 5.6c.7-.7 1.5-1.1 2.5-1.1h2"/><path d="M11.5 2.5l2 2-2 2"/><path d="M11.5 9.5l2 2-2 2"/>',
};

function icon(name, cls) {
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("viewBox", "0 0 16 16");
  svg.setAttribute("aria-hidden", "true");
  if (cls) svg.setAttribute("class", cls);
  svg.innerHTML = ICONS[name];
  return svg;
}

function el(tag, cls, props) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (props) Object.assign(node, props);
  return node;
}

function button(cls, action, label) {
  const node = el("button", cls, { type: "button" });
  node.dataset.action = action;
  if (label) node.setAttribute("aria-label", label);
  return node;
}

const refs = { cols: [] };

// Built once; after that paint() updates the same nodes in place so motion never restarts.
function render() {
  const strip = el("div", "strip");
  refs.cols = state.colors.map((_, i) => {
    const col = el("div", "col");

    const label = el("span", "label");
    const val = el("span", "val");
    label.append(val);
    const doneText = el("span", "", { textContent: "Copied" });
    const done = el("span", "glyph-done");
    done.append(icon("check"), doneText);
    const glyphs = el("span", "glyphs");
    glyphs.append(icon("copy", "glyph-copy"), done);
    const pick = button("pick", "copy");
    pick.dataset.index = i;
    pick.append(label, glyphs);

    const lock = button("lock", "lock");
    lock.dataset.index = i;
    lock.append(icon("open", "open"), icon("closed", "closed"));
    const meta = el("div", "meta");
    meta.append(pick, lock);

    col.append(el("div", "fill"), meta);
    strip.append(col);
    return { col, pick, lock, val, doneText, hex: null, ink: null, timer: 0 };
  });

  const dock = el("div", "dock");
  refs.back = button("step", "back", "Previous palette");
  refs.back.append(icon("back"));
  const generate = button("generate", "generate", "Generate palette");
  generate.title = "Generate (Space)";
  generate.append(icon("shuffle"));
  refs.forward = button("step", "forward", "Next palette");
  refs.forward.append(icon("forward"));
  dock.append(refs.back, generate, refs.forward);

  root.replaceChildren(strip, dock);
  paint(false);
}

// A new colour fades in over the old one and its hex rolls along the spine, left to right in a short wave.
function swap(c, value) {
  const fills = c.col.querySelectorAll(".fill");
  const fill = el("div", "fill entering");
  fill.style.background = value;
  fills[fills.length - 1].after(fill);
  void fill.offsetWidth;
  fill.classList.remove("entering");

  const old = c.val;
  old.style.color = c.ink;
  old.classList.add("out");
  const val = el("span", "val in", { textContent: value });
  old.after(val);
  void val.offsetWidth;
  val.classList.remove("in");
  c.val = val;

  setTimeout(() => {
    old.remove();
    let prev = fill.previousElementSibling;
    while (prev && prev.classList.contains("fill")) {
      const next = prev.previousElementSibling;
      prev.remove();
      prev = next;
    }
    if (fill.isConnected && c.val === val) c.col.style.setProperty("--d", "0ms");
  }, SETTLE);
}

function paint(animate) {
  const moving = animate && !REDUCE;
  state.colors.forEach((colour, i) => {
    const c = refs.cols[i];
    const value = hex(colour);
    const shade = hex(ink(colour));
    c.col.style.setProperty("--d", moving ? `${i * STAGGER}ms` : "0ms");
    if (value !== c.hex) {
      c.col.classList.remove("is-copied");
      if (animate && c.hex) {
        swap(c, value);
      } else {
        c.col.querySelector(".fill").style.background = value;
        c.val.textContent = value;
      }
      c.hex = value;
    }
    c.col.style.setProperty("--ink", shade);
    c.ink = shade;
    c.pick.setAttribute("aria-label", `Copy ${value}`);
    const locked = !!state.locked[i];
    c.lock.setAttribute("aria-pressed", String(locked));
    c.lock.setAttribute("aria-label", `${locked ? "Unlock" : "Lock"} ${value}`);
  });
  refs.back.disabled = !state.back.length;
  refs.forward.disabled = !state.forward.length;
}

// === EVENTS ===
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {}
}

function show(colors) {
  state.colors = colors;
  save();
  paint(true);
}

function generateNext() {
  const next = generate(state.colors, state.locked);
  if (next.every((col, i) => hex(col) === hex(state.colors[i]))) return;
  state.back.push(state.colors);
  if (state.back.length > HISTORY) state.back.shift();
  state.forward = [];
  show(next);
}

// Back and forward walk the history; generating from an older palette drops the forward branch.
function step(dir) {
  const from = dir < 0 ? state.back : state.forward;
  const to = dir < 0 ? state.forward : state.back;
  if (!from.length) return;
  to.push(state.colors);
  show(from.pop());
}

function toggleLock(i) {
  state.locked[i] = !state.locked[i];
  save();
  paint(false);
}

async function copy(i) {
  const text = hex(state.colors[i]);
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch {
    const area = el("textarea", "", { value: text });
    area.setAttribute("readonly", "");
    area.style.cssText = "position:fixed;opacity:0;pointer-events:none";
    document.body.append(area);
    area.select();
    try { ok = document.execCommand("copy"); } catch {}
    area.remove();
  }
  const c = refs.cols[i];
  c.doneText.textContent = ok ? "Copied" : "Copy blocked";
  c.col.classList.toggle("is-blocked", !ok);
  c.col.classList.add("is-copied");
  clearTimeout(c.timer);
  c.timer = setTimeout(() => c.col.classList.remove("is-copied"), 1400);
}

root.addEventListener("click", (event) => {
  const target = event.target.closest("[data-action]");
  if (!target || target.disabled) return;
  const i = Number(target.dataset.index);
  switch (target.dataset.action) {
    case "copy": copy(i); break;
    case "lock": toggleLock(i); break;
    case "generate": generateNext(); break;
    case "back": step(-1); break;
    case "forward": step(1); break;
  }
});

// Space generates from anywhere in the widget; a focused button keeps Space for itself.
document.addEventListener("keydown", (event) => {
  const mod = event.metaKey || event.ctrlKey;
  const onControl = event.target.closest?.("button, input, textarea, [contenteditable]");
  if (event.key === " " && !mod && !onControl) {
    event.preventDefault();
    if (!event.repeat) generateNext();
  } else if (mod && event.key.toLowerCase() === "z") {
    event.preventDefault();
    step(event.shiftKey ? 1 : -1);
  }
});
// The shell calls render() once. Do not call it again here.

if (typeof render === "function") { render(); }
</script></body></html>
