/* === STYLE === */
:root {
  /* One source for every value the widget repeats. */
  --hb-on: #e9622f;
  --hb-on-hover: color-mix(in srgb, var(--hb-on) 88%, #000);
  --hb-off: color-mix(in srgb, var(--widget-text) 6%, var(--widget-surface));
  --hb-off-hover: color-mix(in srgb, var(--widget-text) 11%, var(--widget-surface));
  --hb-tint: color-mix(in srgb, var(--widget-text) 6%, transparent);
  --hb-pad: 20px;
  --hb-section-gap: 16px;
  --hb-dot: 28px;
  --hb-dot-gap: 3px;
  --hb-label-gap: 16px;
  --hb-tint-inset: 6px;
  --hb-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --hb-ease-in: cubic-bezier(0.4, 0, 1, 1);
}

*, *::before, *::after { box-sizing: border-box; }

#root {
  height: 100%;
  padding: var(--hb-pad);
  background: var(--widget-surface);
  color: var(--widget-text);
  font-family: var(--widget-font);
  font-size: var(--widget-font-size);
  line-height: var(--widget-line-height);
  display: flex;
  flex-direction: column;
  gap: var(--hb-section-gap);
  user-select: none;
  -webkit-user-select: none;
}

button {
  font: inherit;
  color: inherit;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--hb-section-gap);
}

.title {
  margin: 0;
  font-size: var(--widget-title-size);
  font-weight: var(--widget-title-weight);
  line-height: var(--widget-title-line-height);
}

/* The same box as a dot, so it sits directly above the last column. Vertical margins keep the header at title height. */
.add {
  width: var(--hb-dot);
  height: var(--hb-dot);
  margin: -6px 0;
  display: grid;
  place-items: center;
  border-radius: var(--widget-radius);
  color: var(--widget-text-muted);
  transition: background-color 120ms, color 120ms;
}
.add svg { width: 16px; height: 16px; }

/* Rows are subgrids, so every label and dot shares one set of tracks. */
.grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) repeat(7, var(--hb-dot));
  gap: var(--hb-dot-gap);
  touch-action: none;
}

.row {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: subgrid;
  align-items: center;
}

.dot {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--hb-off);
  transition: background-color 120ms, transform 280ms var(--hb-spring);
}
.dot::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: var(--hb-on);
  opacity: 0;
  transform: scale(0.4);
  transition: transform 140ms var(--hb-ease-in), opacity 140ms var(--hb-ease-in), background-color 120ms;
}
.dot.on::after {
  opacity: 1;
  transform: scale(1);
  transition: transform 360ms var(--hb-spring), opacity 90ms, background-color 120ms;
}
.dot.pressed { transform: scale(0.86); transition-duration: 120ms; }
.dot:focus-visible { outline: 2px solid var(--hb-on); outline-offset: 2px; }

.label {
  justify-self: start;
  /* Text sits on the content edge; the margins pull the tint box out and keep a 16px gap to the dots. */
  margin-left: calc(var(--hb-tint-inset) * -1);
  margin-right: calc(var(--hb-label-gap) - var(--hb-dot-gap) - var(--hb-tint-inset));
  padding: 2px var(--hb-tint-inset);
  border-radius: calc(var(--widget-radius) - 2px);
  font-weight: 600;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  cursor: text;
  outline: none;
  transition: background-color 120ms;
}
.label[contenteditable] { background: var(--hb-tint); user-select: text; -webkit-user-select: text; }
.label:empty::before { content: attr(data-placeholder); color: var(--widget-text-muted); }
.label:focus-visible { background: var(--hb-tint); }

@media (hover: hover) {
  .add:hover { background: var(--hb-tint); color: var(--widget-text); }
  .dot:hover { background: var(--hb-off-hover); }
  .dot.on:hover::after { background: var(--hb-on-hover); }
  .label:hover { background: var(--hb-tint); }
}

@media (prefers-reduced-motion: reduce) {
  .dot, .dot::after, .dot.on::after { transition-duration: 0ms; }
}

  editingId = null;
  const name = label.textContent.replace(/\s+/g, " ").trim();
  const remove = cancel ? habit.id === freshId : !name;
  if (remove) state.habits = state.habits.filter((h) => h !== habit);
  else if (!cancel) habit.name = name;
  freshId = null;
  save();
  render();
}

function endPaint() {
  if (!paint) return;
  root.querySelectorAll(".dot.pressed").forEach((dot) => dot.classList.remove("pressed"));
  paint = null;
  save();
}

root.addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  const editing = root.querySelector(".label[contenteditable]");
  if (editing && !editing.contains(event.target)) editing.blur();
  // The blur may have re-rendered, so find the dot under the pointer again.
  const dot = document.elementFromPoint(event.clientX, event.clientY)?.closest(".dot");
  if (!dot) return;
  event.preventDefault();
  paint = { on: !dot.classList.contains("on"), pointerId: event.pointerId, last: dot };
  dot.classList.add("pressed");
  setDot(dot, paint.on);
});

window.addEventListener("pointermove", (event) => {
  if (!paint || event.pointerId !== paint.pointerId) return;
  if (event.buttons === 0) return endPaint();
  const dot = document.elementFromPoint(event.clientX, event.clientY)?.closest(".dot");
  if (!dot || dot === paint.last) return;
  const from = paint.last;
  paint.last = dot;
  from.classList.remove("pressed");
  // Fill every dot between the last and current one so a fast drag leaves no gaps.
  if (from.parentElement === dot.parentElement) {
    const dots = [...dot.parentElement.querySelectorAll(".dot")];
    const a = dots.indexOf(from);
    const b = dots.indexOf(dot);
    const step = a < b ? 1 : -1;
    for (let i = a + step; i !== b + step; i += step) setDot(dots[i], paint.on);
  } else {
    setDot(dot, paint.on);
  }
});

window.addEventListener("pointerup", endPaint);
window.addEventListener("pointercancel", endPaint);
window.addEventListener("blur", endPaint);

root.addEventListener("click", (event) => {
  if (event.target.closest('[data-action="add"]')) {
    const id = "h" + Date.now().toString(36);
    state.habits.push({ id, name: "", done: {} });
    freshId = id;
    startEdit(id);
    return;
  }
  const dot = event.target.closest(".dot");
  // Pointer toggles happen on pointerdown; detail 0 is a keyboard activation.
  if (dot && event.detail === 0) {
    setDot(dot, !dot.classList.contains("on"));
    save();
    return;
  }
  const label = event.target.closest(".label:not([contenteditable])");
  if (label) startEdit(habitOf(label).id);
});

root.addEventListener("keydown", (event) => {
  const label = event.target.closest?.(".label");
  if (!label) return;
  if (label.isContentEditable) {
    if (event.key === "Enter" || event.key === "Escape") {
      event.preventDefault();
      finishEdit(label, event.key === "Escape");
    }
  } else if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    startEdit(habitOf(label).id);
  }
});

root.addEventListener("focusout", (event) => {
  const label = event.target.closest?.(".label[contenteditable]");
  if (label) finishEdit(label, false);
});

// Roll the window forward at midnight without interrupting a drag or an edit.
setInterval(() => {
  if (!paint && !editingId && dayKey(new Date()) !== renderedDay) render();
}, 60000);

if (typeof render === "function") { render(); }
</script></body></html>
