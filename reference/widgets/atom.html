/* === STYLE === */
:root {
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 20px;
  --tint: color-mix(in srgb, var(--widget-text) 7%, transparent);
  --rule: color-mix(in srgb, var(--widget-text) 14%, transparent);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --button: 28px;
  --tile: 64px;
  --proton: #ec6a56;
  --neutron: #aab4c2;
  --electron: #4a86ff;
}

#root {
  box-sizing: border-box;
  height: 100%;
  padding: var(--s5);
  display: flex;
  flex-direction: column;
  gap: var(--s4);
  background: var(--widget-surface);
  color: var(--widget-text);
  font-family: var(--widget-font);
  font-size: var(--widget-font-size);
  line-height: var(--widget-line-height);
  -webkit-user-select: none;
  user-select: none;
}

/* The atom owns the whole body; the panel floats in on the right while the atom glides aside. */
.body {
  position: relative;
  flex: 1 1 auto;
  min-height: 200px;
  contain: size;
  contain-intrinsic-size: 464px 260px;
}

.atom {
  position: absolute;
  inset: 0;
}
.atom canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.panel {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translate(8px, -50%);
  width: 196px;
  display: flex;
  flex-direction: column;
  gap: var(--s4);
}

/* Words and controls stay hidden until the widget is being used. */
.reveal {
  opacity: 0;
  transition: opacity 180ms var(--ease-out), transform 220ms var(--ease-out);
}
#root.is-revealed .reveal {
  opacity: 1;
  transform: translate(0, -50%);
}

.identity {
  display: grid;
  grid-template-columns: var(--tile) minmax(0, 1fr);
  gap: var(--s3);
  align-items: center;
}

.tile {
  position: relative;
  box-sizing: border-box;
  width: var(--tile);
  height: var(--tile);
  border: 1px solid var(--rule);
  border-radius: 12px;
  display: grid;
  place-items: center;
}
.z {
  position: absolute;
  top: 5px;
  left: 7px;
  font-size: calc(var(--widget-font-size) * 0.85);
  color: var(--widget-text-muted);
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.symbol {
  margin-top: 6px;
  font-size: calc(var(--widget-title-size) * 1.9);
  font-weight: 600;
  line-height: 1;
}

.facts {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.isotope { font-weight: 600; overflow-wrap: anywhere; }
.stability,
.charge { color: var(--widget-text-muted); }

.controls {
  display: flex;
  flex-direction: column;
  gap: var(--s1);
}
.row {
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr) var(--button) var(--button) var(--button);
  gap: var(--s2);
  align-items: center;
}
.row .label { margin-left: var(--s1); }
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 45%, white), var(--c) 60%);
}
.row[data-kind="p"] { --c: var(--proton); }
.row[data-kind="n"] { --c: var(--neutron); }
.row[data-kind="e"] { --c: var(--electron); }

.count {
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.step {
  width: var(--button);
  height: var(--button);
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--widget-text-muted);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: background-color 120ms ease, color 120ms ease, transform 120ms var(--ease-out), opacity 120ms ease;
}
.step svg { width: 16px; height: 16px; }
.step:active:not(:disabled) { transform: scale(0.96); }
.step:disabled { opacity: 0.35; cursor: default; }
.step:focus-visible { outline: 2px solid var(--widget-accent); outline-offset: 1px; }
@media (hover: hover) and (pointer: fine) {
  .step:hover:not(:disabled) { background: var(--tint); color: var(--widget-text); }
}
@media (prefers-reduced-motion: reduce) {
  .step:active:not(:disabled) { transform: none; }
  .panel { transform: translate(0, -50%); }
}

}

  const s = slots(nucleus.length);
  nucleus.forEach((p, k) => { [p.x, p.y] = s[k]; });
}

function addNucleon(type) {
  const angle = rand() * Math.PI * 2;
  nucleus.push({ type, x: Math.cos(angle) * 96, y: Math.sin(angle) * 96, a: 0 });
}

// The last particle takes the removed one's slot, so only one other particle moves.
function removeNucleon(type) {
  let i = -1;
  for (let k = nucleus.length - 1; k >= 0; k--) if (nucleus[k].type === type) { i = k; break; }
  if (i < 0) return;
  const [gone] = nucleus.splice(i, 1, nucleus[nucleus.length - 1]);
  nucleus.pop();
  fading.push({ ...gone, kind: "nucleon" });
}

// Each shell turns at its own pace; electrons ease into even spacing as the count changes.
const shells = SHELLS.map((_, s) => ({ phase: s * 1.3, ring: 0, electrons: [] }));
function syncElectrons(instant) {
  const want = shellCounts(counts.e);
  shells.forEach((shell, s) => {
    while (shell.electrons.length < want[s]) {
      const last = shell.electrons[shell.electrons.length - 1];
      shell.electrons.push({ rel: last ? last.rel : 0, a: instant ? 1 : 0 });
    }
    while (shell.electrons.length > want[s]) {
      const e = shell.electrons.pop();
      fading.push({ kind: "electron", shell: s, rel: e.rel, a: e.a });
    }
    if (instant) {
      shell.ring = want[s] ? 1 : 0;
      shell.electrons.forEach((e, k) => { e.rel = (Math.PI * 2 * k) / want[s]; });
    }
  });
}
syncElectrons(true);

// === RENDER ===
const canvas = root.querySelector(".atom canvas");
const zEl = root.querySelector(".z");
const symbolEl = root.querySelector(".symbol");
const isotopeEl = root.querySelector(".isotope");
const stabilityEl = root.querySelector(".stability");
const chargeEl = root.querySelector(".charge");
const rows = Object.fromEntries([...root.querySelectorAll(".row")].map((row) => [row.dataset.kind, row]));

// Canvas needs resolved colours, so theme variables are read through a hidden probe.
const probe = document.createElement("span");
probe.hidden = true;
root.append(probe);
function themeColour(name) {
  probe.style.color = `var(${name})`;
  const value = getComputedStyle(probe).color;
  const nums = (value.match(/[\d.]+/g) || ["0", "0", "0"]).map(Number);
  return value.startsWith("color(") ? nums.slice(0, 3).map((v) => v * 255) : nums.slice(0, 3);
}
const rgba = (c, a) => `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;

// Highlight, body and shadow tones for each particle.
const TONES = {
  p: [[255, 196, 182], [236, 106, 86], [168, 60, 46]],
  n: [[244, 246, 250], [170, 180, 194], [108, 118, 134]],
  e: [[208, 224, 255], [74, 134, 255], [38, 84, 204]],
};
const PANEL = 216; // panel width plus the gap before it

function fitCanvas() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  const pw = Math.max(1, Math.round(w * dpr)), ph = Math.max(1, Math.round(h * dpr));
  if (canvas.width !== pw || canvas.height !== ph) { canvas.width = pw; canvas.height = ph; }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

function sphere(ctx, x, y, r, tones, edge, alpha) {
  const [hi, mid, lo] = tones;
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r * 1.05);
  g.addColorStop(0, rgba(hi, alpha));
  g.addColorStop(0.55, rgba(mid, alpha));
  g.addColorStop(1, rgba(lo, alpha));
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  if (edge) { ctx.strokeStyle = rgba(edge, 0.9 * alpha); ctx.stroke(); }
}

let colours = null, coloursAt = 0;
const view = { shift: 0 };

function drawAtom(now) {
  const { ctx, w, h } = fitCanvas();
  ctx.clearRect(0, 0, w, h);
  if (w < 60 || h < 60) return;
  if (!colours || now - coloursAt > 500) {
    colours = { ink: themeColour("--widget-text"), surface: themeColour("--widget-surface") };
    coloursAt = now;
  }
  const { ink, surface } = colours;
  const roomy = w - PANEL >= 160;
  const size = Math.min(h, roomy ? w - PANEL : w);
  const u = size / 300;
  const cx = w / 2 + ((roomy ? (w - PANEL) / 2 : w / 2) - w / 2) * view.shift;
  const cy = h / 2;

  ctx.lineWidth = 1;
  shells.forEach((shell, s) => {
    if (shell.ring < 0.01) return;
    ctx.strokeStyle = rgba(ink, 0.13 * shell.ring);
    ctx.beginPath();
    ctx.arc(cx, cy, UNIT.rings[s] * u, 0, Math.PI * 2);
    ctx.stroke();
  });

  // Outer nucleons first so the centre reads as the top of a packed sphere.
  const count = nucleus.length;
  ctx.lineWidth = Math.max(0.75, u * 0.8);
  const nucleon = (p, k, n) => {
    const r = UNIT.proton * u * (1.06 - 0.14 * Math.sqrt((k + 0.5) / Math.max(1, n)));
    sphere(ctx, cx + p.x * u, cy + p.y * u, r, TONES[p.type], surface, Math.min(1, Math.max(0, p.a)));
  };
  for (const f of fading) if (f.kind === "nucleon") nucleon(f, count, count + 1);
  for (let k = count - 1; k >= 0; k--) nucleon(nucleus[k], k, count);

  // Electrons trail a short fading arc along their shell.
  const tail = 0.75;
  const electron = (s, rel, a) => {
    const shell = shells[s];
    const R = UNIT.rings[s] * u;
    const theta = shell.phase + rel;
    ctx.lineWidth = Math.max(1.25, u * 1.8);
    ctx.lineCap = "butt";
    const pieces = 18;
    for (let i = 0; i < pieces; i++) {
      const f = (i + 1) / pieces;
      ctx.strokeStyle = rgba(TONES.e[1], 0.5 * a * f * f);
      ctx.beginPath();
      ctx.arc(cx, cy, R, theta - tail * (1 - i / pieces), theta - tail * (1 - f) + 0.004);
      ctx.stroke();
    }
    ctx.lineWidth = Math.max(0.75, u * 0.8);
    sphere(ctx, cx + R * Math.cos(theta), cy + R * Math.sin(theta), UNIT.electron * u, TONES.e, surface, a);
  };
  shells.forEach((shell, s) => shell.electrons.forEach((e) => electron(s, e.rel, Math.min(1, e.a))));
  for (const f of fading) if (f.kind === "electron") electron(f.shell, f.rel, Math.max(0, f.a));
}

function render() {
  const [symbol, name, stable] = ELEMENTS[counts.p];
  const mass = counts.p + counts.n;
  const charge = counts.p - counts.e;
  zEl.textContent = String(counts.p);
  symbolEl.textContent = symbol;
  isotopeEl.textContent = `${name}-${mass}`;
  stabilityEl.textContent = stable.includes(mass) ? "Stable" : "Radioactive";
  chargeEl.textContent = charge === 0 ? "Neutral atom" : `Ion, ${Math.abs(charge)}${charge > 0 ? "+" : "−"}`;
  for (const kind of ["p", "n", "e"]) {
    const row = rows[kind];
    row.querySelector(".count").textContent = String(counts[kind]);
    row.querySelector('[data-step="-1"]').disabled = counts[kind] <= LIMITS[kind][0];
    row.querySelector('[data-step="1"]').disabled = counts[kind] >= LIMITS[kind][1];
  }
  wake();
}

// === EVENTS ===
root.addEventListener("click", (event) => {
  const button = event.target.closest(".step");
  if (!button || button.disabled) return;
  const kind = button.dataset.kind;
  const step = Number(button.dataset.step);
  const next = counts[kind] + step;
  if (next < LIMITS[kind][0] || next > LIMITS[kind][1]) return;
  counts[kind] = next;
  if (kind === "e") syncElectrons(false);
  else if (step > 0) addNucleon(kind);
  else removeNucleon(kind);
  save();
  render();
});

// Hover, focus or touch shows the words and controls; they leave soon after.
let hideTimer = 0;
function reveal(on, after = 500) {
  clearTimeout(hideTimer);
  if (on) { root.classList.add("is-revealed"); wake(); return; }
  hideTimer = setTimeout(() => {
    // A mouse click focuses too; only keyboard focus keeps the controls up.
    if (root.querySelector(":focus-visible")) return;
    root.classList.remove("is-revealed");
    wake();
  }, after);
}
root.addEventListener("pointerenter", (event) => { if (event.pointerType === "mouse") reveal(true); });
root.addEventListener("pointerleave", (event) => { if (event.pointerType === "mouse") reveal(false); });
root.addEventListener("pointerdown", (event) => { reveal(true); if (event.pointerType !== "mouse") reveal(false, 3000); }, true);
root.addEventListener("focusin", () => reveal(true));
root.addEventListener("focusout", () => reveal(false));
window.addEventListener("blur", () => reveal(false));

const calm = matchMedia("(prefers-reduced-motion: reduce)");

// Moves everything one frame towards where it belongs. Returns true once nothing is still settling.
function step(dt) {
  const k = 1 - Math.exp(-dt * 10);
  let settled = true;
  const near = (a, b) => Math.abs(a - b) < 0.002;
  const target = slots(nucleus.length);
  nucleus.forEach((p, i) => {
    const [tx, ty] = target[i];
    p.x += (tx - p.x) * k; p.y += (ty - p.y) * k; p.a += (1 - p.a) * k;
    if (!near(p.x, tx) || !near(p.y, ty) || !near(p.a, 1)) settled = false;
  });
  for (let i = fading.length - 1; i >= 0; i--) {
    const f = fading[i];
    f.a -= dt * 6;
    if (f.kind === "nucleon") { f.x *= 1 + dt * 1.5; f.y *= 1 + dt * 1.5; }
    if (f.a <= 0) fading.splice(i, 1); else settled = false;
  }
  shells.forEach((shell, s) => {
    const m = shell.electrons.length;
    if (!calm.matches) shell.phase += (dt * 0.5) / (1 + s * 0.55);
    shell.ring += ((m ? 1 : 0) - shell.ring) * k;
    if (!near(shell.ring, m ? 1 : 0)) settled = false;
    shell.electrons.forEach((e, i) => {
      let diff = (Math.PI * 2 * i) / m - e.rel;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      e.rel += diff * (1 - Math.exp(-dt * 6));
      e.a += (1 - e.a) * k;
      if (Math.abs(diff) > 0.002 || !near(e.a, 1)) settled = false;
    });
  });
  const want = root.classList.contains("is-revealed") ? 1 : 0;
  const glide = calm.matches ? 1 : 1 - Math.exp(-dt * 9);
  view.shift += (want - view.shift) * glide;
  if (!near(view.shift, want)) settled = false;
  return settled && (calm.matches || !shells.some((s) => s.electrons.length));
}

// The electrons keep orbiting while visible; with reduced motion the loop sleeps once settled.
let running = false, last = 0;
function frame(now) {
  if (!running) return;
  const dt = Math.min(0.05, (now - last) / 1000 || 0);
  last = now;
  const settled = step(dt);
  drawAtom(now);
  if (settled || document.hidden) { running = false; return; }
  requestAnimationFrame(frame);
}
function wake() {
  if (running || document.hidden) return;
  running = true;
  last = performance.now();
  requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange", wake);
calm.addEventListener("change", wake);
new ResizeObserver(() => { drawAtom(performance.now()); wake(); }).observe(canvas);

if (typeof render === "function") { render(); }
</script></body></html>
